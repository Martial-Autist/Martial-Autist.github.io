h","u":"1 hour","m":"VSM","k":0,"r":0,"x":"This spell wards a willing creature you touch and creates a mystic connection between you and the target until the spell ends. While the target is within 60 feet of you, it gains a +1 bonus to AC and saving throws, and it has resistance to all damage. Also, each time it takes damage, you take the same amount of damage. The spell ends if you drop to 0 hit points or if you and the target become separated by more than 60 feet. It also ends if the spell is cast again on either of the connected creatures. You can also dismiss the spell as an action."},{"n":"Water Breathing","l":3,"s":"Tran","c":["druid","ranger","sorcerer","wizard"],"t":"1 action","g":"30 feet","u":"24 hours","m":"VSM","k":0,"r":1,"x":"This spell gives a maximum of ten willing creatures within range and you can see, the ability to breathe underwater until the end of its term. Affected creatures also retain their normal breathing pattern."},{"n":"Water Walk","l":3,"s":"Tran","c":["cleric","druid","ranger","sorcerer"],"t":"1 action","g":"30 feet","u":"1 hour","m":"VSM","k":0,"r":1,"x":"This spell grants the ability to move across any liquid surface--such as water, acid, mud, snow, quicksand, or lava--as if it were harmless solid ground (creatures crossing molten lava can still take damage from the heat). Up to ten willing creatures you can see within range gain this ability for the duration. If you target a creature submerged in a liquid, the spell carries the target to the surface of the liquid at a rate of 60 feet per round."},{"n":"Web","l":2,"s":"Conj","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You conjure a mass of thick, sticky webbing at a point of your choice within range. The webs fill a 20-foot cube from that point for the duration. The webs are difficult terrain and lightly obscure their area. If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the conjured web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet. Each creature that starts its turn in the webs or that enters them during its turn must make a dexterity saving throw. On a failed save, the creature is restrained as long as it remains in the webs or until it\u2026"},{"n":"Weird","l":9,"s":"Illu","c":["wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"Drawing on the deepest fears of a group of creatures, you create illusory creatures in their minds, visible only to them. Each creature in a 30-foot-radius sphere centered on a point of your choice within range must make a wisdom saving throw. On a failed save, a creature becomes frightened for the duration. The illusion calls on the creature's deepest fears, manifesting its worst nightmares as an implacable threat. At the start of each of the frightened creature's turns, it must succeed on a wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends for that creature.","v":"wis","hf":0},{"n":"Wind Walk","l":6,"s":"Tran","c":["druid"],"t":"1 minute","g":"30 feet","u":"8 hours","m":"VSM","k":0,"r":0,"x":"You and up to ten willing creatures you can see within range assume a gaseous form for the duration, appearing as wisps of cloud. While in this cloud form, a creature has a flying speed of 300 feet and has resistance to damage from nonmagical weapons. The only actions a creature can take in this form are the Dash action or to revert to its normal form. Reverting takes 1 minute, during which time a creature is incapacitated and can't move. Until the spell ends, a creature can revert to cloud form, which also requires the 1-minute transformation. If a creature is in cloud form and flying when the effect ends, the creature descends 60 feet per round for 1 minute until it lands, which\u2026"},{"n":"Wind Wall","l":3,"s":"Evoc","c":["druid","ranger"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A wall of strong wind rises from the ground at a point you choose within range. You can make the wall up to 50 feet long, 15 feet high, and 1 foot thick. You can shape the wall in any way you choose so long as it makes one continuous path along the ground. The wall lasts for the duration. When the wall appears, each creature within its area must make a strength saving throw. A creature takes 3d8 bludgeoning damage on a failed save, or half as much damage on a successful one. The strong wind keeps fog, smoke, and other gases at bay. Small or smaller flying creatures or objects can't pass through the wall. Loose, lightweight materials brought into the wall fly upward. Arrows, bolts,\u2026","v":"str","hf":1,"dt":"bludgeoning","d":"3d8"},{"n":"Wish","l":9,"s":"Conj","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"V","k":0,"r":0,"x":"Wish is the mightiest spell a mortal creature can cast. By simply speaking aloud, you can alter the very foundations of reality in accord with your desires. The basic use of this spell is to duplicate any other spell of 8th level or lower. You don't need to meet any requirements in that spell, including costly components. The spell simply takes effect. Alternatively, you can create one of the following effects of your choice: - You create one object of up to 25,000 gp in value that isn't a magic item. The object can be no more than 300 feet in any dimension, and it appears in an unoccupied space you can see on the ground. - You allow up to twenty creatures that you can see to\u2026"},{"n":"Word of Recall","l":6,"s":"Conj","c":["cleric"],"t":"1 action","g":"5 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You and up to five willing creatures within 5 feet of you instantly teleport to a previously designated sanctuary. You and any creatures that teleport with you appear in the nearest unoccupied space to the spot you designated when you prepared your sanctuary (see below). If you cast this spell without first preparing a sanctuary, the spell has no effect. You must designate a sanctuary by casting this spell within a location, such as a temple, dedicated to or strongly linked to your deity. If you attempt to cast the spell in this manner in an area that isn't dedicated to your deity, the spell has no effect."},{"n":"Zone of Truth","l":2,"s":"Ench","c":["bard","cleric","paladin"],"t":"1 action","g":"60 feet","u":"10 minutes","m":"VS","k":0,"r":0,"x":"You create a magical zone that guards against deception in a 15-foot-radius sphere centered on a point of your choice within range. Until the spell ends, a creature that enters the spell's area for the first time on a turn or starts its turn there must make a Charisma saving throw. On a failed save, a creature can't speak a deliberate lie while in the radius. You know whether each creature succeeds or fails on its saving throw. An affected creature is aware of the spell and can thus avoid answering questions to which it would normally respond with a lie. Such a creature can remain evasive in its answers as long as it remains within the boundaries of the truth."}],"subs":{"Life":{"cls":"Cleric","always":true,"sp":[[1,"Bless",""],[1,"Cure Wounds",""],[3,"Lesser Restoration",""],[3,"Spiritual Weapon",""],[5,"Beacon of Hope",""],[5,"Revivify",""],[7,"Death Ward",""],[9,"Mass Cure Wounds",""],[9,"Raise Dead",""]]},"Land":{"cls":"Druid","always":true,"sp":[[3,"Hold Person","arctic"],[3,"Spike Growth","arctic"],[5,"Sleet Storm","arctic"],[5,"Slow","arctic"],[7,"Freedom of Movement","arctic"],[7,"Ice Storm","arctic"],[9,"Commune With Nature","arctic"],[9,"Cone of Cold","arctic"],[3,"Mirror Image","coast"],[3,"Misty Step","coast"],[5,"Water Breathing","coast"],[5,"Water Walk","coast"],[7,"Control Water","coast"],[7,"Freedom of Movement","coast"],[9,"Conjure Elemental","coast"],[9,"Scrying","coast"],[3,"Blur","desert"],[3,"Silence","desert"],[5,"Create Food and Water","desert"],[5,"Protection From Energy","desert"],[7,"Blight","desert"],[7,"Hallucinatory Terrain","desert"],[9,"Insect Plague","desert"],[9,"Wall of Stone","desert"],[3,"Barkskin","forest"],[3,"Spider Climb","forest"],[5,"Call Lightning","forest"],[5,"Plant Growth","forest"],[7,"Divination","forest"],[7,"Freedom of Movement","forest"],[9,"Commune With Nature","forest"],[9,"Tree Stride","forest"],[3,"Invisibility","grassland"],[3,"Pass Without Trace","grassland"],[5,"Daylight","grassland"],[5,"Haste","grassland"],[7,"Divination","grassland"],[7,"Freedom of Movement","grassland"],[9,"Dream","grassland"],[9,"Insect Plague","grassland"],[3,"Spider Climb","mountain"],[3,"Spike Growth","mountain"],[5,"Lightning Bolt","mountain"],[5,"Meld Into Stone","mountain"],[7,"Stone Shape","mountain"],[7,"Stoneskin","mountain"],[9,"Passwall","mountain"],[9,"Wall of Stone","mountain"],[3,"Acid Arrow","swamp"],[3,"Darkness","swamp"],[5,"Water Walk","swamp"],[5,"Stinking Cloud","swamp"],[7,"Freedom of Movement","swamp"],[7,"Locate Creature","swamp"],[9,"Insect Plague","swamp"],[9,"Scrying","swamp"]]},"Devotion":{"cls":"Paladin","always":true,"sp":[[3,"Protection from Evil and Good",""],[3,"Sanctuary",""],[5,"Lesser Restoration",""],[5,"Zone of Truth",""],[9,"Beacon of Hope",""],[9,"Dispel Magic",""],[13,"Freedom of Movement",""],[13,"Guardian of Faith",""],[17,"Commune",""],[17,"Flame Strike",""]]},"Fiend":{"cls":"Warlock","always":false,"sp":[[1,"Burning Hands",""],[1,"Command",""],[3,"Blindness/Deafness",""],[3,"Scorching Ray",""],[5,"Fireball",""],[5,"Stinking Cloud",""],[7,"Fire Shield",""],[7,"Wall of Fire",""],[9,"Flame Strike",""],[9,"Hallow",""]]}}};</script>

function syncClassResources(){
  if(!S||!S.classes) return false; if(!S.resDismissed) S.resDismissed={};
  const cl=S.classes; let changed=false;
  RES_DEFS.forEach(d=>{
    if(!d.when(cl)) return;
    let r=S.resources.find(x=>x.auto===d.key)||S.resources.find(x=>!x.auto&&String(x.name||'').trim().toLowerCase()===d.name.toLowerCase());
    if(!r){ if(S.resDismissed[d.key]) return; const mx=d.max(cl); r={id:uid(),name:d.name,max:mx,cur:mx,reset:d.reset,die:d.die?d.die(cl):'',auto:d.key}; S.resources.push(r); changed=true; return; }
    if(!r.auto){ r.auto=d.key; r.reset=d.reset; if(d.die&&!r.die) r.die=d.die(cl); changed=true; }
    if(r.autoMax!==false){ const mx=d.max(cl); if(mx!==r.max){ const diff=mx-r.max; r.max=mx; r.cur=Math.max(0,Math.min(mx,r.cur+Math.max(0,diff))); changed=true; } }
    if(d.die&&r.autoDie!==false){ const dd=d.die(cl); if(dd!==r.die){ r.die=dd; changed=true; } }
  });
  return changed;
}

function syncSubclassSpells(){
  if(!S||!S.classes) return false; S.spellDismissed=S.spellDismissed||{}; let changed=false;
  S.classes.forEach(c=>{ const sub=String(c.sub||'').toLowerCase(); if(!sub) return;
    Object.keys(ALL_SUBS).forEach(key=>{ const def=ALL_SUBS[key]; if(def.cls.toLowerCase()!==(c.name||'').toLowerCase()||!def.always) return;
      if(!new RegExp('\\b'+key.toLowerCase()+'\\b').test(sub)) return;
      def.sp.forEach(([lv,name,terrain])=>{
        if((Number(c.level)||0)<lv) return; if(terrain&&!sub.includes(terrain)) return;
        if(S.spellDismissed[name]) return;
        const have=S.spells.find(s=>s.name.toLowerCase()===name.toLowerCase());
        const label=c.name==='Cleric'?'Domain':c.name==='Paladin'?'Oath':c.name==='Druid'?'Circle':'Subclass';
        if(have){ if(have.prep!=='always'){ have.prep='always'; have.source=label; changed=true; } return; }
        const o=SPELL_IX[name.toLowerCase()];
        const lvl=o?o.l:(c.name==='Paladin'?PAL_TH[lv]:Math.ceil(lv/2));

  });

}

 'Ancestral Guardian':[[3,'Ancestral Protectors','The first creature you hit each turn while raging has disadvantage on attacks against anyone else, and they take half damage.'],[6,'Spirit Shield','Reaction while raging: reduce damage to an ally within 30 ft by 2d6 (3d6 at 10, 4d6 at 14).',{pw:{attach:'self',dmg:'{2+(barbarian>=10)+(barbarian>=14)}d6',rollLabel:'Damage prevented',note:'Reaction while raging, ally within 30 ft'}}],[10,'Consult the Spirits','Cast augury or clairvoyance without a slot, once per short rest.'],[14,'Vengeful Ancestors','Spirit Shield also deals the prevented damage as force to the attacker.']],
 'Storm Herald':[[3,'Storm Aura','While raging, a 10 ft aura of desert, sea or tundra power each turn.'],[6,'Storm Soul','Resistance and a utility benefit from your chosen environment.'],[10,'Shielding Storm','Allies in your aura gain your Storm Soul resistance.'],[14,'Raging Storm','A reaction effect tied to your environment.']],
 'Zealot':[[3,'Divine Fury','While raging, the first creature you hit each turn takes extra 1d6 + half barbarian level radiant or necrotic.',{lib:'Divine Fury (Zealot)'}],[3,'Warrior of the Gods','Spells that restore you to life need no material component.'],[6,'Fanatical Focus','Once per rage, reroll a failed saving throw.'],[10,'Zealous Presence','Bonus action, once per long rest: up to 10 allies get advantage on attacks and saves until your next turn.'],[14,'Rage Beyond Death','While raging, you don\'t die at 0 HP until the rage ends.']],
 'Beast':[[3,'Form of the Beast','When you rage, grow bite (1d8, heal), claws (1d6, extra attack) or tail (1d8, reach, reaction AC).'],[6,'Bestial Soul','Natural weapons count as magical; gain swim, climb or jump benefits.'],[10,'Infectious Fury','On a natural-weapon hit, force a WIS save: the target attacks another creature or takes 2d12 psychic.'],[14,'Call the Hunt','When you rage, allies gain +1d6 damage once per turn; you gain 5 temp HP per ally.']],
 'Wild Magic':[[3,'Magic Awareness','Sense spells and magic items within 60 ft.'],[3,'Wild Surge','When you rage, roll on the Wild Magic table.'],[6,'Bolstering Magic','Give a creature 1d3 to attacks/checks or restore a low-level slot.'],[10,'Unstable Backlash','When hit or failing a save while raging, reroll your surge.'],[14,'Controlled Surge','Roll twice on the surge table and choose.']]},
 f:[[1,'Rage','Bonus action: advantage on STR checks/saves, bonus damage, resistance to bludgeoning, piercing and slashing.',{lib:'Rage'}],[1,'Unarmored Defense','Without armour, AC = 10 + DEX + CON (pick it under Armour in Setup).'],[2,'Reckless Attack','Advantage on STR melee attacks this turn; attacks against you have advantage.',{lib:'Reckless Attack'}],[2,'Danger Sense','Advantage on DEX saves against effects you can see.'],[5,'Extra Attack','Attack twice when you take the Attack action.'],[5,'Fast Movement','+10 ft speed without heavy armour.',{fx:[{target:'speed',value:10}]}],[7,'Feral Instinct','Advantage on initiative; act normally if surprised if you rage first.'],[9,'Brutal Critical','Roll one extra weapon die on a melee crit (two at 13, three at 17).'],[11,'Relentless Rage','Drop to 0 HP while raging: DC 10 CON save to stay at 1 HP (DC +5 each time).'],[15,'Persistent Rage','Rage only ends early if you fall unconscious or choose to end it.'],[18,'Indomitable Might','STR checks use at least your STR score.'],[20,'Primal Champion','+4 STR and CON (max 24).',{fx:[{target:'score:str',value:4},{target:'score:con',value:4}]}]]},
Bard:{sub:3,subs:{
 'Lore':[[3,'Bonus Proficiencies','Three extra skill proficiencies.'],[3,'Cutting Words','Reaction: spend Bardic Inspiration to subtract the die from an enemy\'s roll.',{lib:'Cutting Words'}],[6,'Additional Magical Secrets','Learn two spells from any class.'],[14,'Peerless Skill','Add a Bardic Inspiration die to your own ability check.']],
 'Valor':[[3,'Bonus Proficiencies','Medium armour, shields and martial weapons.'],[3,'Combat Inspiration','Inspiration can add to damage or AC against one attack.'],[6,'Extra Attack','Attack twice when you take the Attack action.'],[14,'Battle Magic','After casting a spell, make one weapon attack as a bonus action.']],
 'Glamour':[[3,'Mantle of Inspiration','Bonus action, spend Inspiration: allies gain temp HP and move without provoking.'],[3,'Enthralling Performance','After performing 1 minute, charm listeners (WIS save).'],[6,'Mantle of Majesty','Cast command as a bonus action each turn for 1 minute.'],[14,'Unbreakable Majesty','Attackers must save or pick another target.']],
 'Swords':[[3,'Bonus Proficiencies','Medium armour and scimitars.'],[3,'Fighting Style','Dueling or Two-Weapon Fighting.'],[3,'Blade Flourish','Spend Inspiration on a hit for a flourish.',{lib:'Defensive Flourish (Swords)'}],[6,'Extra Attack','Attack twice when you take the Attack action.'],[14,'Master\'s Flourish','Use a d6 instead of Inspiration for flourishes.']],
 'Whispers':[[3,'Psychic Blades','Spend Inspiration on a hit for extra psychic damage.',{lib:'Psychic Blades (Whispers)'}],[3,'Words of Terror','After 1 minute of talk, frighten a creature (WIS save).'],[6,'Mantle of Whispers','Steal a dying humanoid\'s shadow to take its appearance.'],[14,'Shadow Lore','Charm a creature into obedience by whispering its secret.']],
 'Creation':[[3,'Mote of Potential','Inspiration also creates a mote with an extra effect for checks, attacks or saves.'],[3,'Performance of Creation','Create a nonmagical item worth up to 20 × bard level gp.'],[6,'Animating Performance','Animate a Large or smaller item as a dancing companion.'],[14,'Creative Crescendo','Create several items with Performance of Creation.']],
 'Eloquence':[[3,'Silver Tongue','Persuasion and Deception rolls of 9 or lower count as 10.'],[3,'Unsettling Words','Bonus action, spend Inspiration: subtract the roll from a creature\'s next save.',{lib:'Unsettling Words (Eloquence)'}],[6,'Unfailing Inspiration','Inspiration isn\'t used up when the roll still fails.'],[6,'Universal Speech','Make creatures understand you for 1 hour.'],[14,'Infectious Inspiration','When Inspiration succeeds, give another die as a reaction.']]},
 f:[[1,'Bardic Inspiration','Bonus action: give a creature an inspiration die to add to one roll.',{lib:'Bardic Inspiration'}],[2,'Jack of All Trades','Add half proficiency to checks you aren\'t proficient in.'],[2,'Song of Rest','Allies who spend hit dice on a short rest regain extra 1d6 (more at higher levels).'],[3,'Expertise','Double proficiency for two skills.'],[5,'Font of Inspiration','Bardic Inspiration returns on a short rest.'],[6,'Countercharm','Action: allies within 30 ft gain advantage on saves against fear and charm.'],[10,'Magical Secrets','Learn two spells from any class.'],[10,'Expertise','Double proficiency for two more skills.'],[14,'Magical Secrets','Learn two more spells from any class.'],[18,'Magical Secrets','Learn two more spells from any class.'],[20,'Superior Inspiration','Regain one Bardic Inspiration if you have none when you roll initiative.']]},
Cleric:{sub:1,subs:{
 'Knowledge':[[1,'Blessings of Knowledge','Two languages and expertise in two knowledge skills.'],[2,'Knowledge of the Ages','Channel Divinity: proficiency with any skill or tool for 10 minutes.'],[6,'Read Thoughts','Channel Divinity: read a creature\'s surface thoughts, then cast suggestion.'],[8,'Potent Spellcasting','Add WIS to cleric cantrip damage.'],[17,'Visions of the Past','Meditate to see recent events around an object or place.']],
 'Life':[[1,'Bonus Proficiency','Heavy armour.'],[1,'Disciple of Life','Healing spells restore an extra 2 + spell level HP.'],[2,'Preserve Life','Channel Divinity: share 5 × cleric level HP among nearby creatures.',{lib:'Preserve Life (Life)'}],[6,'Blessed Healer','Healing others also heals you 2 + spell level.'],[8,'Divine Strike','Once per turn, +1d8 radiant on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Radiant, once per turn'}}],[17,'Supreme Healing','Healing spells heal the maximum instead of rolling.']],
 'Light':[[1,'Bonus Cantrip','You know light.'],[1,'Warding Flare','Reaction: impose disadvantage on an attack against you (WIS mod uses per long rest).'],[2,'Radiance of the Dawn','Channel Divinity: dispel magical darkness and burn enemies within 30 ft.',{lib:'Radiance of the Dawn (Light)'}],[6,'Improved Flare','Warding Flare can protect allies.'],[8,'Potent Spellcasting','Add WIS to cleric cantrip damage.'],[17,'Corona of Light','Sunlight aura gives enemies disadvantage on saves against fire and radiant spells.']],
 'Nature':[[1,'Acolyte of Nature','A druid cantrip and a nature skill.'],[1,'Bonus Proficiency','Heavy armour.'],[2,'Charm Animals and Plants','Channel Divinity: charm beasts and plants within 30 ft.'],[6,'Dampen Elements','Reaction: give resistance to acid, cold, fire, lightning or thunder damage.'],[8,'Divine Strike','Once per turn, +1d8 cold, fire or lightning on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Cold, fire or lightning, once per turn'}}],[17,'Master of Nature','Command charmed beasts and plants as a bonus action.']],
 'Tempest':[[1,'Bonus Proficiencies','Martial weapons and heavy armour.'],[1,'Wrath of the Storm','Reaction when hit: 2d8 lightning or thunder (DEX save for half).',{pw:{attach:'self',dmg:'2d8',rollLabel:'Lightning or thunder',save:'dex',dcType:'spell',note:'Reaction, WIS mod uses per long rest'}}],[2,'Destructive Wrath','Channel Divinity: maximise lightning or thunder damage.',{lib:'Destructive Wrath (Tempest)'}],[6,'Thunderbolt Strike','Lightning damage can push Large or smaller creatures 10 ft.'],[8,'Divine Strike','Once per turn, +1d8 thunder on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Thunder, once per turn'}}],[17,'Stormborn','Flying speed equal to walking speed outdoors.']],
 'Trickery':[[1,'Blessing of the Trickster','Give a creature advantage on Stealth for 1 hour.'],[2,'Invoke Duplicity','Channel Divinity: create an illusory double to cast through and flank with.'],[6,'Cloak of Shadows','Channel Divinity: become invisible until your next turn.'],[8,'Divine Strike','Once per turn, +1d8 poison on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Poison, once per turn'}}],[17,'Improved Duplicity','Up to four duplicates.']],
 'War':[[1,'Bonus Proficiencies','Martial weapons and heavy armour.'],[1,'War Priest','Bonus-action weapon attack after the Attack action (WIS mod uses per long rest).'],[2,'Guided Strike','Channel Divinity: +10 to an attack roll.',{lib:'Guided Strike (War)'}],[6,'War God\'s Blessing','Channel Divinity: +10 to an ally\'s attack roll.'],[8,'Divine Strike','Once per turn, +1d8 weapon damage on a hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Same type as the weapon, once per turn'}}],[17,'Avatar of Battle','Resistance to nonmagical bludgeoning, piercing and slashing.']],
 'Death':[[1,'Bonus Proficiency','Martial weapons.'],[1,'Reaper','Necromancy cantrips that target one creature can target two within 5 ft of each other.'],[2,'Touch of Death','Channel Divinity: on a melee hit, extra 5 + 2 × cleric level necrotic.',{pw:{attach:'attack',res:'cd',cost:1,dmg:'{5+2*cleric}',note:'Necrotic, Channel Divinity'}}],[6,'Inescapable Destruction','Your necrotic damage ignores resistance.'],[8,'Divine Strike','Once per turn, +1d8 necrotic on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Necrotic, once per turn'}}],[17,'Improved Reaper','Single-target necromancy spells of 1st–5th level can target a second creature.']],

 'Grave':[[1,'Circle of Mortality','Healing a creature at 0 HP uses max dice; spare the dying as a bonus action at 30 ft.'],[1,'Eyes of the Grave','Sense undead within 60 ft (WIS mod uses per long rest).'],[2,'Path to the Grave','Channel Divinity: curse a creature so the next hit deals double damage.'],[6,'Sentinel at Death\'s Door','Reaction: turn a critical hit into a normal hit.'],[8,'Potent Spellcasting','Add WIS to cleric cantrip damage.'],[17,'Keeper of Souls','When an enemy dies nearby, heal a creature by its hit dice.']],
 'Order':[[1,'Bonus Proficiencies','Heavy armour and a social skill.'],[1,'Voice of Authority','When you cast a spell on an ally, they can make a reaction attack.'],[2,'Order\'s Demand','Channel Divinity: charm creatures within 30 ft and make them drop items (WIS save).'],[6,'Embodiment of the Law','Cast enchantment spells as a bonus action (WIS mod per long rest).'],[8,'Divine Strike','Once per turn, +1d8 psychic on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Psychic, once per turn'}}],[17,'Order\'s Wrath','Divine Strike curses the target: the next ally hit deals +2d8 psychic.']],
 'Peace':[[1,'Implement of Peace','Insight, Performance or Persuasion proficiency.'],[1,'Emboldening Bond','Bond creatures: +1d4 to one attack, check or save each turn.',{lib:'Emboldening Bond (Peace)'}],[2,'Balm of Peace','Channel Divinity: move without provoking and heal creatures you pass.'],[6,'Protective Bond','Bonded creatures can teleport to take damage for each other.'],[8,'Potent Spellcasting','Add WIS to cleric cantrip damage.'],[17,'Expansive Bond','Bond range 60 ft; protecting gives resistance.']],
 'Twilight':[[1,'Bonus Proficiencies','Martial weapons and heavy armour.'],[1,'Eyes of Night','Darkvision 300 ft; share it with allies.'],[1,'Vigilant Blessing','Give a creature advantage on its next initiative roll.'],[2,'Twilight Sanctuary','Channel Divinity: aura giving temp HP or ending charm/fear.',{lib:'Twilight Sanctuary (Twilight)'}],[6,'Steps of Night','Flying speed in dim light or darkness (prof uses per long rest).'],[8,'Divine Strike','Once per turn, +1d8 radiant on a weapon hit (2d8 at 14).',{pw:{attach:'attack',dmg:'{1+(cleric>=14)}d8',note:'Radiant, once per turn'}}],[17,'Twilight Shroud','Twilight Sanctuary also gives half cover.']]},
 f:[[2,'Channel Divinity: Turn Undead','Undead within 30 ft must flee (WIS save).',{lib:'Turn Undead'}],[5,'Destroy Undead','Turned undead of CR 1/2 or lower are destroyed (higher CR at 8, 11, 14, 17).'],[10,'Divine Intervention','Call on your deity; succeeds on a d100 roll at or under your cleric level.',{pw:{attach:'self',dmg:'1d100',rollLabel:'Success if at or under your cleric level',note:'Once per long rest (7 days if it works)'}}],[20,'Divine Intervention Improvement','Divine Intervention always succeeds.']]},
Druid:{sub:2,subs:{
 'Land':[[2,'Bonus Cantrip','One extra druid cantrip.'],[2,'Natural Recovery','Short rest: recover spell slots totalling half your druid level.'],[3,'Circle Spells','Always-prepared spells from your land (write it in the subclass, e.g. "Land (Forest)").'],[6,'Land\'s Stride','Move through nonmagical difficult terrain freely; advantage against magical plants.'],[10,'Nature\'s Ward','Immune to poison and disease; can\'t be charmed or frightened by elementals or fey.'],[14,'Nature\'s Sanctuary','Beasts and plants must save to attack you.']],

 'Dreams':[[2,'Balm of the Summer Court','Bonus action: heal with a pool of d6s and give temp HP.'],[6,'Hearth of Moonlight and Shadow','Protected rest area with bonus Stealth and Perception.'],[10,'Hidden Paths','Bonus action teleport 60 ft (WIS mod uses per long rest).'],[14,'Walker in Dreams','Cast dream, scrying or teleportation circle once per long rest.']],

 'Stars':[[2,'Star Map','Guidance and guiding bolt always prepared; free guiding bolts (prof bonus per long rest).'],[2,'Starry Form','Spend Wild Shape to become a constellation: Archer, Chalice or Dragon.',{pw:{attach:'self',res:'wild',cost:1,note:'10 minutes. Pick Archer, Chalice or Dragon below'}}],[2,'Starry Form: Archer','Bonus action ranged spell attack: 1d8 + WIS radiant (2d8 at 10th).',{pw:{attach:'self',dmg:'{1+(druid>=10)}d8+wis',rollLabel:'Radiant (make a ranged spell attack)',note:'Bonus action while in Archer form'}}],[2,'Starry Form: Chalice','When you heal with a spell, heal a creature within 30 ft for 1d8 + WIS (2d8 at 10th).',{pw:{attach:'spell',dmg:'{1+(druid>=10)}d8+wis',note:'Chalice: second creature heals this much'}}],[2,'Starry Form: Dragon','INT/WIS checks and concentration saves: treat rolls of 9 or lower as 10.'],[6,'Cosmic Omen','Weal or woe: add or subtract 1d6 from a nearby roll as a reaction.',{pw:{attach:'self',dmg:'1d6',rollLabel:'Add (weal) or subtract (woe)',note:'Reaction, prof bonus uses per long rest'}}],[10,'Twinkling Constellations','Starry form dice increase to 2d8; Dragon form gains 20 ft fly; switch forms each turn.'],[14,'Full of Stars','Resistance to bludgeoning, piercing and slashing in Starry Form.']],

 f:[[1,'Druidic','The secret druid language.'],[2,'Wild Shape','Transform into a beast you\'ve seen (CR 1/4, no swim/fly; CR 1/2 at 4th; CR 1 with fly at 8th).',{lib:'Wild Shape'}],[18,'Timeless Body','You age 1 year for every 10.'],[18,'Beast Spells','Cast spells in Wild Shape.'],[20,'Archdruid','Unlimited Wild Shape; ignore many spell components.']]},
Fighter:{sub:3,subs:{
 'Champion':[[3,'Improved Critical','Weapon attacks crit on 19–20.'],[7,'Remarkable Athlete','Add half proficiency to STR, DEX and CON checks you lack proficiency in.'],[10,'Additional Fighting Style','Choose a second fighting style.'],[15,'Superior Critical','Weapon attacks crit on 18–20.'],[18,'Survivor','At or under half HP, regain 5 + CON HP each turn.']],

 f:[[1,'Fighting Style','Choose a combat specialty.'],[1,'Second Wind','Bonus action: regain 1d10 + fighter level HP.',{lib:'Second Wind'}],[2,'Action Surge','One extra action on your turn.',{lib:'Action Surge'}],[5,'Extra Attack','Attack twice when you take the Attack action.'],[9,'Indomitable','Reroll a failed saving throw (twice at 13, three times at 17).'],[11,'Extra Attack (2)','Attack three times.'],[20,'Extra Attack (3)','Attack four times.']]},
Monk:{sub:3,subs:{

function setBgArt(){ const el=document.getElementById('bgart'); if(!el) return; const top=(S.classes||[]).slice().sort((a,b)=>(Number(b.level)||0)-(Number(a.level)||0))[0]; const k=top&&clsKey(top.name);

function skillChips(clsName,first,isNewClass){
  const cs=CLASS_SKILLS[clsName]; let n=0, list=null, hint='';
  if(first&&cs){ n=cs[0]; list=cs[1]==='any'?null:cs[1]; hint='Pick '+n+(list?' from the highlighted ones':' — any skill')+'. Add your background\'s skills too.'; }
  else if(isNewClass&&MC_SKILLS[clsName]){ n=1; list=MC_SKILLS[clsName][1]===null?(cs&&cs[1]!=='any'?cs[1]:null):null; hint='Multiclassing into '+clsName+' gives 1 skill'+(list?' from the highlighted ones':'')+'.'; }
  const chip=sk=>{ const lv=LU.skills[sk]||0, base=LU.base[sk]||0; const hl=list&&list.includes(sk);

function luClasses(){

const fCl=(id,l,on)=>'<label class="chk"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'> '+l+'</label>';
function luRead(){ const g=id=>document.getElementById(id);

  if(g('luNew')) LU.newName=g('luNew').value; if(g('luCustom')) LU.customName=g('luCustom').value; }
function applyLevelUp(){
  luRead(); const g=id=>document.getElementById(id);
  const cl=luClasses(); let tgt;
  if(LU.pick==='new'){ tgt=cl[cl.length-1]; tgt.id=uid(); }
  else tgt=cl.find(c=>c.id===LU.pick);
  if(g('luSub')) tgt.sub=g('luSub').value.trim();
  const L=totalLevel(cl);
  const hp=Number(LU.hp)||0; if(!S.classes.length){ S.hpMax=hp; S.hp=hp; } else { S.hpMax+=hp; S.hp+=hp; }
  if(g('luProf')&&g('luProf').checked) S.prof=profFor(L);
  if(g('luSlots')&&g('luSlots').checked){ const ns=slotsFor(cl); for(let i=1;i<=9;i++){ S.slots[i].max=ns[i]; S.slots[i].used=Math.min(S.slots[i].used,ns[i]); } }
  if(g('luPact')&&g('luPact').checked){ const p=pactFor(cl); S.pact.max=p.max; S.pact.level=p.level; S.pact.used=Math.min(S.pact.used,p.max); }
  const conBefore=am('con');
  ABIL.forEach(a=>{ const el=g('luAsi_'+a); if(el) S.abilities[a]+=Number(el.value)||0; });
  const conGain=(am('con')-conBefore)*L; if(conGain){ S.hpMax+=conGain; S.hp+=conGain; }
  S.resources.forEach(r=>{ const el=g('luRes_'+r.id); if(!el) return; const nm=Number(el.value)||0; const diff=nm-r.max; r.max=nm; r.cur=Math.max(0,Math.min(nm,r.cur+Math.max(0,diff))); });
  newResFor(cl).forEach(o=>{ const el=g('luNR_'+o.key); if(el&&!el.checked){ S.resDismissed=S.resDismissed||{}; const d=RES_DEFS.find(x=>x.name===o.name); if(d) S.resDismissed[d.key]=true; } });
  if(LU.ch) Object.keys(LU.ch).forEach(gr=>LU.ch[gr].forEach(n=>addChoice(gr,n)));
  const fn=g('luFeat')&&g('luFeat').value.trim(); if(fn) S.features.push({id:uid(),name:fn,text:g('luFeatTxt').value,active:true,effects:[]});
  if(!S.classes.length){ if(g('luSave_str')){ S.saveProf={}; ABIL.forEach(a=>{ if(g('luSave_'+a).checked) S.saveProf[a]=true; }); } else if(SAVES[tgt.name]){ S.saveProf={}; SAVES[tgt.name].forEach(a=>S.saveProf[a]=true); }
    if(CLASSES[tgt.name]&&CLASSES[tgt.name][2]) S.castAbility=CLASSES[tgt.name][2]; }
  if(LU.skills){ S.skills={}; Object.keys(LU.skills).forEach(k=>{ if(LU.skills[k]) S.skills[k]=LU.skills[k]; }); }
  if(S.castAbility==='none'&&tgt.cast!=='none'&&CLASSES[tgt.name]&&CLASSES[tgt.name][2]) S.castAbility=CLASSES[tgt.name][2];
  S.classes=cl; syncClasses(); touch(); closeSheet(); render(); toast('Level '+L+'! Max HP +'+(hp+conGain)+(conGain?' (incl. '+conGain+' from higher CON)':'')+(fn?', added '+fn:''));

/* ---------- dice ---------- */
function d(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return 1+(a[0]%n); }
function parse(expr){
  const out={dice:[],flat:0}; const s=String(expr||'').toLowerCase().replace(/\s+/g,'');
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g; let m;
  while((m=re.exec(s))){ if(m[3]){ out.dice.push({n:Number(m[2]||1),s:Number(m[3]),sign:m[1]==='-'?-1:1}); } else if(m[5]){ out.flat+=(m[4]==='-'?-1:1)*Number(m[5]); } }
  return out;
}
function scale(expr,k,flats){
  const p=parse(expr); if(!p.dice.length&&!p.flat) return '';
  const parts=p.dice.map(x=>(x.sign<0?'-':'')+(x.n*k)+'d'+x.s);
  const f=flats?p.flat*k:p.flat; if(f) parts.push(String(f));
  return parts.join('+').replace(/\+-/g,'-');
}
function rollExpr(expr,crit,extra){
  const p=parse(expr); let total=0; const bits=[];
  p.dice.forEach(x=>{ const n=crit?x.n*2:x.n; const r=[]; for(let i=0;i<n;i++) r.push(d(x.s)); const sum=r.reduce((a,b)=>a+b,0)*x.sign; total+=sum; bits.push((x.sign<0?'-':'')+n+'d'+x.s+' ['+r.join(',')+']'); });
  const flat=p.flat+(extra||0); if(flat){ total+=flat; bits.push(sg(flat)); }
  return {total:Math.max(0,total),detail:bits.join(' ')};
}
function d20(b){
  const roll=()=>{ const r=d(20); if(r===1&&S.lucky){ const n=d(20); return {v:n,t:'1→'+n+' lucky'}; } return {v:r,t:String(r)}; };
  const A=roll(); const a=A.v; let nat=a, txt;
  if(adv!=='n'){ const C=roll(), c=C.v; nat=adv==='a'?Math.max(a,c):Math.min(a,c); txt=(adv==='a'?'Adv ':'Dis ')+'['+A.t+', '+C.t+'] '+sg(b); }
  else txt='d20 ['+A.t+'] '+sg(b);
  return {nat,total:nat+b,txt};
}

function calc(src){
  const t=String(src).match(/\d+(?:\.\d+)?|[a-z]+|>=|<=|==|[-+*/(),<>]/gi)||[]; let i=0;
  const peek=()=>t[i], next=()=>t[i++];
  const F={ceil:Math.ceil,floor:Math.floor,min:Math.min,max:Math.max,round:Math.round};
  function prim(){ const x=next(); if(x===undefined) return 0;
    if(x==='('){ const v=cmp(); next(); return v; } if(x==='-') return -prim(); if(x==='+') return prim();
    if(/^[a-z]+$/i.test(x)){ next(); const a=[cmp()]; while(peek()===','){ next(); a.push(cmp()); } next(); const f=F[x.toLowerCase()]; return f?f(...a):0; }
    return Number(x)||0; }
  function mul(){ let v=prim(); while(peek()==='*'||peek()==='/'){ const o=next(); const r=prim(); v=o==='*'?v*r:(r?v/r:0); } return v; }
  function add(){ let v=mul(); while(peek()==='+'||peek()==='-'){ const o=next(); const r=mul(); v=o==='+'?v+r:v-r; } return v; }
  function cmp(){ let v=add(); while(['>','<','>=','<=','=='].includes(peek())){ const o=next(); const r=add(); v=(o==='>'?v>r:o==='<'?v<r:o==='>='?v>=r:o==='<='?v<=r:v===r)?1:0; } return v; }
  try{ const v=cmp(); return isFinite(v)?v:0; }catch(e){ return 0; }
}
function martialDie(){ return S.level>=17?'1d10':S.level>=11?'1d8':S.level>=5?'1d6':'1d4'; }
const TOK=/\b(prof|level|lvl|slot|str|dex|con|int|wis|cha)\b/gi;
function expand(expr,ctx){
  let s=String(expr||''); if(!s.trim()) return '';
  const num={prof:prof(),level:S.level,lvl:S.level,slot:(ctx&&ctx.slot)||0}; ABIL.forEach(a=>num[a]=am(a));
  s=s.replace(/\{([^}]*)\}/g,(m,inner)=>String(Math.floor(calc(clsTok(inner).replace(TOK,k=>'('+num[k.toLowerCase()]+')')))));
  s=s.replace(/\bdie\b/gi,(ctx&&ctx.die)||'1d6').replace(/\bmartial\b/gi,martialDie()).replace(/\bsneak\b/gi,Math.ceil(S.level/2)+'d6');
  s=s.replace(TOK,k=>String(num[k.toLowerCase()]));
  return s.replace(/\s+/g,'').replace(/\+-/g,'-').replace(/--/g,'+');
}
function pCost(p,lv){ return p.costType==='level'?lv:p.costType==='levelMin1'?Math.max(1,lv):(Number(p.cost)||0); }
function pCostLabel(p){ if(p.res==='slot') return 'spell slot'; const r=S.resources.find(x=>x.id===p.res); if(!p.res||!r) return 'no cost';
  const c=p.costType==='fixed'?String(Number(p.cost)||0):p.costType==='level'?'spell level':'spell level (min 1)'; return c+' '+r.name; }
function pDC(p){ return p.dcType==='spell'?dcV():p.dcType==='fixed'?(Number(p.dcFixed)||10):8+prof()+am(p.dcStat||'str'); }
function lowestSlot(){ for(let L=1;L<=9;L++){ const s=S.slots[L]; if(s.max-s.used>0) return L; } return 0; }
function usePowers(ids,lv){
  const ps=ids.map(i=>S.powers.find(p=>p.id===i)).filter(Boolean);
  const need={}; let slotNeed=false;
  for(const p of ps){ if(p.res==='slot') slotNeed=true; else if(p.res){ need[p.res]=(need[p.res]||0)+pCost(p,lv); } }
  for(const id in need){ const r=S.resources.find(x=>x.id===id);
    if(!r){ toast('An option points at a resource that was deleted — fix it in Setup'); return null; }
    if(r.cur<need[id]){ toast('Not enough '+r.name+' (need '+need[id]+', have '+r.cur+')'); return null; } }
  let slotL=0; if(slotNeed){ slotL=lowestSlot(); if(!slotL){ toast('No spell slots left'); return null; } }
  for(const id in need) S.resources.find(x=>x.id===id).cur-=need[id];
  if(slotL) S.slots[slotL].used++;
  const out={dmg:[],hit:[],adv:false,lines:[],notes:[],left:[]};
  ps.forEach(p=>{
    const r=S.resources.find(x=>x.id===p.res); const ctx={die:(r&&r.die)||'1d6',slot:slotL};
    if(p.dmg){ const e=expand(p.dmg,ctx); if(e) out.dmg.push({e,label:p.rollLabel||p.name}); }
    if(p.hit){ const e=expand(p.hit,ctx); if(e) out.hit.push(e); }
    if(p.adv) out.adv=true;
    if(p.save) out.lines.push({label:p.name+': '+ABN[p.save]+' save',big:'DC '+pDC(p),detail:''});
    if(p.feat){ const f=S.features.find(x=>x.id===p.feat); if(f) f.active=true; }
    const cost=p.res==='slot'?'level '+slotL+' slot':r?'−'+pCost(p,lv)+' '+r.name:'';
    out.notes.push('• '+p.name+(cost?' ('+cost+')':'')+(p.note?': '+p.note:''));
  });
  for(const id in need){ const r=S.resources.find(x=>x.id===id); out.left.push(r.name+' left: '+r.cur+'/'+r.max); }
  if(slotL) out.left.push('Level '+slotL+' slots left: '+(S.slots[slotL].max-S.slots[slotL].used));
  if(ps.length) touch();
  return out;
}

function attack(w,ids){
  const u=usePowers(ids||[],0); if(!u) return; closeSheet();
  if(u.adv) adv=adv==='d'?'n':'a';
  const r=d20(wHit(w)); let total=r.total, txt=r.txt;
  const hitX=u.hit.concat(diceOf('atk',w.id).map(x=>expand(x.e.value,{})));
  if(hitX.length){ const h=rollExpr(hitX.join('+'),false,0); total+=h.total; txt+=' + '+h.detail; }
  const crit=r.nat===20;
  const wx=(w.extra||[]).filter(x=>x.dmg).map(x=>{ const r=rollExpr(expand(x.dmg,{}),crit,0); const ty=pickType(x.type)||'damage'; return {label:ty,big:r.total,detail:r.detail+(typeList(x.type).length>1?' — type rolled from: '+typeList(x.type).join(', '):''),n:r.total}; });
  const xl=wx.concat(extraLines('dmg',w.id,crit,w.dmgType)).concat(u.dmg.map(x=>{ const r=rollExpr(x.e,crit,0); return {label:x.label,big:r.total,detail:r.detail,n:r.total}; }));
  const dm=rollExpr(expand(wDice(w),{}),crit,wFlat(w));
  const lines=[{label:'To hit',big:total,detail:txt+(crit?' — CRIT':''),cls:crit?'crit':r.nat===1?'fumble':''},
    {label:(pickType(w.dmgType)||'damage')+(crit?' (crit)':''),big:dm.total,detail:dm.detail}].concat(xl,xl.length?[{label:'Total damage',big:dm.total+xl.reduce((a,x)=>a+x.n,0),detail:'',cls:'crit'}]:[],u.lines);
  showResult(w.name,lines,[u.notes.join('\n'),u.left.join(' · '),w.notes||''].filter(Boolean).join('\n'));

function usePower(p){

function resolveSpell(sp,L,how,ids){
  const base=Number(sp.level); const lv=L||base;
  const u=usePowers(ids||[],lv); if(!u) return;
  if(how==='slot'){ S.slots[L].used=Math.min(S.slots[L].max,S.slots[L].used+1); }
  if(how==='pact'){ S.pact.used=Math.min(S.pact.max,S.pact.used+1); }
  if(how==='perday'){ sp.freeUsed=Math.min(Number(sp.free)||0,(Number(sp.freeUsed)||0)+1); }
  if(how==='slot'||how==='perday'||how==='pact') touch();
  closeSheet();
  const lines=[]; let crit=false;
  if(sp.mode==='attack'){
    if(u.adv) adv=adv==='d'?'n':'a';
    const r=d20(atkFor(sp)); let total=r.total, txt=r.txt; crit=r.nat===20;
    if(u.hit.length){ const h=rollExpr(u.hit.join('+'),false,0); total+=h.total; txt+=' + '+h.detail; }
    lines.push({label:'Spell attack',big:total,detail:txt+(crit?' — CRIT':''),cls:crit?'crit':r.nat===1?'fumble':''}); }
  if(sp.mode==='save') lines.push({label:ABN[sp.saveStat]+' save',big:'DC '+dcFor(sp),detail:sp.halfOnSave?'Half damage on a success':''});
  let ex=sp.dmg||'';
  if(ex&&base===0&&sp.cantripScale) ex=scale(sp.dmg,tier(),false);
  if(ex&&base>0&&lv>base&&sp.upDice) ex+='+'+scale(sp.upDice,lv-base,true);
  u.dmg.forEach(x=>{ ex+=(ex?'+':'')+x.e; });
  if(ex){
    const heal=/heal/i.test(sp.dmgType||'');
    const agon=/eldritch blast/i.test(sp.name)&&!sp.addMod&&hasFeat('Agonizing Blast')?spM(sp):0;
    const r=rollExpr(ex,crit,(sp.addMod?spM(sp):0)+agon+(heal?0:bonus('spellDmg')));
    lines.push({label:(sp.dmgType||'damage')+(crit?' (crit)':''),big:r.total,detail:r.detail});
    if(!heal){ const xl=extraLines('spellDmg','',crit,sp.dmgType); lines.push(...xl); if(xl.length) lines.push({label:'Total damage',big:r.total+xl.reduce((a,x)=>a+x.n,0),detail:'',cls:'crit'}); }
  }
  lines.push(...u.lines);
  if(!lines.length) lines.push({label:'Cast',big:'✓',detail:''});
  let foot='';
  if(base>0) foot+=(how==='pact'?'Pact slot used ('+(S.pact.max-S.pact.used)+'/'+S.pact.max+' left).':how==='slot'?'Level '+L+' slot used ('+(S.slots[L].max-S.slots[L].used)+' left).':how==='perday'?'Free cast used ('+(sp.free-sp.freeUsed)+'/'+sp.free+' left).':'No slot used.');
  showResult(sp.name+(base>0?' — level '+lv:''),lines,[foot,u.notes.join('\n'),u.left.join(' · '),sp.notes||''].filter(Boolean).join('\n'));
  if(tab==='spells'||tab==='play') render();
}
function rest(kind){
  S.resources.forEach(r=>{ if(r.reset==='short'||(kind==='long'&&r.reset==='long')) r.cur=r.max; });
  if(kind==='long'||S.pactShortRest) for(let i=1;i<=9;i++) S.slots[i].used=0;
  S.pact.used=0;
  if(kind==='long'&&S.forms) S.forms.active=null;
  if(kind==='long'){ S.hp=hpMaxV(); S.temp=0; S.spells.forEach(sp=>sp.freeUsed=0);
    const pools=hdPools(); let back=S.hdFullRest?Infinity:Math.max(1,Math.floor(totalLevel()/2));
    pools.forEach(p=>{ const g=Math.min(p.used,back); S.hdUsed[p.die]=p.used-g; back-=g; }); }
  touch(); render(); toast(kind==='long'?'Long rest: HP, slots and resources restored':'Short rest: short-rest resources restored');
}
function hpChange(kind){
  const v=Math.max(0,Number(document.getElementById('hpAmt').value)||0); if(!v) return;
  const act=S.forms&&S.forms.active;
  if(kind==='dmg'&&act){ const over=Math.max(0,v-act.hp); act.hp=Math.max(0,act.hp-v); if(act.hp===0){ S.forms.active=null; let left=over; const t=Math.min(S.temp,left); S.temp-=t; left-=t; S.hp=Math.max(0,S.hp-left); touch(); render(); toast('Beast form drops — you revert'+(over?' and take '+over+' damage':'')); return; } }
  else if(kind==='heal'&&act){ act.hp=Math.min(act.max,act.hp+v); }
  else if(kind==='dmg'){ let left=v; const t=Math.min(S.temp,left); S.temp-=t; left-=t; S.hp=Math.max(0,S.hp-left); }
  else if(kind==='heal'){ S.hp=Math.min(hpMaxV(),S.hp+v); }
  else if(kind==='temp'){ S.temp=Math.max(S.temp,v); }
  touch(); render();
}

/* ---------- save / backup ---------- */
function buildHTML(){
  const doc=new DOMParser().parseFromString(SRC,'text/html');
  [doc.head,doc.body].forEach(p=>[...p.children].forEach(c=>{ if(!c.hasAttribute('data-keep')) c.remove(); }));
  doc.getElementById('app').innerHTML=''; doc.getElementById('sheet').innerHTML=''; doc.getElementById('toast').textContent='';
  doc.getElementById('saved').textContent=storeJSON().replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
}
async function saveSheet(){
  const a=await artP;
  if(!a){ toast('Saving into the page isn\'t available in this view. Your sheet is still kept on this device — use Export for a backup.'); return; }
  try{ await a.publish(buildHTML()); savedTs=STORE_TS; updSave(); toast('Saved'); }
  catch(e){ toast('Couldn\'t save: '+((e&&(e.code||e.message))||'error')+'. Still kept on this device.'); }
}
async function exportJSON(ch){ ch=ch||S;
  const data=JSON.stringify(ch,null,1); const fn=(ch.name||'character').replace(/[^\w-]+/g,'_')+'.json';
  const dl=await dlP;
  if(dl){ try{ await dl.save({filename:fn,data}); return; }catch(e){} }
  if(!window.claude){ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); toast('Backup saved as '+fn); return; }catch(e){} }
  openSheet('<h3>Backup</h3><div class="sub">Copy this text and keep it somewhere safe. Paste it into Import to restore.</div><textarea id="expTxt" style="min-height:200px;margin-top:8px">'+esc(data)+'</textarea><button class="btn pri" style="width:100%;margin-top:8px" data-act="copyExp">Copy</button>');
}
function importText(txt){
  try{ const o=JSON.parse(txt); const st=toStore(o); if(!st) throw 0; const got=st.chars.filter(c=>c&&c.abilities).map(c=>{ const n=normalize(JSON.parse(JSON.stringify(c))); n.cid=uid(); return n; }); if(!got.length) throw 0;
    CHARS.push(...got); S=got[0]; touch(); closeSheet(); tab='play'; render(); toast('Imported '+(got.length>1?got.length+' characters':S.name)); }
  catch(e){ toast('That doesn\'t look like a character backup'); }
}

const app=document.getElementById('app');

  try{ localStorage.setItem(LS+':tab',tab); }catch(e){}
  if(syncClassResources()|syncClassFeatures()|syncSubclassSpells()) touch();
  const tabs=[['chars','Chars'],['play','Play'],['spells','Spells'],['features','Feats'],['bag','Bag'],['bio','Bio'],['setup','Setup']];
  let h='<header class="top"><div class="toprow">'+(S.portrait?'<img class="thumb" src="'+S.portrait+'" alt="" data-act="tab" data-t="bio">':'')+'<div class="who"><h1>'+esc(S.name)+'</h1><div class="sub">'+whoLine()+'</div></div>'+
    '<button class="btn sm '+(tab==='log'?'pri':'')+'" data-act="tab" data-t="log">Log</button>'+(CAN_PUBLISH?'<button class="btn save" id="saveBtn" data-act="save">Saved</button>':'')+'</div>'+
    '<div class="tabs">'+tabs.map(t=>'<button data-act="tab" data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>').join('')+'</div>'+

function vSpells(){
  let h='<div class="card"><div class="grid g3"><div class="stat"><div class="k">Save DC</div><div class="v">'+dcV()+'</div></div><div class="stat"><div class="k">Spell atk</div><div class="v">'+sg(satkV())+'</div></div><div class="stat"><div class="k">Ability</div><div class="v">'+(S.castAbility==='none'?'—':ABN[S.castAbility])+'</div></div></div>';
  let any=false;
  for(let L=1;L<=9;L++){ const sl=S.slots[L]; if(!sl.max) continue; any=true;
    h+='<div class="slotrow"><span class="lv">Lv '+L+'</span><div class="pips">';
    for(let i=0;i<sl.max;i++) h+='<button class="pip '+(i>=sl.max-sl.used?'used':'')+'" data-act="pip" data-l="'+L+'" data-i="'+i+'" aria-label="slot"></button>';
    h+='</div></div>'; }
  if(S.pact.max){ any=true; h+='<div class="slotrow"><span class="lv">Pact '+S.pact.level+'</span><div class="pips">';
    for(let i=0;i<S.pact.max;i++) h+='<button class="pip pact '+(i>=S.pact.max-S.pact.used?'used':'')+'" data-act="pip" data-l="pact" data-i="'+i+'" aria-label="pact slot"></button>';
    h+='</div></div>'; }
  if(!any) h+='<div class="empty" style="margin-top:8px">No spell slots set. Add them in Setup.</div>';
  h+='<div class="hint">Tap a slot to mark it used or restore it.</div></div>';
  const casterCls=S.classes.some(c=>PREP_CLASSES[(c.name||'').toLowerCase()]||KNOWN_CLASSES[(c.name||'').toLowerCase()]);
  h+='<div class="card"><button class="btn pri" style="width:100%" data-act="sbOpen">📖 Spell book — '+(S.classes.some(c=>PREP_CLASSES[(c.name||'').toLowerCase()]&&!/wizard/i.test(c.name))?'prepare today\'s spells':'learn & add spells')+'</button>'+
    (prepLimit()?'<div class="hint" style="text-align:center">Prepared: <b>'+preparedCount()+' / '+prepLimit()+'</b>'+(S.spells.some(x=>x.prep==='always')?' · plus always-prepared spells':'')+'</div>':'')+
    (!casterCls?'<div class="hint" style="text-align:center">Pick any spell, even off-list ones your DM allows (tap "All classes").</div>':'')+'</div>';
  if(!S.spells.length) return h+'<div class="card"><div class="empty">No spells yet — open the spell book above, or add homebrew spells in Setup.</div></div>';

  const card=sp=>{
    const L=Number(sp.level);

    if(sp.dmg) bits.push((L===0&&sp.cantripScale?scale(sp.dmg,tier(),false):sp.dmg)+' '+(sp.dmgType||'')); if(sp.upDice&&L>0) bits.push('+'+sp.upDice+'/level');

    const tags=(sp.prep==='always'?'<span class="tag">Always prepared</span>':'')+(sp.source?'<span class="tag">'+esc(sp.source)+'</span>':'')+
      (Number(sp.free)>0?'<span class="tag">Free '+(sp.free-(sp.freeUsed||0))+'/'+sp.free+'</span>':'');
    const pbtn=(sp.prep==='prepared'||sp.prep==='unprepared')?'<button class="btn sm ghost" data-act="prep" data-id="'+sp.id+'">'+(sp.prep==='prepared'?'Unprepare':'Prepare')+'</button>':'';
    return '<div class="spell" style="'+(sp.prep==='unprepared'?'opacity:.6':'')+'"><div class="t"><b data-act="spInfo" data-id="'+sp.id+'" style="cursor:pointer">'+esc(sp.name)+' <span class="sub">ⓘ</span></b>'+pbtn+(sp.prep==='unprepared'?'':'<button class="btn sm pri" data-act="cast" data-id="'+sp.id+'">Cast</button>')+'</div><div class="meta">'+esc(bits.join(' · '))+'</div>'+tags+(sp.notes?'<div class="note">'+esc(sp.notes)+'</div>':'')+'</div>';
  };

  return h;
}

function loadPortrait(file){
  if(!file) return; const url=URL.createObjectURL(file); const img=new Image();
  img.onload=()=>{ const M=640; let w=img.naturalWidth,h=img.naturalHeight; const k=Math.min(1,M/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    S.portrait=c.toDataURL('image/jpeg',0.82); URL.revokeObjectURL(url); touch(); render(); toast(CAN_PUBLISH?'Photo added — tap Save to keep it in the page':'Photo added'); };
  img.onerror=()=>toast('Couldn\'t read that image');
  img.src=url;
}

function setPath(path,val){
  const k=path.split('.'); let o=S;
  for(let i=0;i<k.length-1;i++){ if(o[k[i]]==null) o[k[i]]={}; o=o[k[i]]; }
  o[k[k.length-1]]=val;
}
app.addEventListener('change',e=>{
  const el=e.target; if(el.id==='portraitIn'){ loadPortrait(el.files[0]); return; }
  if(el.dataset&&el.dataset.cfatk!==undefined){ const f=S.forms.custom[Number(el.dataset.cfatk)]; f.atk=el.value.split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(p=>p[0]).map(p=>({n:p[0],b:p[1]===''||p[1]==null?null:Number(String(p[1]).replace('+',''))||0,d:p[2]||'',t:p[3]||'',x:''})); touch(); return; }
  if(el.id==='addPotSel'){ const v=el.value; if(!v) return; const ex=v!=='__custom'&&S.potions.find(x=>x.ptype===v); if(ex) ex.qty=(Number(ex.qty)||0)+1;
    else S.potions.push(v==='__custom'?{id:uid(),ptype:'',name:'Custom potion',qty:1,kind:'heal',dice:'2d4+2',dtype:'',save:'',dc:13,dur:'',note:'',fx:[]}:potionFromKey(v));
    touch(); render(); if(v==='__custom'){ const d=[...document.querySelectorAll('.potedit')].pop(); if(d) d.open=true; } return; }
  if(el.id==='addAtkSel'){ const v=el.value; if(!v) return; const n={id:uid(),name:'',ability:'str',prof:true,bonus:0,magic:0,dmg:'1d6',dmgType:'',addMod:true,notes:'',extra:[]};
    if(v!=='__custom') Object.assign(n,weaponTemplate(v)); S.attacks.push(n); touch(); render(); return; }
  if(el.id==='addResSel'){ const v=el.value; if(!v) return; if(v==='__custom') S.resources.push({id:uid(),name:'',max:1,cur:1,reset:'long',die:''}); else addResourceFromDef(v); touch(); render(); return; }
  const p=el.dataset&&el.dataset.bind; if(!p) return;
  let v=el.type==='checkbox'?el.checked:(el.dataset.num!==undefined?(el.value===''?0:Number(el.value)):el.value);
  const wt=p.match(/^attacks\.(\d+)\.wtype$/);
  if(wt){ const w=S.attacks[wt[1]]; const oldName=(WEAPONS[w.wtype]||[])[0]; if(v){ const t=weaponTemplate(v); if(w.name&&w.name!==oldName&&!Object.values(WEAPONS).some(x=>x[0]===w.name)) delete t.name; Object.assign(w,t); w.autoProf=true; } else { w.wtype=''; } touch(); render(); return; }
  if(p==='armor.type'){ applyArmor(v); touch(); render(); return; }
  if(/^attacks\.\d+\.prof$/.test(p)){ const w=S.attacks[p.split('.')[1]]; w.autoProf=false; }
  setPath(p,v);
  if(p==='hpMax'&&S.hp>hpMaxV()) S.hp=hpMaxV();
  if(p.startsWith('armor.')) el.setAttribute('data-rerender','');
  if(/^potions\.\d+\.kind$/.test(p)) el.setAttribute('data-rerender','');
  const m=p.match(/^resources\.(\d+)\.max$/); if(m){ const r=S.resources[m[1]]; if(r.auto){ r.autoMax=false; el.setAttribute('data-rerender',''); } if(r.cur>r.max) r.cur=r.max; }
  const md=p.match(/^resources\.(\d+)\.die$/); if(md){ const r=S.resources[md[1]]; if(r.auto) r.autoDie=false; }
  const ma=p.match(/^resources\.(\d+)\.autoMax$/); if(ma){ const r=S.resources[ma[1]]; if(r.autoMax){ r.autoDie=true; } el.setAttribute('data-rerender',''); }
  if(p.startsWith('classes.')||p.startsWith('abilities.')) el.setAttribute('data-rerender','');
  const sm=p.match(/^slots\.(\d+)\.max$/); if(sm){ const sl=S.slots[sm[1]]; if(sl.used>sl.max) sl.used=sl.max; }
  touch();
  if(el.hasAttribute('data-rerender')) render();
  if(p==='classes.0.name'&&S.classes.length===1&&!Object.values(S.saveProf||{}).some(Boolean)){ const k=Object.keys(SAVES).find(c=>c.toLowerCase()===String(v).trim().toLowerCase()); if(k){ S.saveProf={}; SAVES[k].forEach(a=>S.saveProf[a]=true); el.setAttribute('data-rerender',''); } }
  if(p.startsWith('classes.')){ syncClasses(); }
  if(p==='name'||p==='cls'||p==='level'||p.startsWith('classes.')){ const w=app.querySelector('.who'); if(w) w.innerHTML='<h1>'+esc(S.name)+'</h1><div class="sub">'+whoLine()+'</div>'; }
});

let armed=null, armT;

    case 'hp': hpChange(b.dataset.k); break;

    case 'd20adv': { const a=d(20),c=d(20); const keep=b.dataset.v==='a'?Math.max(a,c):Math.min(a,c); showResult('d20 '+(b.dataset.v==='a'?'advantage':'disadvantage'),[{label:'Total',big:keep+dMod,detail:'['+a+', '+c+'] '+(dMod?sg(dMod):''),cls:keep===20?'crit':keep===1?'fumble':''}],'',true); break; }
    case 'exprRoll': { const ex=document.getElementById('diceExpr').value.trim(); const p=parse(ex); if(!p.dice.length){ toast('Type something like 2d6+3'); break; } const r=rollExpr(ex,false,0); showResult(ex,[{label:'Total',big:r.total,detail:r.detail}],'',true); break; }
    case 'rdec': { const r=find('resources',id); r.cur=Math.max(0,r.cur-1); touch(); render(); break; }

    case 'potFxDel': S.potions[b.dataset.i].fx.splice(Number(b.dataset.j),1); touch(); render(); break;
    case 'qty': { const it=find('items',id); it.qty=Math.max(0,(Number(it.qty)||0)+Number(b.dataset.d)); touch(); render(); break; }
    case 'prep': { const sp=find('spells',id); if(sp.fromList&&sp.prep==='prepared'){ S.spells=S.spells.filter(x=>x!==sp); } else sp.prep=sp.prep==='prepared'?'unprepared':'prepared'; touch(); render(); break; }
    case 'sbOpen': openSpellBrowser(); break;
    case 'sbCls': SB.cls=b.dataset.v; SB.all=false; SB.lvl='all'; drawSpellBrowser(); break;
    case 'sbAll': SB.all=!SB.all; drawSpellBrowser(); break;
    case 'sbLvl': SB.lvl=b.dataset.v; drawSpellBrowser(); break;
    case 'sbInfo': SB.open=SB.open===b.dataset.n?'':b.dataset.n; drawSpellBrowser(); break;
    case 'sbAdd': sbAdd(b.dataset.n); break;
    case 'sbToggle': sbToggle(b.dataset.n); break;
    case 'spInfo': spellInfo(find('spells',id)); break;
    case 'rmPortrait': S.portrait=''; touch(); render(); break;
    case 'loadEx': { const n=example(); n.cid=uid(); CHARS.push(n); S=n; touch(); tab='play'; render(); toast('Example character added'); break; }
  }
});
render();
if(EDITION==='store'&&!window.claude&&'serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
</script>
