d undead have disadvantage on attack rolls against you. You can end the spell early by using either of the following special functions. ***Break Enchantment.*** As your action, you touch a creature you can reach that is charmed, frightened, or possessed by a celestial, an elemental, a fey, a fiend, or an undead. The creature you touch is no longer charmed, frightened, or possessed by such creatures. ***Dismissal.*** As your action, make a melee spell attack against a celestial, an elemental, a fey, a\u2026","v":"cha","hf":0},{"n":"Dispel Magic","l":3,"s":"Abju","c":["bard","cleric","druid","paladin","sorcerer","warlock","wizard"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Choose one creature, object, or magical effect within range. Any spell of 3rd level or lower on the target ends. For each spell of 4th level or higher on the target, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a successful check, the spell ends.","h":"When you cast this spell using a spell slot of 4th level or higher, you automatically end the effects of a spell on the target if the spell's level is equal to or less than the level of the spell slot you used."},{"n":"Divination","l":4,"s":"Divi","c":["druid"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":1,"x":"Your magic and an offering put you in contact with a god or a god's servants. You ask a single question concerning a specific goal, event, or activity to occur within 7 days. The GM offers a truthful reply. The reply might be a short phrase, a cryptic rhyme, or an omen. The spell doesn't take into account any possible circumstances that might change the outcome, such as the casting of additional spells or the loss or gain of a companion. If you cast the spell two or more times before finishing your next long rest, there is a cumulative 25 percent chance for each casting after the first that you get a random reading. The GM makes this roll in secret."},{"n":"Divine Favor","l":1,"s":"Evoc","c":["paladin"],"t":"1 bonus action","g":"Self","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"Your prayer empowers you with divine radiance. Until the spell ends, your weapon attacks deal an extra 1d4 radiant damage on a hit.","dt":"radiant","d":"1d4"},{"n":"Divine Word","l":7,"s":"Evoc","c":["cleric"],"t":"1 bonus action","g":"30 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You utter a divine word, imbued with the power that shaped the world at the dawn of creation. Choose any number of creatures you can see within range. Each creature that can hear you must make a Charisma saving throw. On a failed save, a creature suffers an effect based on its current hit points: - 50 hit points or fewer: deafened for 1 minute - 40 hit points or fewer: deafened and blinded for 10 minutes - 30 hit points or fewer: blinded, deafened, and stunned for 1 hour - 20 hit points or fewer: killed instantly Regardless of its current hit points, a celestial, an elemental, a fey, or a fiend that fails its save is forced back to its plane of origin (if it isn't there already)\u2026","v":"cha","hf":0},{"n":"Dominate Beast","l":4,"s":"Ench","c":["druid","sorcerer"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You attempt to beguile a creature that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw. While the creature is charmed, you have a telepathic link with it as long as the two of you are on the same plane of existence. You can use this telepathic link to issue commands to the creature while you are conscious (no action required), which it does its best to obey. You can specify a simple and general course of action, such as \"Attack that creature,\" \"Run over there,\" or \"Fetch that object.\" If the creature completes the order and\u2026","h":"When you cast this spell with a 9th level spell slot, the duration is concentration, up to 8 hours.","v":"wis","hf":0},{"n":"Dominate Monster","l":8,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You attempt to beguile a creature that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw. While the creature is charmed, you have a telepathic link with it as long as the two of you are on the same plane of existence. You can use this telepathic link to issue commands to the creature while you are conscious (no action required), which it does its best to obey. You can specify a simple and general course of action, such as \"Attack that creature,\" \"Run over there,\" or \"Fetch that object.\" If the creature completes the order and\u2026","h":"When you cast this spell with a 9th-level spell slot, the duration is concentration, up to 8 hours.","v":"wis","hf":0},{"n":"Dominate Person","l":5,"s":"Ench","c":["bard","sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You attempt to beguile a humanoid that you can see within range. It must succeed on a wisdom saving throw or be charmed by you for the duration. If you or creatures that are friendly to you are fighting it, it has advantage on the saving throw. While the target is charmed, you have a telepathic link with it as long as the two of you are on the same plane of existence. You can use this telepathic link to issue commands to the creature while you are conscious (no action required), which it does its best to obey. You can specify a simple and general course of action, such as \"Attack that creature,\" \"Run over there,\" or \"Fetch that object.\" If the creature completes the order and\u2026","h":"When you cast this spell using a 6th-level spell slot, the duration is concentration, up to 10 minutes. When you use a 7th-level spell slot, the duration is concentration, up to 1 hour. When you use a spell slot of 8th level or higher, the duration is concentration, up to 8 hours.","v":"wis","hf":0},{"n":"Dream","l":5,"s":"Illu","c":["bard","warlock","wizard"],"t":"1 minute","g":"Special","u":"8 hours","m":"VSM","k":0,"r":0,"x":"This spell shapes a creature's dreams. Choose a creature known to you as the target of this spell. The target must be on the same plane of existence as you. Creatures that don't sleep, such as elves, can't be contacted by this spell. You, or a willing creature you touch, enters a trance state, acting as a messenger. While in the trance, the messenger is aware of his or her surroundings, but can't take actions or move. If the target is asleep, the messenger appears in the target's dreams and can converse with the target as long as it remains asleep, through the duration of the spell. The messenger can also shape the environment of the dream, creating landscapes, objects, and other\u2026","v":"wis","hf":0,"dt":"psychic","d":"3d6"},{"n":"Druidcraft","l":0,"s":"Tran","c":["druid"],"t":"1 action","g":"30 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Whispering to the spirits of nature, you create one of the following effects within 'range': - You create a tiny, harmless sensory effect that predicts what the weather will be at your location for the next 24 hours. The effect might manifest as a golden orb for clear skies, a cloud for rain, falling snowflakes for snow, and so on. This effect persists for 1 round. - You instantly make a flower bloom, a seed pod open, or a leaf bud bloom. - You create an instantaneous, harmless sensory effect, such as falling leaves, a puff of wind, the sound of a small animal, or the faint order of skunk. The effect must fit in a 5-foot cube. - You instantly light or snuff out a candle, a torch,\u2026"},{"n":"Earthquake","l":8,"s":"Evoc","c":["cleric","druid","sorcerer"],"t":"1 action","g":"500 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create a seismic disturbance at a point on the ground that you can see within range. For the duration, an intense tremor rips through the ground in a 100-foot-radius circle centered on that point and shakes creatures and structures in contact with the ground in that area. The ground in the area becomes difficult terrain. Each creature on the ground that is concentrating must make a constitution saving throw. On a failed save, the creature's concentration is broken. When you cast this spell and at the end of each turn you spend concentrating on it, each creature on the ground in the area must make a dexterity saving throw. On a failed save, the creature is knocked prone. This\u2026"},{"n":"Eldritch Blast","l":0,"s":"Evoc","c":["warlock"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A beam of crackling energy streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 force damage. The spell creates more than one beam when you reach higher levels: two beams at 5th level, three beams at 11th level, and four beams at 17th level. You can direct the beams at the same target or at different ones. Make a separate attack roll for each beam.","a":1,"dt":"force","d":"1d10","cs":1},{"n":"Enhance Ability","l":2,"s":"Tran","c":["bard","cleric","druid","sorcerer"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You touch a creature and bestow upon it a magical enhancement. Choose one of the following effects; the target gains that effect until the spell ends. ***Bear's Endurance.*** The target has advantage on constitution checks. It also gains 2d6 temporary hit points, which are lost when the spell ends. ***Bull's Strength.*** The target has advantage on strength checks, and his or her carrying capacity doubles. ***Cat's Grace.*** The target has advantage on dexterity checks. It also doesn't take damage from falling 20 feet or less if it isn't incapacitated. ***Eagle's Splendor.*** The target has advantage on Charisma checks. ***Fox's Cunning.*** The target has advantage on intelligence\u2026","h":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd."},{"n":"Enlarge/Reduce","l":2,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You cause a creature or an object you can see within range to grow larger or smaller for the duration. Choose either a creature or an object that is neither worn nor carried. If the target is unwilling, it can make a Constitution saving throw. On a success, the spell has no effect. If the target is a creature, everything it is wearing and carrying changes size with it. Any item dropped by an affected creature returns to normal size at once. ***Enlarge.*** The target's size doubles in all dimensions, and its weight is multiplied by eight. This growth increases its size by one category-from Medium to Large, for example. If there isn't enough room for the target to double its size,\u2026","v":"con","hf":0},{"n":"Entangle","l":1,"s":"Conj","c":["druid"],"t":"1 action","g":"90 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"Grasping weeds and vines sprout from the ground in a 20-foot square starting form a point within range. For the duration, these plants turn the ground in the area into difficult terrain. A creature in the area when you cast the spell must succeed on a strength saving throw or be restrained by the entangling plants until the spell ends. A creature restrained by the plants can use its action to make a Strength check against your spell save DC. On a success, it frees itself. When the spell ends, the conjured plants wilt away.","v":"str","hf":0},{"n":"Enthrall","l":2,"s":"Ench","c":["bard","warlock"],"t":"1 action","g":"60 feet","u":"1 minute","m":"VS","k":0,"r":0,"x":"You weave a distracting string of words, causing creatures of your choice that you can see within range and that can hear you to make a wisdom saving throw. Any creature that can't be charmed succeeds on this saving throw automatically, and if you or your companions are fighting a creature, it has advantage on the save. On a failed save, the target has disadvantage on Wisdom (Perception) checks made to perceive any creature other than you until the spell ends or until the target can no longer hear you. The spell ends if you are incapacitated or can no longer speak.","v":"wis","hf":0},{"n":"Etherealness","l":7,"s":"Tran","c":["bard","cleric","sorcerer","warlock","wizard"],"t":"1 action","g":"Self","u":"8 hours","m":"VS","k":0,"r":0,"x":"You step into the border regions of the Ethereal Plane, in the area where it overlaps with your current plane. You remain in the Border Ethereal for the duration or until you use your action to dismiss the spell. During this time, you can move in any direction. If you move up or down, every foot of movement costs an extra foot. You can see and hear the plane you originated from, but everything there looks gray, and you can't see anything more than 60 feet away. While on the Ethereal Plane, you can only affect and be affected by other creatures on that plane. Creatures that aren't on the Ethereal Plane can't perceive you and can't interact with you, unless a special ability or\u2026","h":"When you cast this spell using a spell slot of 8th level or higher, you can target up to three willing creatures (including you) for each slot level above 7th. The creatures must be within 10 feet of you when you cast the spell."},{"n":"Expeditious Retreat","l":1,"s":"Tran","c":["sorcerer","warlock","wizard"],"t":"1 bonus action","g":"Self","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"This spell allows you to move at an incredible pace. When you cast this spell, and then as a bonus action on each of your turns until the spell ends, you can take the Dash action."},{"n":"Eyebite","l":6,"s":"Necr","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"For the spell's duration, your eyes become an inky void imbued with dread power. One creature of your choice within 60 feet of you that you can see must succeed on a wisdom saving throw or be affected by one of the following effects of your choice for the duration. On each of your turns until the spell ends, you can use your action to target another creature but can't target a creature again if it has succeeded on a saving throw against this casting of eyebite. ***Asleep.*** The target falls unconscious. It wakes up if it takes any damage or if another creature uses its action to shake the sleeper awake. ***Panicked.*** The target is frightened of you. On each of its turns, the\u2026","v":"wis","hf":0},{"n":"Fabricate","l":4,"s":"Tran","c":["wizard"],"t":"10 minutes","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You convert raw materials into products of the same material. For example, you can fabricate a wooden bridge from a clump of trees, a rope from a patch of hemp, and clothes from flax or wool. Choose raw materials that you can see within range. You can fabricate a Large or smaller object (contained within a 10-foot cube, or eight connected 5-foot cubes), given a sufficient quantity of raw material. If you are working with metal, stone, or another mineral substance, however, the fabricated object can be no larger than Medium (contained within a single 5-foot cube). The quality of objects made by the spell is commensurate with the quality of the raw materials. Creatures or magic\u2026"},{"n":"Faerie Fire","l":1,"s":"Evoc","c":["druid"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"V","k":1,"r":0,"x":"Each object in a 20-foot cube within range is outlined in blue, green, or violet light (your choice). Any creature in the area when the spell is cast is also outlined in light if it fails a dexterity saving throw. For the duration, objects and affected creatures shed dim light in a 10-foot radius. Any attack roll against an affected creature or object has advantage if the attacker can see it, and the affected creature or object can't benefit from being invisible.","v":"dex","hf":0},{"n":"Faithful Hound","l":4,"s":"Conj","c":["wizard"],"t":"1 action","g":"30 feet","u":"8 hours","m":"VSM","k":0,"r":0,"x":"You conjure a phantom watchdog in an unoccupied space that you can see within range, where it remains for the duration, until you dismiss it as an action, or until you move more than 100 feet away from it. The hound is invisible to all creatures except you and can't be harmed. When a Small or larger creature comes within 30 feet of it without first speaking the password that you specify when you cast this spell, the hound starts barking loudly. The hound sees invisible creatures and can see into the Ethereal Plane. It ignores illusions. At the start of each of your turns, the hound attempts to bite one creature within 5 feet of it that is hostile to you. The hound's attack bonus\u2026","a":1,"dt":"piercing","d":"4d8"},{"n":"False Life","l":1,"s":"Necr","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"1 hour","m":"VSM","k":0,"r":0,"x":"Bolstering yourself with a necromantic facsimile of life, you gain 1d4 + 4 temporary hit points for the duration.","h":"When you cast this spell using a spell slot of 2nd level or higher, you gain 5 additional temporary hit points for each slot level above 1st.","dt":"temp HP","d":"1d4+4","up":"5"},{"n":"Fear","l":3,"s":"Illu","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You project a phantasmal image of a creature's worst fears. Each creature in a 30-foot cone must succeed on a wisdom saving throw or drop whatever it is holding and become frightened for the duration. While frightened by this spell, a creature must take the Dash action and move away from you by the safest available route on each of its turns, unless there is nowhere to move. If the creature ends its turn in a location where it doesn't have line of sight to you, the creature can make a wisdom saving throw. On a successful save, the spell ends for that creature.","v":"wis","hf":0},{"n":"Feather Fall","l":1,"s":"Tran","c":["bard","sorcerer","wizard"],"t":"1 reaction","g":"60 feet","u":"1 minute","m":"VM","k":0,"r":0,"x":"Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If the creature lands before the spell ends, it takes no falling damage and can land on its feet, and the spell ends for that creature."},{"n":"Feeblemind","l":8,"s":"Ench","c":["bard","druid","warlock","wizard"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You blast the mind of a creature that you can see within range, attempting to shatter its intellect and personality. The target takes 4d6 psychic damage and must make an intelligence saving throw. On a failed save, the creature's Intelligence and Charisma scores become 1. The creature can't cast spells, activate magic items, understand language, or communicate in any intelligible way. The creature can, however, identify its friends, follow them, and even protect them. At the end of every 30 days, the creature can repeat its saving throw against this spell. If it succeeds on its saving throw, the spell ends. The spell can also be ended by greater restoration, heal, or wish.","v":"int","hf":0,"dt":"psychic","d":"4d6"},{"n":"Find Familiar","l":1,"s":"Conj","c":["wizard"],"t":"1 hour","g":"10 feet","u":"Instantaneous","m":"VSM","k":0,"r":1,"x":"You gain the service of a familiar, a spirit that takes an animal form you choose: bat, cat, crab, frog (toad), hawk, lizard, octopus, owl, poisonous snake, fish (quipper), rat, raven, sea horse, spider, or weasel. Appearing in an unoccupied space within range, the familiar has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of a beast. Your familiar acts independently of you, but it always obeys your commands. In combat, it rolls its own initiative and acts on its own turn. A familiar can't attack, but it can take other actions as normal. When the familiar drops to 0 hit points, it disappears, leaving behind no physical form. It\u2026"},{"n":"Find Steed","l":2,"s":"Conj","c":["paladin"],"t":"10 minutes","g":"30 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You summon a spirit that assumes the form of an unusually intelligent, strong, and loyal steed, creating a long-lasting bond with it. Appearing in an unoccupied space within range, the steed takes on a form that you choose, such as a warhorse, a pony, a camel, an elk, or a mastiff. (Your GM might allow other animals to be summoned as steeds.) The steed has the statistics of the chosen form, though it is a celestial, fey, or fiend (your choice) instead of its normal type. Additionally, if your steed has an Intelligence of 5 or less, its Intelligence becomes 6, and it gains the ability to understand one language of your choice that you speak. Your steed serves you as a mount, both\u2026"},{"n":"Find Traps","l":2,"s":"Divi","c":["cleric","druid","ranger"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You sense the presence of any trap within range that is within line of sight. A trap, for the purpose of this spell, includes anything that would inflict a sudden or unexpected effect you consider harmful or undesirable, which was specifically intended as such by its creator. Thus, the spell would sense an area affected by the alarm spell, a glyph of warding, or a mechanical pit trap, but it would not reveal a natural weakness in the floor, an unstable ceiling, or a hidden sinkhole. This spell merely reveals that a trap is present. You don't learn the location of each trap, but you do learn the general nature of the danger posed by a trap you sense."},{"n":"Find the Path","l":6,"s":"Divi","c":["bard","cleric","druid"],"t":"1 minute","g":"Self","u":"Up to 24 hours","m":"VSM","k":1,"r":0,"x":"This spell allows you to find the shortest, most direct physical route to a specific fixed location that you are familiar with on the same plane of existence. If you name a destination on another plane of existence, a destination that moves (such as a mobile fortress), or a destination that isn't specific (such as \"a green dragon's lair\"), the spell fails. For the duration, as long as you are on the same plane of existence as the destination, you know how far it is and in what direction it lies. While you are traveling there, whenever you are presented with a choice of paths along the way, you automatically determine which path is the shortest and most direct route (but not\u2026"},{"n":"Finger of Death","l":7,"s":"Necr","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You send negative energy coursing through a creature that you can see within range, causing it searing pain. The target must make a constitution saving throw. It takes 7d8 + 30 necrotic damage on a failed save, or half as much damage on a successful one. A humanoid killed by this spell rises at the start of your next turn as a zombie that is permanently under your command, following your verbal orders to the best of its ability.","v":"con","hf":1,"dt":"necrotic","d":"7d8 + 30"},{"n":"Fire Bolt","l":0,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against the target. On a hit, the target takes 1d10 fire damage. A flammable object hit by this spell ignites if it isn't being worn or carried. This spell's damage increases by 1d10 when you reach 5th level (2d10), 11th level (3d10), and 17th level (4d10).","a":1,"dt":"fire","d":"1d10","cs":1},{"n":"Fire Shield","l":4,"s":"Evoc","c":["wizard"],"t":"1 action","g":"Self","u":"10 minutes","m":"VSM","k":0,"r":0,"x":"Thin and vaporous flame surround your body for the duration of the spell, radiating a bright light bright light in a 10-foot radius and dim light for an additional 10 feet. You can end the spell using an action to make it disappear. The flames are around you a heat shield or cold, your choice. The heat shield gives you cold damage resistance and the cold resistance to fire damage. In addition, whenever a creature within 5 feet of you hits you with a melee attack, flames spring from the shield. The attacker then suffers 2d8 points of fire damage or cold, depending on the model.","dt":"fire","d":"2d8"},{"n":"Fire Storm","l":7,"s":"Evoc","c":["cleric","druid","sorcerer"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A storm made up of sheets of roaring flame appears in a location you choose within range. The area of the storm consists of up to ten 10-foot cubes, which you can arrange as you wish. Each cube must have at least one face adjacent to the face of another cube. Each creature in the area must make a dexterity saving throw. It takes 7d10 fire damage on a failed save, or half as much damage on a successful one. The fire damages objects in the area and ignites flammable objects that aren't being worn or carried. If you choose, plant life in the area is unaffected by this spell.","v":"dex","hf":1,"dt":"fire","d":"7d10"},{"n":"Fireball","l":3,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A bright streak flashes from your pointing finger to a point you choose within range and then blossoms with a low roar into an explosion of flame. Each creature in a 20-foot-radius sphere centered on that point must make a dexterity saving throw. A target takes 8d6 fire damage on a failed save, or half as much damage on a successful one. The fire spreads around corners. It ignites flammable objects in the area that aren't being worn or carried.","h":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.","v":"dex","hf":1,"dt":"fire","d":"8d6","up":"1d6"},{"n":"Flame Blade","l":2,"s":"Evoc","c":["druid"],"t":"1 bonus action","g":"Self","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You evoke a fiery blade in your free hand. The blade is similar in size and shape to a scimitar, and it lasts for the duration. If you let go of the blade, it disappears, but you can evoke the blade again as a bonus action. You can use your action to make a melee spell attack with the fiery blade. On a hit, the target takes 3d6 fire damage. The flaming blade sheds bright light in a 10-foot radius and dim light for an additional 10 feet.","h":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for every two slot levels above 2nd.","dt":"fire","d":"3d6","up":"1d6"},{"n":"Flame Strike","l":5,"s":"Evoc","c":["cleric"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A vertical column of divine fire roars down from the heavens in a location you specify. Each creature in a 10-foot-radius, 40-foot-high cylinder centered on a point within range must make a dexterity saving throw. A creature takes 4d6 fire damage and 4d6 radiant damage on a failed save, or half as much damage on a successful one.","h":"When you cast this spell using a spell slot of 6th level or higher, the fire damage or the radiant damage (your choice) increases by 1d6 for each slot level above 5th.","v":"dex","hf":1,"dt":"fire","d":"4d6"},{"n":"Flaming Sphere","l":2,"s":"Conj","c":["druid","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A 5-foot-diameter sphere of fire appears in an unoccupied space of your choice within range and lasts for the duration. Any creature that ends its turn within 5 feet of the sphere must make a dexterity saving throw. The creature takes 2d6 fire damage on a failed save, or half as much damage on a successful one. As a bonus action, you can move the sphere up to 30 feet. If you ram the sphere into a creature, that creature must make the saving throw against the sphere's damage, and the sphere stops moving this turn. When you move the sphere, you can direct it over barriers up to 5 feet tall and jump it across pits up to 10 feet wide. The sphere ignites flammable objects not being\u2026","h":"When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d6 for each slot level above 2nd.","dt":"fire","d":"2d6","up":"1d6"},{"n":"Flesh to Stone","l":6,"s":"Tran","c":["warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You attempt to turn one creature that you can see within range into stone. If the target's body is made of flesh, the creature must make a constitution saving throw. On a failed save, it is restrained as its flesh begins to harden. On a successful save, the creature isn't affected. A creature restrained by this spell must make another constitution saving throw at the end of each of its turns. If it successfully saves against this spell three times, the spell ends. If it fails its saves three times, it is turned to stone and subjected to the petrified condition for the duration. The successes and failures don't need to be consecutive; keep track of both until the target collects\u2026","v":"con","hf":0},{"n":"Floating Disk","l":1,"s":"Conj","c":["wizard"],"t":"1 action","g":"30 feet","u":"1 hour","m":"VSM","k":0,"r":1,"x":"This spell creates a circular, horizontal plane of force, 3 feet in diameter and 1 inch thick, that floats 3 feet above the ground in an unoccupied space of your choice that you can see within range. The disk remains for the duration, and can hold up to 500 pounds. If more weight is placed on it, the spell ends, and everything on the disk falls to the ground. The disk is immobile while you are within 20 feet of it. If you move more than 20 feet away from it, the disk follows you so that it remains within 20 feet of you. If can move across uneven terrain, up or down stairs, slopes and the like, but it can't cross an elevation change of 10 feet or more. For example, the disk can't\u2026"},{"n":"Fly","l":3,"s":"Tran","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You touch a willing creature. The target gains a flying speed of 60 feet for the duration. When the spell ends, the target falls if it is still aloft, unless it can stop the fall.","h":"When you cast this spell using a spell slot of 4th level or higher, you can target one additional creature for each slot level above 3rd."},{"n":"Fog Cloud","l":1,"s":"Conj","c":["druid","ranger","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You create a 20-foot-radius sphere of fog centered on a point within range. The sphere spreads around corners, and its area is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it.","h":"When you cast this spell using a spell slot of 2nd level or higher, the radius of the fog increases by 20 feet for each slot level above 1st."},{"n":"Forbiddance","l":6,"s":"Abju","c":["cleric"],"t":"10 minutes","g":"Touch","u":"24 hours","m":"VSM","k":0,"r":1,"x":"You create a ward against magical travel that protects up to 40,000 square feet of floor space to a height of 30 feet above the floor. For the duration, creatures can't teleport into the area or use portals, such as those created by the gate spell, to enter the area. The spell proofs the area against planar travel, and therefore prevents creatures from accessing the area by way of the Astral Plane, Ethereal Plane, Feywild, Shadowfell, or the plane shift spell. In addition, the spell damages types of creatures that you choose when you cast it. Choose one or more of the following: celestials, elementals, fey, fiends, and undead. When a chosen creature enters the spell's area for the\u2026"},{"n":"Forcecage","l":7,"s":"Evoc","c":["bard","warlock","wizard"],"t":"1 action","g":"100 feet","u":"1 hour","m":"VSM","k":0,"r":0,"x":"An immobile, invisible, cube-shaped prison composed of magical force springs into existence around an area you choose within range. The prison can be a cage or a solid box, as you choose. A prison in the shape of a cage can be up to 20 feet on a side and is made from 1/2-inch diameter bars spaced 1/2 inch apart. A prison in the shape of a box can be up to 10 feet on a side, creating a solid barrier that prevents any matter from passing through it and blocking any spells cast into or out from the area. When you cast the spell, any creature that is completely inside the cage's area is trapped. Creatures only partially within the area, or those too large to fit inside the area, are\u2026"},{"n":"Foresight","l":9,"s":"Divi","c":["bard","druid","warlock","wizard"],"t":"1 minute","g":"Touch","u":"8 hours","m":"VSM","k":0,"r":0,"x":"You touch a willing creature and bestow a limited ability to see into the immediate future. For the duration, the target can't be surprised and has advantage on attack rolls, ability checks, and saving throws. Additionally, other creatures have disadvantage on attack rolls against the target for the duration. This spell immediately ends if you cast it again before its duration ends."},{"n":"Freedom of Movement","l":4,"s":"Abju","c":["bard","cleric","druid","ranger"],"t":"1 action","g":"Touch","u":"1 hour","m":"VSM","k":0,"r":0,"x":"You touch a willing creature. For the duration, the target's movement is unaffected by difficult terrain, and spells and other magical effects can neither reduce the target's speed nor cause the target to be paralyzed or restrained. The target can also spend 5 feet of movement to automatically escape from nonmagical restraints, such as manacles or a creature that has it grappled. Finally, being underwater imposes no penalties on the target's movement or attacks."},{"n":"Freezing Sphere","l":6,"s":"Evoc","c":["wizard"],"t":"1 action","g":"300 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A frigid globe of cold energy streaks from your fingertips to a point of your choice within range, where it explodes in a 60-foot-radius sphere. Each creature within the area must make a constitution saving throw. On a failed save, a creature takes 10d6 cold damage. On a successful save, it takes half as much damage. If the globe strikes a body of water or a liquid that is principally water (not including water-based creatures), it freezes the liquid to a depth of 6 inches over an area 30 feet square. This ice lasts for 1 minute. Creatures that were swimming on the surface of frozen water are trapped in the ice. A trapped creature can use an action to make a Strength check against\u2026","h":"When you cast this spell using a spell slot of 7th level or higher, the damage increases by 1d6 for each slot level above 6th.","v":"con","hf":1,"dt":"cold","d":"10d6"},{"n":"Gaseous Form","l":3,"s":"Tran","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You transform a willing creature you touch, along with everything it's wearing and carrying, into a misty cloud for the duration. The spell ends if the creature drops to 0 hit points. An incorporeal creature isn't affected. While in this form, the target's only method of movement is a flying speed of 10 feet. The target can enter and occupy the space of another creature. The target has resistance to nonmagical damage, and it has advantage on Strength, Dexterity, and constitution saving throws. The target can pass through small holes, narrow openings, and even mere cracks, though it treats liquids as though they were solid surfaces. The target can't fall and remains hovering in the\u2026"},{"n":"Gate","l":9,"s":"Conj","c":["cleric","sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You conjure a portal linking an unoccupied space you can see within range to a precise location on a different plane of existence. The portal is a circular opening, which you can make 5 to 20 feet in diameter. You can orient the portal in any direction you choose. The portal lasts for the duration. The portal has a front and a back on each plane where it appears. Travel through the portal is possible only by moving through its front. Anything that does so is instantly transported to the other plane, appearing in the unoccupied space nearest to the portal. Deities and other planar rulers can prevent portals created by this spell from opening in their presence or anywhere within\u2026"},{"n":"Geas","l":5,"s":"Ench","c":["bard","cleric","druid","paladin","wizard"],"t":"1 minute","g":"60 feet","u":"30 days","m":"V","k":0,"r":0,"x":"You place a magical command on a creature that you can see within range, forcing it to carry out some service or refrain from some action or course of activity as you decide. If the creature can understand you, it must succeed on a wisdom saving throw or become charmed by you for the duration. While the creature is charmed by you, it takes 5d10 psychic damage each time it acts in a manner directly counter to your instructions, but no more than once each day. A creature that can't understand you is unaffected by the spell. You can issue any command you choose, short of an activity that would result in certain death. Should you issue a suicidal command, the spell ends. You can end\u2026","h":"When you cast this spell using a spell slot of 7th or 8th level, the duration is 1 year. When you cast this spell using a spell slot of 9th level, the spell lasts until it is ended by one of the spells mentioned above.","v":"wis","hf":0},{"n":"Gentle Repose","l":2,"s":"Necr","c":["cleric","wizard"],"t":"1 action","g":"Touch","u":"10 days","m":"VSM","k":0,"r":1,"x":"You touch a corpse or other remains. For the duration, the target is protected from decay and can't become undead. The spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don't count against the time limit of spells such as raise dead."},{"n":"Giant Insect","l":4,"s":"Tran","c":["druid"],"t":"1 action","g":"30 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"You transform up to ten centipedes, three spiders, five wasps, or one scorpion within range into giant versions of their natural forms for the duration. A centipede becomes a giant centipede, a spider becomes a giant spider, a wasp becomes a giant wasp, and a scorpion becomes a giant scorpion. Each creature obeys your verbal commands, and in combat, they act on your turn each round. The GM has the statistics for these creatures and resolves their actions and movement. A creature remains in its giant size for the duration, until it drops to 0 hit points, or until you use an action to dismiss the effect on it. The GM might allow you to choose different targets. For example, if you\u2026"},{"n":"Glibness","l":8,"s":"Tran","c":["bard","warlock"],"t":"1 action","g":"Self","u":"1 hour","m":"V","k":0,"r":0,"x":"Until the spell ends, when you make a Charisma check, you can replace the number you roll with a 15. Additionally, no matter what you say, magic that would determine if you are telling the truth indicates that you are being truthful."},{"n":"Globe of Invulnerability","l":6,"s":"Abju","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"An immobile, faintly shimmering barrier springs into existence in a 10-foot radius around you and remains for the duration. Any spell of 5th level or lower cast from outside the barrier can't affect creatures or objects within it, even if the spell is cast using a higher level spell slot. Such a spell can target creatures and objects within the barrier, but the spell has no effect on them. Similarly, the area within the barrier is excluded from the areas affected by such spells.","h":"When you cast this spell using a spell slot of 7th level or higher, the barrier blocks spells of one level higher for each slot level above 6th."},{"n":"Glyph of Warding","l":3,"s":"Abju","c":["bard","cleric","wizard"],"t":"1 hour","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"When you cast this spell, you inscribe a glyph that harms other creatures, either upon a surface (such as a table or a section of floor or wall) or within an object that can be closed (such as a book, a scroll, or a treasure chest) to conceal the glyph. If you choose a surface, the glyph can cover an area of the surface no larger than 10 feet in diameter. If you choose an object, that object must remain in its place; if the object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly invisible and requires a successful Intelligence (Investigation) check against your spell save DC to be found.\u2026","h":"When you cast this spell using a spell slot of 4th level or higher, the damage of an explosive runes glyph increases by 1d8 for each slot level above 3rd. If you create a spell glyph, you can store any spell of up to the same level as the slot you use for the glyph of warding."},{"n":"Goodberry","l":1,"s":"Tran","c":["druid","ranger"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"Up to ten berries appear in your hand and are infused with magic for the duration. A creature can use its action to eat one berry. Eating a berry restores 1 hit point, and the berry provides enough nourishment to sustain a creature for a day. The berries lose their potency if they have not been consumed within 24 hours of the casting of this spell."},{"n":"Grease","l":1,"s":"Conj","c":["wizard"],"t":"1 action","g":"60 feet","u":"1 minute","m":"VSM","k":0,"r":0,"x":"Slick grease covers the ground in a 10-foot square centered on a point within range and turns it into difficult terrain for the duration. When the grease appears, each creature standing in its area must succeed on a dexterity saving throw or fall prone. A creature that enters the area or ends its turn there must also succeed on a dexterity saving throw or fall prone.","v":"dex","hf":0},{"n":"Greater Invisibility","l":4,"s":"Illu","c":["bard","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You or a creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person."},{"n":"Greater Restoration","l":5,"s":"Abju","c":["bard","cleric","druid"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You imbue a creature you touch with positive energy to undo a debilitating effect. You can reduce the target's exhaustion level by one, or end one of the following effects on the target: - One effect that charmed or petrified the target - One curse, including the target's attunement to a cursed magic item - Any reduction to one of the target's ability scores - One effect reducing the target's hit point maximum"},{"n":"Guardian of Faith","l":4,"s":"Conj","c":["cleric"],"t":"1 action","g":"30 feet","u":"8 hours","m":"V","k":0,"r":0,"x":"A Large spectral guardian appears and hovers for the duration in an unoccupied space of your choice that you can see within range. The guardian occupies that space and is indistinct except for a gleaming sword and shield emblazoned with the symbol of your deity. Any creature hostile to you that moves to a space within 10 feet of the guardian for the first time on a turn must succeed on a dexterity saving throw. The creature takes 20 radiant damage on a failed save, or half as much damage on a successful one. The guardian vanishes when it has dealt a total of 60 damage.","v":"dex","hf":1,"dt":"radiant","d":"20"},{"n":"Guards and Wards","l":6,"s":"Abju","c":["bard","wizard"],"t":"10 minutes","g":"Touch","u":"24 hours","m":"VSM","k":0,"r":0,"x":"You create a ward that protects up to 2,500 square feet of floor space (an area 50 feet square, or one hundred 5-foot squares or twenty-five 10-foot squares). The warded area can be up to 20 feet tall, and shaped as you desire. You can ward several stories of a stronghold by dividing the area among them, as long as you can walk into each contiguous area while you are casting the spell. When you cast this spell, you can specify individuals that are unaffected by any or all of the effects that you choose. You can also specify a password that, when spoken aloud, makes the speaker immune to these effects. Guards and wards creates the following effects within the warded area.\u2026"},{"n":"Guidance","l":0,"s":"Divi","c":["cleric","druid"],"t":"1 action","g":"Touch","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one ability check of its choice. It can roll the die before or after making the ability check. The spell then ends."},{"n":"Guiding Bolt","l":1,"s":"Evoc","c":["cleric"],"t":"1 action","g":"120 feet","u":"1 round","m":"VS","k":0,"r":0,"x":"A flash of light streaks toward a creature of your choice within range. Make a ranged spell attack against the target. On a hit, the target takes 4d6 radiant damage, and the next attack roll made against this target before the end of your next turn has advantage, thanks to the mystical dim light glittering on the target until then.","h":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st.","a":1,"dt":"radiant","d":"4d6","up":"1d6"},{"n":"Gust of Wind","l":2,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A line of strong wind 60 feet long and 10 feet wide blasts from you in a direction you choose for the spell's duration. Each creature that starts its turn in the line must succeed on a strength saving throw or be pushed 15 feet away from you in a direction following the line. Any creature in the line must spend 2 feet of movement for every 1 foot it moves when moving closer to you. The gust disperses gas or vapor, and it extinguishes candles, torches, and similar unprotected flames in the area. It causes protected flames, such as those of lanterns, to dance wildly and has a 50 percent chance to extinguish them. As a bonus action on each of your turns before the spell ends, you can\u2026","v":"str","hf":0},{"n":"Hallow","l":5,"s":"Evoc","c":["cleric"],"t":"24 hours","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"You touch a point and infuse an area around it with holy (or unholy) power. The area can have a radius up to 60 feet, and the spell fails if the radius includes an area already under the effect a hallow spell. The affected area is subject to the following effects. First, celestials, elementals, fey, fiends, and undead can't enter the area, nor can such creatures charm, frighten, or possess creatures within it. Any creature charmed, frightened, or possessed by such a creature is no longer charmed, frightened, or possessed upon entering the area. You can exclude one or more of those types of creatures from this effect. Second, you can bind an extra effect to the area. Choose the\u2026","v":"cha","hf":0},{"n":"Hallucinatory Terrain","l":4,"s":"Illu","c":["bard","druid","warlock","wizard"],"t":"10 minutes","g":"300 feet","u":"24 hours","m":"VSM","k":0,"r":0,"x":"You make natural terrain in a 150-foot cube in range look, sound, and smell like some other sort of natural terrain. Thus, open fields or a road can be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Manufactured structures, equipment, and creatures within the area aren't changed in appearance. The tactile characteristics of the terrain are unchanged, so creatures entering the area are likely to see through the illusion. If the difference isn't obvious by touch, a creature carefully examining the illusion can\u2026"},{"n":"Harm","l":6,"s":"Necr","c":["cleric"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You unleash a virulent disease on a creature that you can see within range. The target must make a constitution saving throw. On a failed save, it takes 14d6 necrotic damage, or half as much damage on a successful save. The damage can't reduce the target's hit points below 1. If the target fails the saving throw, its hit point maximum is reduced for 1 hour by an amount equal to the necrotic damage it took. Any effect that removes a disease allows a creature's hit point maximum to return to normal before that time passes.","v":"con","hf":1,"dt":"necrotic","d":"14d6"},{"n":"Haste","l":3,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Choose a willing creature that you can see within range. Until the spell ends, the target's speed is doubled, it gains a +2 bonus to AC, it has advantage on dexterity saving throws, and it gains an additional action on each of its turns. That action can be used only to take the Attack (one weapon attack only), Dash, Disengage, Hide, or Use an Object action. When the spell ends, the target can't move or take actions until after its next turn, as a wave of lethargy sweeps over it."},{"n":"Heal","l":6,"s":"Evoc","c":["cleric","druid"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Choose a creature that you can see within range. A surge of positive energy washes through the creature, causing it to regain 70 hit points. This spell also ends blindness, deafness, and any diseases affecting the target. This spell has no effect on constructs or undead.","h":"When you cast this spell using a spell slot of 7th level or higher, the amount of healing increases by 10 for each slot level above 6th.","dt":"healing","d":"70","up":"10"},{"n":"Healing Word","l":1,"s":"Evoc","c":["bard","cleric","druid"],"t":"1 bonus action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"A creature of your choice that you can see within range regains hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","h":"When you cast this spell using a spell slot of 2nd level or higher, the healing increases by 1d4 for each slot level above 1st.","dt":"healing","am":1,"d":"1d4","up":"1d4"},{"n":"Heat Metal","l":2,"s":"Tran","c":["bard","druid"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Choose a manufactured metal object, such as a metal weapon or a suit of heavy or medium metal armor, that you can see within range. You cause the object to glow red-hot. Any creature in physical contact with the object takes 2d8 fire damage when you cast the spell. Until the spell ends, you can use a bonus action on each of your subsequent turns to cause this damage again. If a creature is holding or wearing the object and takes the damage from it, the creature must succeed on a constitution saving throw or drop the object if it can. If it doesn't drop the object, it has disadvantage on attack rolls and ability checks until the start of your next turn.","h":"When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8 for each slot level above 2nd.","v":"con","hf":0,"dt":"fire","d":"2d8","up":"1d8"},{"n":"Hellish Rebuke","l":1,"s":"Evoc","c":["warlock"],"t":"1 reaction","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You point your finger, and the creature that damaged you is momentarily surrounded by hellish flames. The creature must make a dexterity saving throw. It takes 2d10 fire damage on a failed save, or half as much damage on a successful one.","h":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st.","v":"dex","hf":1,"dt":"fire","d":"2d10","up":"1d10"},{"n":"Heroes' Feast","l":6,"s":"Conj","c":["cleric","druid"],"t":"10 minutes","g":"30 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You bring forth a great feast, including magnificent food and drink. The feast takes 1 hour to consume and disappears at the end of that time, and the beneficial effects don't set in until this hour is over. Up to twelve other creatures can partake of the feast. A creature that partakes of the feast gains several benefits. The creature is cured of all diseases and poison, becomes immune to poison and being frightened, and makes all wisdom saving throws with advantage. Its hit point maximum also increases by 2d10, and it gains the same number of hit points. These benefits last for 24 hours."},{"n":"Heroism","l":1,"s":"Ench","c":["bard","paladin"],"t":"1 action","g":"Touch","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"A willing creature you touch is imbued with bravery. Until the spell ends, the creature is immune to being frightened and gains temporary hit points equal to your spellcasting ability modifier at the start of each of its turns. When the spell ends, the target loses any remaining temporary hit points from this spell."},{"n":"Hideous Laughter","l":1,"s":"Ench","c":["bard","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A creature of your choice that you can see within range perceives everything as hilariously funny and falls into fits of laughter if this spell affects it. The target must succeed on a wisdom saving throw or fall prone, becoming incapacitated and unable to stand up for the duration. A creature with an Intelligence score of 4 or less isn't affected. At the end of each of its turns, and each time it takes damage, the target can make another wisdom saving throw. The target had advantage on the saving throw if it's triggered by damage. On a success, the spell ends.","v":"wis","hf":0},{"n":"Hold Monster","l":5,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"90 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Choose a creature you can see and reach. The target must make a saving throw of Wisdom or be paralyzed for the duration of the spell. This spell has no effect against the undead. At the end of each round, the target can make a new saving throw of Wisdom. If successful, the spell ends for the creature.","h":"When you cast this spell using a level 6 or higher location, you can target an additional creature for each level of location beyond the fifth. The creatures must be within 30 feet o f each other when you target them.","v":"wis","hf":0},{"n":"Hold Person","l":2,"s":"Ench","c":["bard","cleric","druid","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Choose a humanoid that you can see within range. The target must succeed on a wisdom saving throw or be paralyzed for the duration. At the end of each of its turns, the target can make another wisdom saving throw. On a success, the spell ends on the target.","h":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional humanoid for each slot level above 2nd. The humanoids must be within 30 feet of each other when you target them.","v":"wis","hf":0},{"n":"Holy Aura","l":8,"s":"Abju","c":["cleric"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Divine light washes out from you and coalesces in a soft radiance in a 30-foot radius around you. Creatures of your choice in that radius when you cast this spell shed dim light in a 5-foot radius and have advantage on all saving throws, and other creatures have disadvantage on attack rolls against them until the spell ends. In addition, when a fiend or an undead hits an affected creature with a melee attack, the aura flashes with brilliant light. The attacker must succeed on a constitution saving throw or be blinded until the spell ends."},{"n":"Hunter's Mark","l":1,"s":"Divi","c":["ranger"],"t":"1 bonus action","g":"90 feet","u":"Up to 1 hour","m":"V","k":1,"r":0,"x":"You choose a creature you can see within range and mystically mark it as your quarry. Until the spell ends, you deal an extra 1d6 damage to the target whenever you hit it with a weapon attack, and you have advantage on any Wisdom (Perception) or Wisdom (Survival) check you make to find it. If the target drops to 0 hit points before this spell ends, you can use a bonus action on a subsequent turn of yours to mark a new creature.","h":"When you cast this spell using a spell slot of 3rd or 4th level, you can maintain your concentration on the spell for up to 8 hours. When you use a spell slot of 5th level or higher, you can maintain your concentration on the spell for up to 24 hours."},{"n":"Hypnotic Pattern","l":3,"s":"Illu","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"SM","k":1,"r":0,"x":"You create a twisting pattern of colors that weaves through the air inside a 30-foot cube within range. The pattern appears for a moment and vanishes. Each creature in the area who sees the pattern must make a wisdom saving throw. On a failed save, the creature becomes charmed for the duration. While charmed by this spell, the creature is incapacitated and has a speed of 0. The spell ends for an affected creature if it takes any damage or if someone else uses an action to shake the creature out of its stupor.","v":"wis","hf":0},{"n":"Ice Storm","l":4,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"300 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A hail of rock-hard ice pounds to the ground in a 20-foot-radius, 40-foot-high cylinder centered on a point within range. Each creature in the cylinder must make a dexterity saving throw. A creature takes 2d8 bludgeoning damage and 4d6 cold damage on a failed save, or half as much damage on a successful one. Hailstones turn the storm's area of effect into difficult terrain until the end of your next turn.","h":"When you cast this spell using a spell slot of 5th level or higher, the bludgeoning damage increases by 1d8 for each slot level above 4th.","v":"dex","hf":1,"dt":"bludgeoning","d":"2d8","up":"1d8"},{"n":"Identify","l":1,"s":"Divi","c":["bard","wizard"],"t":"1 minute","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":1,"x":"You choose one object that you must touch throughout the casting of the spell. If it is a magic item or some other magic-imbued object, you learn its properties and how to use them, whether it requires attunement to use, and how many charges it has, if any. You learn whether any spells are affecting the item and what they are. If the item was created by a spell, you learn which spell created it. If you instead touch a creature throughout the casting, you learn what spells, if any, are currently affecting it."},{"n":"Illusory Script","l":1,"s":"Illu","c":["bard","warlock","wizard"],"t":"1 minute","g":"Touch","u":"10 days","m":"SM","k":0,"r":1,"x":"You write on parchment, paper, or some other suitable writing material and imbue it with a potent illusion that lasts for the duration. To you and any creatures you designate when you cast the spell, the writing appears normal, written in your hand, and conveys whatever meaning you intended when you wrote the text. To all others, the writing appears as if it were written in an unknown or magical script that is unintelligible. Alternatively, you can cause the writing to appear to be an entirely different message, written in a different hand and language, though the language must be one you know. Should the spell be dispelled, the original script and the illusion both disappear. A\u2026"},{"n":"Imprisonment","l":9,"s":"Abju","c":["warlock","wizard"],"t":"1 minute","g":"30 feet","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"You create a magical restraint to hold a creature that you can see within range. The target must succeed on a wisdom saving throw or be bound by the spell; if it succeeds, it is immune to this spell if you cast it again. While affected by this spell, the creature doesn't need to breathe, eat, or drink, and it doesn't age. Divination spells can't locate or perceive the target. When you cast the spell, you choose one of the following forms of imprisonment. ***Burial.*** The target is entombed far beneath the earth in a sphere of magical force that is just large enough to contain the target. Nothing can pass through the sphere, nor can any creature teleport or use planar travel to\u2026","v":"wis","hf":0},{"n":"Incendiary Cloud","l":8,"s":"Conj","c":["sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"A swirling cloud of smoke shot through with white-hot embers appears in a 20-foot-radius sphere centered on a point within range. The cloud spreads around corners and is heavily obscured. It lasts for the duration or until a wind of moderate or greater speed (at least 10 miles per hour) disperses it. When the cloud appears, each creature in it must make a dexterity saving throw. A creature takes 10d8 fire damage on a failed save, or half as much damage on a successful one. A creature must also make this saving throw when it enters the spell's area for the first time on a turn or ends its turn there. The cloud moves 10 feet directly away from you in a direction that you choose at\u2026","v":"dex","hf":1,"dt":"fire","d":"10d8"},{"n":"Inflict Wounds","l":1,"s":"Necr","c":["cleric"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Make a melee spell attack against a creature you can reach. On a hit, the target takes 3d10 necrotic damage.","h":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d10 for each slot level above 1st.","a":1,"dt":"necrotic","d":"3d10","up":"1d10"},{"n":"Insect Plague","l":5,"s":"Conj","c":["cleric","druid","sorcerer"],"t":"1 action","g":"300 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"Swarming, biting locusts fill a 20-foot-radius sphere centered on a point you choose within range. The sphere spreads around corners. The sphere remains for the duration, and its area is lightly obscured. The sphere's area is difficult terrain. When the area appears, each creature in it must make a constitution saving throw. A creature takes 4d10 piercing damage on a failed save, or half as much damage on a successful one. A creature must also make this saving throw when it enters the spell's area for the first time on a turn or ends its turn there.","h":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d10 for each slot level above 5th.","v":"con","hf":1,"dt":"piercing","d":"4d10","up":"1d10"},{"n":"Instant Summons","l":6,"s":"Conj","c":["wizard"],"t":"1 minute","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":1,"x":"You touch an object weighing 10 pounds or less whose longest dimension is 6 feet or less. The spell leaves an invisible mark on its surface and invisibly inscribes the name of the item on the sapphire you use as the material component. Each time you cast this spell, you must use a different sapphire. At any time thereafter, you can use your action to speak the item's name and crush the sapphire. The item instantly appears in your hand regardless of physical or planar distances, and the spell ends. If another creature is holding or carrying the item, crushing the sapphire doesn't transport the item to you, but instead you learn who the creature possessing the object is and roughly\u2026"},{"n":"Invisibility","l":2,"s":"Illu","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"A creature you touch becomes invisible until the spell ends. Anything the target is wearing or carrying is invisible as long as it is on the target's person. The spell ends for a target that attacks or casts a spell.","h":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd."},{"n":"Irresistible Dance","l":6,"s":"Ench","c":["bard","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"V","k":1,"r":0,"x":"Choose one creature that you can see within range. The target begins a comic dance in place: shuffling, tapping its feet, and capering for the duration. Creatures that can't be charmed are immune to this spell. A dancing creature must use all its movement to dance without leaving its space and has disadvantage on dexterity saving throws and attack rolls. While the target is affected by this spell, other creatures have advantage on attack rolls against it. As an action, a dancing creature makes a wisdom saving throw to regain control of itself. On a successful save, the spell ends."},{"n":"Jump","l":1,"s":"Tran","c":["druid","ranger","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"1 minute","m":"VSM","k":0,"r":0,"x":"You touch a creature. The creature's jump distance is tripled until the spell ends."},{"n":"Knock","l":2,"s":"Tran","c":["bard","sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"Choose an object that you can see within range. The object can be a door, a box, a chest, a set of manacles, a padlock, or another object that contains a mundane or magical means that prevents access. A target that is held shut by a mundane lock or that is stuck or barred becomes unlocked, unstuck, or unbarred. If the object has multiple locks, only one of them is unlocked. If you choose a target that is held shut with arcane lock, that spell is suppressed for 10 minutes, during which time the target can be opened and shut normally. When you cast the spell, a loud knock, audible from as far away as 300 feet, emanates from the target object."},{"n":"Legend Lore","l":5,"s":"Divi","c":["bard","cleric","wizard"],"t":"10 minutes","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"Name or describe a person, place, or object. The spell brings to your mind a brief summary of the significant lore about the thing you named. The lore might consist of current tales, forgotten stories, or even secret lore that has never been widely known. If the thing you named isn't of legendary importance, you gain no information. The more information you already have about the thing, the more precise and detailed the information you receive is. The information you learn is accurate but might be couched in figurative language. For example, if you have a mysterious magic axe on hand the spell might yield this information: \"Woe to the evildoer whose hand touches the axe, for even\u2026"},{"n":"Lesser Restoration","l":2,"s":"Abju","c":["bard","cleric","druid","paladin","ranger"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You touch a creature and can end either one disease or one condition afflicting it. The condition can be blinded, deafened, paralyzed, or poisoned."},{"n":"Levitate","l":2,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"One creature or object of your choice that you can see within range rises vertically, up to 20 feet, and remains suspended there for the duration. The spell can levitate a target that weighs up to 500 pounds. An unwilling creature that succeeds on a constitution saving throw is unaffected. The target can move only by pushing or pulling against a fixed object or surface within reach (such as a wall or a ceiling), which allows it to move as if it were climbing. You can change the target's altitude by up to 20 feet in either direction on your turn. If you are the target, you can move up or down as part of your move. Otherwise, you can use your action to move the target, which must\u2026"},{"n":"Light","l":0,"s":"Evoc","c":["bard","cleric","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"1 hour","m":"VM","k":0,"r":0,"x":"You touch one object that is no larger than 10 feet in any dimension. Until the spell ends, the object sheds bright light in a 20-foot radius and dim light for an additional 20 feet. The light can be colored as you like. Completely covering the object with something opaque blocks the light. The spell ends if you cast it again or dismiss it as an action. If you target an object held or worn by a hostile creature, that creature must succeed on a dexterity saving throw to avoid the spell.","v":"dex","hf":0},{"n":"Lightning Bolt","l":3,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A stroke of lightning forming a line 100 feet long and 5 feet wide blasts out from you in a direction you choose. Each creature in the line must make a dexterity saving throw. A creature takes 8d6 lightning damage on a failed save, or half as much damage on a successful one. The lightning ignites flammable objects in the area that aren't being worn or carried.","h":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.","v":"dex","hf":1,"dt":"lightning","d":"8d6","up":"1d6"},{"n":"Locate Animals or Plants","l":2,"s":"Divi","c":["bard","druid","ranger"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":1,"x":"Describe or name a specific kind of beast or plant. Concentrating on the voice of nature in your surroundings, you learn the direction and distance to the closest creature or plant of that kind within 5 miles, if any are present."},{"n":"Locate Creature","l":4,"s":"Divi","c":["bard","cleric","druid","paladin","ranger","wizard"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"Describe or name a creature that is familiar to you. You sense the direction to the creature's location, as long as that creature is within 1,000 feet of you. If the creature is moving, you know the direction of its movement. The spell can locate a specific creature known to you, or the nearest creature of a specific kind (such as a human or a unicorn), so long as you have seen such a creature up close--within 30 feet--at least once. If the creature you described or named is in a different form, such as being under the effects of a polymorph spell, this spell doesn't locate the creature. This spell can't locate a creature if running water at least 10 feet wide blocks a direct path\u2026"},{"n":"Locate Object","l":2,"s":"Divi","c":["bard","cleric","druid","paladin","ranger","wizard"],"t":"1 action","g":"Self","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"Describe or name an object that is familiar to you. You sense the direction to the object's location, as long as that object is within 1,000 feet of you. If the object is in motion, you know the direction of its movement. The spell can locate a specific object known to you, as long as you have seen it up close--within 30 feet--at least once. Alternatively, the spell can locate the nearest object of a particular kind, such as a certain kind of apparel, jewelry, furniture, tool, or weapon. This spell can't locate an object if any thickness of lead, even a thin sheet, blocks a direct path between you and the object."},{"n":"Longstrider","l":1,"s":"Tran","c":["bard","druid","ranger","wizard"],"t":"1 action","g":"Touch","u":"1 hour","m":"VSM","k":0,"r":0,"x":"You touch a creature. The target's speed increases by 10 feet until the spell ends.","h":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each spell slot above 1st."},{"n":"Mage Armor","l":1,"s":"Abju","c":["sorcerer","wizard"],"t":"1 action","g":"Touch","u":"8 hours","m":"VSM","k":0,"r":0,"x":"You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action."},{"n":"Mage Hand","l":0,"s":"Conj","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"1 minute","m":"VS","k":0,"r":0,"x":"A spectral, floating hand appears at a point you choose within range. The hand lasts for the duration or until you dismiss it as an action. The hand vanishes if it is ever more than 30 feet away from you or if you cast this spell again. You can use your action to control the hand. You can use the hand to manipulate an object, open an unlocked door or container, stow or retrieve an item from an open container, or pour the contents out of a vial. You can move the hand up to 30 feet each time you use it. The hand can't attack, activate magic items, or carry more than 10 pounds."},{"n":"Magic Circle","l":3,"s":"Abju","c":["cleric","paladin","warlock","wizard"],"t":"1 minute","g":"10 feet","u":"1 hour","m":"VSM","k":0,"r":0,"x":"You create a 10-foot radius, 20-foot-tall cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear whenever the cylinder intersects with the floor or other surface. Choose one or more of the following types of creatures: celestials, elementals, fey, fiends, or undead. The circle affects a creature of the chosen type in the following ways: - The creature can't willingly enter the cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a charisma saving throw. - The creature has disadvantage on attack rolls against targets within the cylinder. - Targets\u2026","h":"When you cast this spell using a spell slot of 4th level or higher, the duration increases by 1 hour for each slot level above 3rd.","v":"cha","hf":0},{"n":"Magic Jar","l":6,"s":"Necr","c":["wizard"],"t":"1 minute","g":"Self","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"Your body falls into a catatonic state as your soul leaves it and enters the container you used for the spell's material component. While your soul inhabits the container, you are aware of your surroundings as if you were in the container's space. You can't move or use reactions. The only action you can take is to project your soul up to 100 feet out of the container, either returning to your living body (and ending the spell) or attempting to possess a humanoids body. You can attempt to possess any humanoid within 100 feet of you that you can see (creatures warded by a protection from evil and good or magic circle spell can't be possessed). The target must make a charisma saving\u2026","v":"cha","hf":0},{"n":"Magic Missile","l":1,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You create three glowing darts of magical force. Each dart hits a creature of your choice that you can see within range. A dart deals 1d4 + 1 force damage to its target. The darts all strike simultaneously, and you can direct them to hit one creature or several.","h":"When you cast this spell using a spell slot of 2nd level or higher, the spell creates one more dart for each slot level above 1st.","dt":"force","d":"3d4 + 3","up":"1d4+1"},{"n":"Magic Mouth","l":2,"s":"Illu","c":["bard","wizard"],"t":"1 minute","g":"30 feet","u":"Until dispelled","m":"VSM","k":0,"r":1,"x":"You plant a message to an object in the range of the spell. The message is verbalized when the trigger conditions are met. Choose an object that you see, and that is not worn or carried by another creature. Then say the message, which should not exceed 25 words but listening can take up to 10 minutes. Finally, establish the circumstances that trigger the spell to deliver your message. When these conditions are satisfied, a magical mouth appears on the object and it articulates the message imitating your voice, the same tone used during implantation of the message. If the selected object has a mouth or something that approaches such as the mouth of a statue, the magic mouth come\u2026"},{"n":"Magic Weapon","l":2,"s":"Tran","c":["paladin","wizard"],"t":"1 bonus action","g":"Touch","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You touch a nonmagical weapon. Until the spell ends, that weapon becomes a magic weapon with a +1 bonus to attack rolls and damage rolls.","h":"When you cast this spell using a spell slot of 4th level or higher, the bonus increases to +2. When you use a spell slot of 6th level or higher, the bonus increases to +3."},{"n":"Magnificent Mansion","l":7,"s":"Conj","c":["bard","wizard"],"t":"1 minute","g":"300 feet","u":"24 hours","m":"VSM","k":0,"r":0,"x":"You conjure an extradimensional dwelling in range that lasts for the duration. You choose where its one entrance is located. The entrance shimmers faintly and is 5 feet wide and 10 feet tall. You and any creature you designate when you cast the spell can enter the extradimensional dwelling as long as the portal remains open. You can open or close the portal if you are within 30 feet of it. While closed, the portal is invisible. Beyond the portal is a magnificent foyer with numerous chambers beyond. The atmosphere is clean, fresh, and warm. You can create any floor plan you like, but the space can't exceed 50 cubes, each cube being 10 feet on each side. The place is furnished and\u2026"},{"n":"Major Image","l":3,"s":"Illu","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 20-foot cube. The image appears at a spot that you can see within range and lasts for the duration. It seems completely real, including sounds, smells, and temperature appropriate to the thing depicted. You can't create sufficient heat or cold to cause damage, a sound loud enough to deal thunder damage or deafen a creature, or a smell that might sicken a creature (like a troglodyte's stench). As long as you are within range of the illusion, you can use your action to cause the image to move to any other spot within range. As the image changes location, you can alter its\u2026","h":"When you cast this spell using a spell slot of 6th level or higher, the spell lasts until dispelled, without requiring your concentration."},{"n":"Mass Cure Wounds","l":5,"s":"Conj","c":["bard","cleric","druid"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A wave of healing energy washes out from a point of your choice within range. Choose up to six creatures in a 30-foot-radius sphere centered on that point. Each target regains hit points equal to 3d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","h":"When you cast this spell using a spell slot of 6th level or higher, the healing increases by 1d8 for each slot level above 5th.","dt":"healing","am":1,"d":"3d8","up":"1d8"},{"n":"Mass Heal","l":9,"s":"Conj","c":["cleric"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A flood of healing energy flows from you into injured creatures around you. You restore up to 700 hit points, divided as you choose among any number of creatures that you can see within range. Creatures healed by this spell are also cured of all diseases and any effect making them blinded or deafened. This spell has no effect on undead or constructs.","dt":"healing","d":"700"},{"n":"Mass Healing Word","l":3,"s":"Evoc","c":["cleric"],"t":"1 bonus action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"As you cal
