l out words of restoration, up to six creatures of your choice that you can see within range regain hit points equal to 1d4 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","h":"When you cast this spell using a spell slot of 4th level or higher, the healing increases by 1d4 for each slot level above 3rd.","dt":"healing","am":1,"d":"1d4","up":"1d4"},{"n":"Mass Suggestion","l":6,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"24 hours","m":"VM","k":0,"r":0,"x":"You suggest a course of activity (limited to a sentence or two) and magically influence up to twelve creatures of your choice that you can see within range and that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act automatically negates the effect of the spell. Each target must make a wisdom saving throw. On a failed save, it pursues the course of action you described to the best of its ability. The suggested course of action can\u2026","h":"When you cast this spell using a 7th-level spell slot, the duration is 10 days. When you use an 8th-level spell slot, the duration is 30 days. When you use a 9th-level spell slot, the duration is a year and a day.","v":"wis","hf":0},{"n":"Maze","l":8,"s":"Conj","c":["wizard"],"t":"1 action","g":"60 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"You banish a creature that you can see within range into a labyrinthine demiplane. The target remains there for the duration or until it escapes the maze. The target can use its action to attempt to escape. When it does so, it makes a DC 20 Intelligence check. If it succeeds, it escapes, and the spell ends (a minotaur or goristro demon automatically succeeds). When the spell ends, the target reappears in the space it left or, if that space is occupied, in the nearest unoccupied space."},{"n":"Meld Into Stone","l":3,"s":"Tran","c":["cleric"],"t":"1 action","g":"Touch","u":"8 hours","m":"VS","k":0,"r":1,"x":"You step into a stone object or surface large enough to fully contain your body, melding yourself and all the equipment you carry with the stone for the duration. Using your movement, you step into the stone at a point you can touch. Nothing of your presence remains visible or otherwise detectable by nonmagical senses. While merged with the stone, you can't see what occurs outside it, and any Wisdom (Perception) checks you make to hear sounds outside it are made with disadvantage. You remain aware of the passage of time and can cast spells on yourself while merged in the stone. You can use your movement to leave the stone where you entered it, which ends the spell. You otherwise\u2026"},{"n":"Mending","l":0,"s":"Tran","c":["cleric","bard","druid","sorcerer","wizard"],"t":"1 minute","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"This spell repairs a single break or tear in an object you touch, such as a broken key, a torn cloak, or a leaking wineskin. As long as the break or tear is no longer than 1 foot in any dimension, you mend it, leaving no trace of the former damage. This spell can physically repair a magic item or construct, but the spell can't restore magic to such an object."},{"n":"Message","l":0,"s":"Tran","c":["bard","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"1 round","m":"VSM","k":0,"r":0,"x":"You point your finger toward a creature within range and whisper a message. The target (and only the target) hears the message and can reply in a whisper that only you can hear. You can cast this spell through solid objects if you are familiar with the target and know it is beyond the barrier. Magical silence, 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood blocks the spell. The spell doesn't have to follow a straight line and can travel freely around corners or through openings."},{"n":"Meteor Swarm","l":9,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"1 mile","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Blazing orbs of fire plummet to the ground at four different points you can see within range. Each creature in a 40-foot-radius sphere centered on each point you choose must make a dexterity saving throw. The sphere spreads around corners. A creature takes 20d6 fire damage and 20d6 bludgeoning damage on a failed save, or half as much damage on a successful one. A creature in the area of more than one fiery burst is affected only once. The spell damages objects in the area and ignites flammable objects that aren't being worn or carried.","v":"dex","hf":1,"dt":"fire","d":"20d6"},{"n":"Mind Blank","l":8,"s":"Abju","c":["bard","wizard"],"t":"1 action","g":"Touch","u":"24 hours","m":"VS","k":0,"r":0,"x":"Until the spell ends, one willing creature you touch is immune to psychic damage, any effect that would sense its emotions or read its thoughts, divination spells, and the charmed condition. The spell even foils wish spells and spells or effects of similar power used to affect the target's mind or to gain information about the target."},{"n":"Minor Illusion","l":0,"s":"Illu","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"1 minute","m":"SM","k":0,"r":0,"x":"You create a sound or an image of an object within range that lasts for the duration. The illusion also ends if you dismiss it as an action or cast this spell again. If you create a sound, its volume can range from a whisper to a scream. It can be your voice, someone else's voice, a lion's roar, a beating of drums, or any other sound you choose. The sound continues unabated throughout the duration, or you can make discrete sounds at different times before the spell ends. If you create an image of an object--such as a chair, muddy footprints, or a small chest--it must be no larger than a 5-foot cube. The image can't create sound, light, smell, or any other sensory effect. Physical\u2026"},{"n":"Mirage Arcane","l":7,"s":"Illu","c":["bard","druid","wizard"],"t":"10 minutes","g":"Sight","u":"10 days","m":"VS","k":0,"r":0,"x":"You make terrain in an area up to 1 mile square look, sound, smell, and even feel like some other sort of terrain. The terrain's general shape remains the same, however. Open fields or a road could be made to resemble a swamp, hill, crevasse, or some other difficult or impassable terrain. A pond can be made to seem like a grassy meadow, a precipice like a gentle slope, or a rock-strewn gully like a wide and smooth road. Similarly, you can alter the appearance of structures, or add them where none are present. The spell doesn't disguise, conceal, or add creatures. The illusion includes audible, visual, tactile, and olfactory elements, so it can turn clear ground into difficult\u2026"},{"n":"Mirror Image","l":2,"s":"Illu","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"Self","u":"1 minute","m":"VS","k":0,"r":0,"x":"Three illusory duplicates of yourself appear in your space. Until the spell ends, the duplicates move with you and mimic your actions, shifting position so it's impossible to track which image is real. You can use your action to dismiss the illusory duplicates. Each time a creature targets you with an attack during the spell's duration, roll a d20 to determine whether the attack instead targets one of your duplicates. If you have three duplicates, you must roll a 6 or higher to change the attack's target to a duplicate. With two duplicates, you must roll an 8 or higher. With one duplicate, you must roll an 11 or higher. A duplicate's AC equals 10 + your Dexterity modifier. If an\u2026"},{"n":"Mislead","l":5,"s":"Illu","c":["bard","wizard"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"S","k":1,"r":0,"x":"You become invisible at the same time that an illusory double of you appears where you are standing. The double lasts for the duration, but the invisibility ends if you attack or cast a spell. You can use your action to move your illusory double up to twice your speed and make it gesture, speak, and behave in whatever way you choose. You can see through its eyes and hear through its ears as if you were located where it is. On each of your turns as a bonus action, you can switch from using its senses to using your own, or back again. While you are using its senses, you are blinded and deafened in regard to your own surroundings."},{"n":"Misty Step","l":2,"s":"Conj","c":["sorcerer","warlock","wizard"],"t":"1 bonus action","g":"Self","u":"Instantaneous","m":"V","k":0,"r":0,"x":"Briefly surrounded by silvery mist, you teleport up to 30 feet to an unoccupied space that you can see."},{"n":"Modify Memory","l":5,"s":"Ench","c":["bard","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You attempt to reshape another creature's memories. One creature that you can see must make a wisdom saving throw. If you are fighting the creature, it has advantage on the saving throw. On a failed save, the target becomes charmed by you for the duration. The charmed target is incapacitated and unaware of its surroundings, though it can still hear you. If it takes any damage or is targeted by another spell, this spell ends, and none of the target's memories are modified. While this charm lasts, you can affect the target's memory of an event that it experienced within the last 24 hours and that lasted no more than 10 minutes. You can permanently eliminate all memory of the event,\u2026","h":"If you cast this spell using a spell slot of 6th level or higher, you can alter the target's memories of an event that took place up to 7 days ago (6th level), 30 days ago (7th level), 1 year ago (8th level), or any time in the creature's past (9th level).","v":"wis","hf":0},{"n":"Moonbeam","l":2,"s":"Evoc","c":["druid"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A silvery beam of pale light shines down in a 5-foot radius, 40-foot-high cylinder centered on a point within range. Until the spell ends, dim light fills the cylinder. When a creature enters the spell's area for the first time on a turn or starts its turn there, it is engulfed in ghostly flames that cause searing pain, and it must make a constitution saving throw. It takes 2d10 radiant damage on a failed save, or half as much damage on a successful one. A shapechanger makes its saving throw with disadvantage. If it fails, it also instantly reverts to its original form and can't assume a different form until it leaves the spell's light. On each of your turns after you cast this\u2026","h":"When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1dl0 for each slot level above 2nd.","v":"con","hf":1,"dt":"radiant","d":"2d10","up":"1d10"},{"n":"Move Earth","l":6,"s":"Tran","c":["druid","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 2 hours","m":"VSM","k":1,"r":0,"x":"Choose an area of terrain no larger than 40 feet on a side within range. You can reshape dirt, sand, or clay in the area in any manner you choose for the duration. You can raise or lower the area's elevation, create or fill in a trench, erect or flatten a wall, or form a pillar. The extent of any such changes can't exceed half the area's largest dimension. So, if you affect a 40-foot square, you can create a pillar up to 20 feet high, raise or lower the square's elevation by up to 20 feet, dig a trench up to 20 feet deep, and so on. It takes 10 minutes for these changes to complete. At the end of every 10 minutes you spend concentrating on the spell, you can choose a new area of\u2026"},{"n":"Nondetection","l":3,"s":"Abju","c":["bard","ranger","wizard"],"t":"1 action","g":"Touch","u":"8 hours","m":"VSM","k":0,"r":0,"x":"For the duration, you hide a target that you touch from divination magic. The target can be a willing creature or a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any divination magic or perceived through magical scrying sensors."},{"n":"Pass Without Trace","l":2,"s":"Abju","c":["druid","ranger"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"A veil of shadows and silence radiates from you, masking you and your companions from detection. For the duration, each creature you choose within 30 feet of you (including you) has a +10 bonus to Dexterity (Stealth) checks and can't be tracked except by magical means. A creature that receives this bonus leaves behind no tracks or other traces of its passage."},{"n":"Passwall","l":5,"s":"Tran","c":["wizard"],"t":"1 action","g":"30 feet","u":"1 hour","m":"VSM","k":0,"r":0,"x":"A passage appears at a point of your choice that you can see on a wooden, plaster, or stone surface (such as a wall, a ceiling, or a floor) within range, and lasts for the duration. You choose the opening's dimensions: up to 5 feet wide, 8 feet tall, and 20 feet deep. The passage creates no instability in a structure surrounding it. When the opening disappears, any creatures or objects still in the passage created by the spell are safely ejected to an unoccupied space nearest to the surface on which you cast the spell."},{"n":"Phantasmal Killer","l":4,"s":"Illu","c":["wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You tap into the nightmares of a creature you can see within range and create an illusory manifestation of its deepest fears, visible only to that creature. The target must make a wisdom saving throw. On a failed save, the target becomes frightened for the duration. At the start of each of the target's turns before the spell ends, the target must succeed on a wisdom saving throw or take 4d10 psychic damage. On a successful save, the spell ends.","h":"When you cast this spell using a spell slot of 5th level or higher, the damage increases by 1d10 for each slot level above 4th.","v":"wis","hf":0,"dt":"psychic","d":"4d10"},{"n":"Phantom Steed","l":3,"s":"Illu","c":["wizard"],"t":"1 minute","g":"30 feet","u":"1 hour","m":"VS","k":0,"r":1,"x":"A Large quasi-real, horselike creature appears on the ground in an unoccupied space of your choice within range. You decide the creature's appearance, but it is equipped with a saddle, bit, and bridle. Any of the equipment created by the spell vanishes in a puff of smoke if it is carried more than 10 feet away from the steed. For the duration, you or a creature you choose can ride the steed. The creature uses the statistics for a riding horse, except it has a speed of 100 feet and can travel 10 miles in an hour, or 13 miles at a fast pace. When the spell ends, the steed gradually fades, giving the rider 1 minute to dismount. The spell ends if you use an action to dismiss it or if\u2026"},{"n":"Planar Ally","l":6,"s":"Conj","c":["cleric"],"t":"10 minutes","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You beseech an otherworldly entity for aid. The being must be known to you: a god, a primordial, a demon prince, or some other being of cosmic power. That entity sends a celestial, an elemental, or a fiend loyal to it to aid you, making the creature appear in an unoccupied space within range. If you know a specific creature's name, you can speak that name when you cast this spell to request that creature, though you might get a different creature anyway (GM's choice). When the creature appears, it is under no compulsion to behave in any particular way. You can ask the creature to perform a service in exchange for payment, but it isn't obliged to do so. The requested task could\u2026"},{"n":"Planar Binding","l":5,"s":"Abju","c":["bard","cleric","druid","wizard"],"t":"1 hour","g":"60 feet","u":"24 hours","m":"VSM","k":0,"r":0,"x":"With this spell, you attempt to bind a celestial, an elemental, a fey, or a fiend to your service. The creature must be within range for the entire casting of the spell. (Typically, the creature is first summoned into the center of an inverted magic circle in order to keep it trapped while this spell is cast.) At the completion of the casting, the target must make a charisma saving throw. On a failed save, it is bound to serve you for the duration. If the creature was summoned or created by another spell, that spell's duration is extended to match the duration of this spell. A bound creature must follow your instructions to the best of its ability. You might command the creature\u2026","h":"When you cast this spell using a spell slot of a higher level, the duration increases to 10 days with a 6th-level slot, to 30 days with a 7th-level slot, to 180 days with an 8th-level slot, and to a year and a day with a 9th-level spell slot.","v":"cha","hf":0},{"n":"Plane Shift","l":7,"s":"Conj","c":["cleric","druid","sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You and up to eight willing creatures who link hands in a circle are transported to a different plane of existence. You can specify a target destination in general terms, such as the City of Brass on the Elemental Plane of Fire or the palace of Dispater on the second level of the Nine Hells, and you appear in or near that destination. If you are trying to reach the City of Brass, for example, you might arrive in its Street of Steel, before its Gate of Ashes, or looking at the city from across the Sea of Fire, at the GM's discretion. Alternatively, if you know the sigil sequence of a teleportation circle on another plane of existence, this spell can take you to that circle. If the\u2026","a":1,"v":"cha","hf":0},{"n":"Plant Growth","l":3,"s":"Tran","c":["bard","druid","ranger"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"This spell channels vitality into plants within a specific area. There are two possible uses for the spell, granting either immediate or long-term benefits. If you cast this spell using 1 action, choose a point within range. All normal plants in a 100-foot radius centered on that point become thick and overgrown. A creature moving through the area must spend 4 feet of movement for every 1 foot it moves. You can exclude one or more areas of any size within the spell's area from being affected. If you cast this spell over 8 hours, you enrich the land. All plants in a half-mile radius centered on a point within range become enriched for 1 year. The plants yield twice the normal\u2026"},{"n":"Poison Spray","l":0,"s":"Conj","c":["sorcerer","warlock","wizard","druid"],"t":"1 action","g":"10 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You extend your hand toward a creature you can see within range and project a puff of noxious gas from your palm. The creature must succeed on a constitution saving throw or take 1d12 poison damage. This spell's damage increases by 1d12 when you reach 5th level (2d12), 11th level (3d12), and 17th level (4d12).","v":"con","hf":0,"dt":"poison","d":"1d12","cs":1},{"n":"Polymorph","l":4,"s":"Tran","c":["bard","druid","sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"This spell transforms a creature that you can see within range into a new form. An unwilling creature must make a wisdom saving throw to avoid the effect. A shapechanger automatically succeeds on this saving throw. The transformation lasts for the duration, or until the target drops to 0 hit points or dies. The new form can be any beast whose challenge rating is equal to or less than the target's (or the target's level, if it doesn't have a challenge rating). The target's game statistics, including mental ability scores, are replaced by the statistics of the chosen beast. It retains its alignment and personality. The target assumes the hit points of its new form. When it reverts\u2026","v":"wis","hf":0},{"n":"Power Word Kill","l":9,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You utter a word of power that can compel one creature you can see within range to die instantly. If the creature you choose has 100 hit points or fewer, it dies. Otherwise, the spell has no effect."},{"n":"Power Word Stun","l":8,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You speak a word of power that can overwhelm the mind of one creature you can see within range, leaving it dumbfounded. If the target has 150 hit points or fewer, it is stunned. Otherwise, the spell has no effect. The stunned target must make a constitution saving throw at the end of each of its turns. On a successful save, this stunning effect ends."},{"n":"Prayer of Healing","l":2,"s":"Evoc","c":["cleric"],"t":"10 minutes","g":"30 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"Up to six creatures of your choice that you can see within range each regain hit points equal to 2d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","h":"When you cast this spell using a spell slot of 3rd level or higher, the healing increases by 1d8 for each slot level above 2nd.","dt":"healing","am":1,"d":"2d8","up":"1d8"},{"n":"Prestidigitation","l":0,"s":"Tran","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"10 feet","u":"1 hour","m":"VS","k":0,"r":0,"x":"This spell is a minor magical trick that novice spellcasters use for practice. You create one of the following magical effects within 'range': You create an instantaneous, harmless sensory effect, such as a shower of sparks, a puff of wind, faint musical notes, or an odd odor. You instantaneously light or snuff out a candle, a torch, or a small campfire. You instantaneously clean or soil an object no larger than 1 cubic foot. You chill, warm, or flavor up to 1 cubic foot of nonliving material for 1 hour. You make a color, a small mark, or a symbol appear on an object or a surface for 1 hour. You create a nonmagical trinket or an illusory image that can fit in your hand and that\u2026"},{"n":"Prismatic Spray","l":7,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Eight multicolored rays of light flash from your hand. Each ray is a different color and has a different power and purpose. Each creature in a 60-foot cone must make a dexterity saving throw. For each target, roll a d8 to determine which color ray affects it. ***1. Red.*** The target takes 10d6 fire damage on a failed save, or half as much damage on a successful one. ***2. Orange.*** The target takes 10d6 acid damage on a failed save, or half as much damage on a successful one. ***3. Yellow.*** The target takes 10d6 lightning damage on a failed save, or half as much damage on a successful one. ***4. Green.*** The target takes 10d6 poison damage on a failed save, or half as much\u2026","v":"dex","hf":0,"d":"10d6"},{"n":"Prismatic Wall","l":9,"s":"Abju","c":["wizard"],"t":"1 action","g":"60 feet","u":"10 minutes","m":"VS","k":0,"r":0,"x":"A shimmering, multicolored plane of light forms a vertical opaque wall--up to 90 feet long, 30 feet high, and 1 inch thick--centered on a point you can see within range. Alternatively, you can shape the wall into a sphere up to 30 feet in diameter centered on a point you choose within range. The wall remains in place for the duration. If you position the wall so that it passes through a space occupied by a creature, the spell fails, and your action and the spell slot are wasted. The wall sheds bright light out to a range of 100 feet and dim light for an additional 100 feet. You and creatures you designate at the time you cast the spell can pass through and remain near the wall\u2026"},{"n":"Private Sanctum","l":4,"s":"Abju","c":["wizard"],"t":"10 minutes","g":"120 feet","u":"24 hours","m":"VSM","k":0,"r":0,"x":"You make an area within range magically secure. The area is a cube that can be as small as 5 feet to as large as 100 feet on each side. The spell lasts for the duration or until you use an action to dismiss it. When you cast the spell, you decide what sort of security the spell provides, choosing any or all of the following properties: - Sound can't pass through the barrier at the edge of the warded area. - The barrier of the warded area appears dark and foggy, preventing vision (including darkvision) through it. - Sensors created by divination spells can't appear inside the protected area or pass through the barrier at its perimeter. - Creatures in the area can't be targeted by\u2026","h":"When you cast this spell using a spell slot of 5th level or higher, you can increase the size of the cube by 100 feet for each slot level beyond 4th. Thus you could protect a cube that can be up to 200 feet on one side by using a spell slot of 5th level."},{"n":"Produce Flame","l":0,"s":"Conj","c":["druid"],"t":"1 action","g":"Self","u":"10 minutes","m":"VS","k":0,"r":0,"x":"A flickering flame appears in your hand. The flame remains there for the duration and harms neither you nor your equipment. The flame sheds bright light in a 10-foot radius and dim light for an additional 10 feet. The spell ends if you dismiss it as an action or if you cast it again. You can also attack with the flame, although doing so ends the spell. When you cast this spell, or as an action on a later turn, you can hurl the flame at a creature within 30 feet of you. Make a ranged spell attack. On a hit, the target takes 1d8 fire damage. This spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","a":1,"dt":"fire","d":"1d8","cs":1},{"n":"Programmed Illusion","l":6,"s":"Illu","c":["bard","wizard"],"t":"1 action","g":"120 feet","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"You create an illusion of an object, a creature, or some other visible phenomenon within range that activates when a specific condition occurs. The illusion is imperceptible until then. It must be no larger than a 30-foot cube, and you decide when you cast the spell how the illusion behaves and what sounds it makes. This scripted performance can last up to 5 minutes. When the condition you specify occurs, the illusion springs into existence and performs in the manner you described. Once the illusion finishes performing, it disappears and remains dormant for 10 minutes. After this time, the illusion can be activated again. The triggering condition can be as general or as detailed\u2026"},{"n":"Project Image","l":7,"s":"Illu","c":["bard","wizard"],"t":"1 action","g":"500 miles","u":"Up to 24 hours","m":"VSM","k":1,"r":0,"x":"You create an illusory copy of yourself that lasts for the duration. The copy can appear at any location within range that you have seen before, regardless of intervening obstacles. The illusion looks and sounds like you but is intangible. If the illusion takes any damage, it disappears, and the spell ends. You can use your action to move this illusion up to twice your speed, and make it gesture, speak, and behave in whatever way you choose. It mimics your mannerisms perfectly. You can see through its eyes and hear through its ears as if you were in its space. On your turn as a bonus action, you can switch from using its senses to using your own, or back again. While you are using\u2026"},{"n":"Protection From Energy","l":3,"s":"Abju","c":["cleric","druid","ranger","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"For the duration, the willing creature you touch has resistance to one damage type of your choice: acid, cold, fire, lightning, or thunder."},{"n":"Protection from Evil and Good","l":1,"s":"Abju","c":["cleric","paladin","warlock","wizard"],"t":"1 action","g":"Touch","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"Until the spell ends, one willing creature you touch is protected against certain types of creatures: aberrations, celestials, elementals, fey, fiends, and undead. The protection grants several benefits. Creatures of those types have disadvantage on attack rolls against the target. The target also can't be charmed, frightened, or possessed by them. If the target is already charmed, frightened, or possessed by such a creature, the target has advantage on any new saving throw against the relevant effect."},{"n":"Protection from Poison","l":2,"s":"Abju","c":["cleric","druid","paladin","ranger"],"t":"1 action","g":"Touch","u":"1 hour","m":"VS","k":0,"r":0,"x":"You touch a creature. If it is poisoned, you neutralize the poison. If more than one poison afflicts the target, you neutralize one poison that you know is present, or you neutralize one at random. For the duration, the target has advantage on saving throws against being poisoned, and it has resistance to poison damage."},{"n":"Purify Food and Drink","l":1,"s":"Tran","c":["cleric","druid","paladin"],"t":"1 action","g":"10 feet","u":"Instantaneous","m":"VS","k":0,"r":1,"x":"All nonmagical food and drink within a 5-foot radius sphere centered on a point of your choice within range is purified and rendered free of poison and disease."},{"n":"Raise Dead","l":5,"s":"Necr","c":["bard","cleric","paladin"],"t":"1 hour","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You return a dead creature you touch to life, provided that it has been dead no longer than 10 days. If the creature's soul is both willing and at liberty to rejoin the body, the creature returns to life with 1 hit point. This spell also neutralizes any poisons and cures nonmagical diseases that affected the creature at the time it died. This spell doesn't, however, remove magical diseases, curses, or similar effects; if these aren't first removed prior to casting the spell, they take effect when the creature returns to life. The spell can't return an undead creature to life. This spell closes all mortal wounds, but it doesn't restore missing body parts. If the creature is lacking\u2026"},{"n":"Ray of Enfeeblement","l":2,"s":"Necr","c":["warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"A black beam of enervating energy springs from your finger toward a creature within range. Make a ranged spell attack against the target. On a hit, the target deals only half damage with weapon attacks that use Strength until the spell ends. At the end of each of the target's turns, it can make a constitution saving throw against the spell. On a success, the spell ends.","a":1,"v":"con","hf":0},{"n":"Ray of Frost","l":0,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A frigid beam of blue-white light streaks toward a creature within range. Make a ranged spell attack against the target. On a hit, it takes 1d8 cold damage, and its speed is reduced by 10 feet until the start of your next turn. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","a":1,"dt":"cold","d":"1d8","cs":1},{"n":"Regenerate","l":7,"s":"Tran","c":["bard","cleric","druid"],"t":"1 minute","g":"Touch","u":"1 hour","m":"VSM","k":0,"r":0,"x":"You touch a creature and stimulate its natural healing ability. The target regains 4d8 + 15 hit points. For the duration of the spell, the target regains 1 hit point at the start of each of its turns (10 hit points each minute). The target's severed body members (fingers, legs, tails, and so on), if any, are restored after 2 minutes. If you have the severed part and hold it to the stump, the spell instantaneously causes the limb to knit to the stump.","dt":"healing","d":"4d8+15"},{"n":"Reincarnate","l":5,"s":"Tran","c":["druid"],"t":"1 hour","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You touch a dead humanoid or a piece of a dead humanoid. Provided that the creature has been dead no longer than 10 days, the spell forms a new adult body for it and then calls the soul to enter that body. If the target's soul isn't free or willing to do so, the spell fails. The magic fashions a new body for the creature to inhabit, which likely causes the creature's race to change. The GM rolls a d 100 and consults the following table to determine what form the creature takes when restored to life, or the GM chooses a form. | d100 | Race | |---|---| | 01-04 | Dragonborn | | 05-13 | Dwarf, hill | | 14-21 | Dwarf, mountain | | 22-25 | Elf, dark | | 26-34 | Elf, high | | 35-42 |\u2026"},{"n":"Remove Curse","l":3,"s":"Abju","c":["cleric","paladin","warlock","wizard"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's attunement to the object so it can be removed or discarded."},{"n":"Resilient Sphere","l":4,"s":"Evoc","c":["wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A sphere of shimmering force encloses a creature or object of Large size or smaller within range. An unwilling creature must make a dexterity saving throw. On a failed save, the creature is enclosed for the duration. Nothing--not physical objects, energy, or other spell effects--can pass through the barrier, in or out, though a creature in the sphere can breathe there. The sphere is immune to all damage, and a creature or object inside can't be damaged by attacks or effects originating from outside, nor can a creature inside the sphere damage anything outside it. The sphere is weightless and just large enough to contain the creature or object inside. An enclosed creature can use\u2026","v":"dex","hf":0},{"n":"Resistance","l":0,"s":"Abju","c":["cleric","druid"],"t":"1 action","g":"Touch","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You touch one willing creature. Once before the spell ends, the target can roll a d4 and add the number rolled to one saving throw of its choice. It can roll the die before or after making the saving throw. The spell then ends."},{"n":"Resurrection","l":7,"s":"Necr","c":["bard","cleric"],"t":"1 hour","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You touch a dead creature that has been dead for no more than a century, that didn't die of old age, and that isn't undead. If its soul is free and willing, the target returns to life with all its hit points. This spell neutralizes any poisons and cures normal diseases afflicting the creature when it died. It doesn't, however, remove magical diseases, curses, and the like; if such effects aren't removed prior to casting the spell, they afflict the target on its return to life. This spell closes all mortal wounds and restores any missing body parts. Coming back from the dead is an ordeal. The target takes a -4 penalty to all attack rolls, saving throws, and ability checks. Every\u2026"},{"n":"Reverse Gravity","l":7,"s":"Tran","c":["druid","sorcerer","wizard"],"t":"1 action","g":"100 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"This spell reverses gravity in a 50-foot-radius, 100-foot high cylinder centered on a point within range. All creatures and objects that aren't somehow anchored to the ground in the area fall upward and reach the top of the area when you cast this spell. A creature can make a dexterity saving throw to grab onto a fixed object it can reach, thus avoiding the fall. If some solid object (such as a ceiling) is encountered in this fall, falling objects and creatures strike it just as they would during a normal downward fall. If an object or creature reaches the top of the area without striking anything, it remains there, oscillating slightly, for the duration. At the end of the\u2026","v":"dex","hf":0},{"n":"Revivify","l":3,"s":"Conj","c":["cleric","paladin"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You touch a creature that has died within the last minute. That creature returns to life with 1 hit point. This spell can't return to life a creature that has died of old age, nor can it restore any missing body parts."},{"n":"Rope Trick","l":2,"s":"Tran","c":["wizard"],"t":"1 action","g":"Touch","u":"1 hour","m":"VSM","k":0,"r":0,"x":"You touch a length of rope that is up to 60 feet long. One end of the rope then rises into the air until the whole rope hangs perpendicular to the ground. At the upper end of the rope, an invisible entrance opens to an extradimensional space that lasts until the spell ends. The extradimensional space can be reached by climbing to the top of the rope. The space can hold as many as eight Medium or smaller creatures. The rope can be pulled into the space, making the rope disappear from view outside the space. Attacks and spells can't cross through the entrance into or out of the extradimensional space, but those inside can see out of it as if through a 3-foot-by-5-foot window\u2026"},{"n":"Sacred Flame","l":0,"s":"Evoc","c":["cleric"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Flame-like radiance descends on a creature that you can see within range. The target must succeed on a dexterity saving throw or take 1d8 radiant damage. The target gains no benefit from cover for this saving throw. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","v":"dex","hf":0,"dt":"radiant","d":"1d8","cs":1},{"n":"Sanctuary","l":1,"s":"Abju","c":["cleric"],"t":"1 bonus action","g":"30 feet","u":"1 minute","m":"VSM","k":0,"r":0,"x":"You ward a creature within range against attack. Until the spell ends, any creature who targets the warded creature with an attack or a harmful spell must first make a wisdom saving throw. On a failed save, the creature must choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from area effects, such as the explosion of a fireball. If the warded creature makes an attack or casts a spell that affects an enemy creature, this spell ends."},{"n":"Scorching Ray","l":2,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You create three rays of fire and hurl them at targets within range. You can hurl them at one target or several. Make a ranged spell attack for each ray. On a hit, the target takes 2d6 fire damage.","h":"When you cast this spell using a spell slot of 3rd level or higher, you create one additional ray for each slot level above 2nd.","dt":"fire","d":"2d6"},{"n":"Scrying","l":5,"s":"Divi","c":["bard","cleric","druid","warlock","wizard"],"t":"10 minutes","g":"Self","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You can see and hear a particular creature you choose that is on the same plane of existence as you. The target must make a wisdom saving throw, which is modified by how well you know the target and the sort of physical connection you have to it. If a target knows you're casting this spell, it can fail the saving throw voluntarily if it wants to be observed. | Knowledge | Save Modifier | |---|---| | Secondhand (you have heard of the target) | +5 | | Firsthand (you have met the target) | +0 | | Familiar (you know the target well) | -5 |  | Connection | Save Modifier | |---|---| | Likeness or picture | -2 | | Possession or garment | -4 | | Body part, lock of hair, bit of nail, or\u2026","v":"wis","hf":0},{"n":"Secret Chest","l":4,"s":"Conj","c":["wizard"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You hide a chest, and all its contents, on the Ethereal Plane. You must touch the chest and the miniature replica that serves as a material component for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet). While the chest remains on the Ethereal Plane, you can use an action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by using an action and touching both the chest and the replica. After 60 days, there is a cumulative 5 percent chance per day that the spell's effect ends. This effect ends if you cast this spell\u2026"},{"n":"See Invisibility","l":2,"s":"Divi","c":["bard","sorcerer","wizard"],"t":"1 action","g":"Self","u":"1 hour","m":"VSM","k":0,"r":0,"x":"For the duration of the spell, you see invisible creatures and objects as if they were visible, and you can see through Ethereal. The ethereal objects and creatures appear ghostly translucent."},{"n":"Seeming","l":5,"s":"Illu","c":["bard","sorcerer","wizard"],"t":"1 action","g":"30 feet","u":"8 hours","m":"VS","k":0,"r":0,"x":"This spell allows you to change the appearance of any number of creatures that you can see within range. You give each target you choose a new, illusory appearance. An unwilling target can make a charisma saving throw, and if it succeeds, it is unaffected by this spell. The spell disguises physical appearance as well as clothing, armor, weapons, and equipment. You can make each creature seem 1 foot shorter or taller and appear thin, fat, or in between. You can't change a target's body type, so you must choose a form that has the same basic arrangement of limbs. Otherwise, the extent of the illusion is up to you. The spell lasts for the duration, unless you use your action to\u2026"},{"n":"Sending","l":3,"s":"Evoc","c":["bard","cleric","wizard"],"t":"1 action","g":"Unlimited","u":"1 round","m":"VSM","k":0,"r":0,"x":"You send a short message of twenty-five words or less to a creature with which you are familiar. The creature hears the message in its mind, recognizes you as the sender if it knows you, and can answer in a like manner immediately. The spell enables creatures with Intelligence scores of at least 1 to understand the meaning of your message. You can send the message across any distance and even to other planes of existence, but if the target is on a different plane than you, there is a 5 percent chance that the message doesn't arrive."},{"n":"Sequester","l":7,"s":"Tran","c":["wizard"],"t":"1 action","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"By means of this spell, a willing creature or an object can be hidden away, safe from detection for the duration. When you cast the spell and touch the target, it becomes invisible and can't be targeted by divination spells or perceived through scrying sensors created by divination spells. If the target is a creature, it falls into a state of suspended animation. Time ceases to flow for it, and it doesn't grow older. You can set a condition for the spell to end early. The condition can be anything you choose, but it must occur or be visible within 1 mile of the target. Examples include \"after 1,000 years\" or \"when the tarrasque awakens.\" This spell also ends if the target takes any damage."},{"n":"Shapechange","l":9,"s":"Tran","c":["druid","wizard"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You assume the form of a different creature for the duration. The new form can be of any creature with a challenge rating equal to your level or lower. The creature can't be a construct or an undead, and you must have seen the sort of creature at least once. You transform into an average example of that creature, one without any class levels or the Spellcasting trait. Your game statistics are replaced by the statistics of the chosen creature, though you retain your alignment and Intelligence, Wisdom, and Charisma scores. You also retain all of your skill and saving throw proficiencies, in addition to gaining those of the creature. If the creature has the same proficiency as you\u2026"},{"n":"Shatter","l":2,"s":"Evoc","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A sudden loud ringing noise, painfully intense, erupts from a point of your choice within range. Each creature in a 10-foot-radius sphere centered on that point must make a Constitution saving throw. A creature takes 3d8 thunder damage on a failed save, or half as much damage on a successful one. A creature made of inorganic material such as stone, crystal, or metal has disadvantage on this saving throw. A non-magical item that is not worn or carried also suffers damage if it is in the area of the spell.","h":"When you cast this spell using a 3 or higher level spell slot, the damage of the spell increases by 1d8 for each level of higher spell slot 2.","v":"con","hf":1,"dt":"thunder","d":"3d8","up":"1d8"},{"n":"Shield","l":1,"s":"Abju","c":["sorcerer","wizard"],"t":"1 reaction","g":"Self","u":"1 round","m":"VS","k":0,"r":0,"x":"An invisible barrier of magical force appears and protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from magic missile."},{"n":"Shield of Faith","l":1,"s":"Abju","c":["cleric","paladin"],"t":"1 bonus action","g":"60 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"A shimmering field appears and surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration."},{"n":"Shillelagh","l":0,"s":"Tran","c":["druid"],"t":"1 bonus action","g":"Touch","u":"1 minute","m":"VSM","k":0,"r":0,"x":"The wood of a club or a quarterstaff you are holding is imbued with nature's power. For the duration, you can use your spellcasting ability instead of Strength for the attack and damage rolls of melee attacks using that weapon, and the weapon's damage die becomes a d8. The weapon also becomes magical, if it isn't already. The spell ends if you cast it again or if you let go of the weapon."},{"n":"Shocking Grasp","l":0,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Lightning springs from your hand to deliver a shock to a creature you try to touch. Make a melee spell attack against the target. You have advantage on the attack roll if the target is wearing armor made of metal. On a hit, the target takes 1d8 lightning damage, and it can't take reactions until the start of its next turn. The spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","a":1,"dt":"lightning","d":"1d8","cs":1},{"n":"Silence","l":2,"s":"Illu","c":["bard","cleric","ranger"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":1,"x":"For the duration, no sound can be created within or pass through a 20-foot-radius sphere centered on a point you choose within range. Any creature or object entirely inside the sphere is immune to thunder damage, and creatures are deafened while entirely inside it. Casting a spell that includes a verbal component is impossible there."},{"n":"Silent Image","l":1,"s":"Illu","c":["bard","sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You create the image of an object, a creature, or some other visible phenomenon that is no larger than a 15-foot cube. The image appears at a spot within range and lasts for the duration. The image is purely visual; it isn't accompanied by sound, smell, or other sensory effects. You can use your action to cause the image to move to any spot within range. As the image changes location, you can alter its appearance so that its movements appear natural for the image. For example, if you create an image of a creature and move it, you can alter the image so that it appears to be walking. Physical interaction with the image reveals it to be an illusion, because things can pass through\u2026"},{"n":"Simulacrum","l":7,"s":"Illu","c":["wizard"],"t":"12 hours","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"You shape an illusory duplicate of one beast or humanoid that is within range for the entire casting time of the spell. The duplicate is a creature, partially real and formed from ice or snow, and it can take actions and otherwise be affected as a normal creature. It appears to be the same as the original, but it has half the creature's hit point maximum and is formed without any equipment. Otherwise, the illusion uses all the statistics of the creature it duplicates. The simulacrum is friendly to you and creatures you designate. It obeys your spoken commands, moving and acting in accordance with your wishes and acting on your turn in combat. The simulacrum lacks the ability to\u2026"},{"n":"Sleep","l":1,"s":"Ench","c":["bard","sorcerer","wizard"],"t":"1 action","g":"90 feet","u":"1 minute","m":"VSM","k":0,"r":0,"x":"This spell sends creatures into a magical slumber. Roll 5d8; the total is how many hit points of creatures this spell can affect. Creatures within 20 feet of a point you choose within range are affected in ascending order of their current hit points (ignoring unconscious creatures). Starting with the creature that has the lowest current hit points, each creature affected by this spell falls unconscious until the spell ends, the sleeper takes damage, or someone uses an action to shake or slap the sleeper awake. Subtract each creature's hit points from the total before moving on to the creature with the next lowest hit points. A creature's hit points must be equal to or less than\u2026","h":"When you cast this spell using a spell slot of 2nd level or higher, roll an additional 2d8 for each slot level above 1st.","d":"5d8"},{"n":"Sleet Storm","l":3,"s":"Conj","c":["druid","sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Until the spell ends, freezing rain and sleet fall in a 20-foot-tall cylinder with a 40-foot radius centered on a point you choose within range. The area is heavily obscured, and exposed flames in the area are doused. The ground in the area is covered with slick ice, making it difficult terrain. When a creature enters the spell's area for the first time on a turn or starts its turn there, it must make a dexterity saving throw. On a failed save, it falls prone. If a creature is concentrating in the spell's area, the creature must make a successful constitution saving throw against your spell save DC or lose concentration."},{"n":"Slow","l":3,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You alter time around up to six creatures of your choice in a 40-foot cube within range. Each target must succeed on a wisdom saving throw or be affected by this spell for the duration. An affected target's speed is halved, it takes a -2 penalty to AC and dexterity saving throws, and it can't use reactions. On its turn, it can use either an action or a bonus action, not both. Regardless of the creature's abilities or magic items, it can't make more than one melee or ranged attack during its turn. If the creature attempts to cast a spell with a casting time of 1 action, roll a d20. On an 11 or higher, the spell doesn't take effect until the creature's next turn, and the creature\u2026","v":"wis","hf":0},{"n":"Spare the Dying","l":0,"s":"Necr","c":["cleric"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You touch a living creature that has 0 hit points. The creature becomes stable. This spell has no effect on undead or constructs."},{"n":"Speak with Animals","l":1,"s":"Divi","c":["bard","druid","ranger"],"t":"1 action","g":"Self","u":"10 minutes","m":"VS","k":0,"r":1,"x":"You gain the ability to comprehend and verbally communicate with beasts for the duration. The knowledge and awareness of many beasts is limited by their intelligence, but at a minimum, beasts can give you information about nearby locations and monsters, including whatever they can perceive or have perceived within the past day. You might be able to persuade a beast to perform a small favor for you, at the GM's discretion."},{"n":"Speak with Dead","l":3,"s":"Necr","c":["bard","cleric"],"t":"1 action","g":"10 feet","u":"10 minutes","m":"VSM","k":0,"r":0,"x":"You grant the semblance of life and intelligence to a corpse of your choice within range, allowing it to answer the questions you pose. The corpse must still have a mouth and can't be undead. The spell fails if the corpse was the target of this spell within the last 10 days. Until the spell ends, you can ask the corpse up to five questions. The corpse knows only what it knew in life, including the languages it knew. Answers are usually brief, cryptic, or repetitive, and the corpse is under no compulsion to offer a truthful answer if you are hostile to it or it recognizes you as an enemy. This spell doesn't return the creature's soul to its body, only its animating spirit. Thus,\u2026"},{"n":"Speak with Plants","l":3,"s":"Tran","c":["bard","druid","ranger"],"t":"1 action","g":"Self","u":"10 minutes","m":"VS","k":0,"r":0,"x":"You imbue plants within 30 feet of you with limited sentience and animation, giving them the ability to communicate with you and follow your simple commands. You can question plants about events in the spell's area within the past day, gaining information about creatures that have passed, weather, and other circumstances. You can also turn difficult terrain caused by plant growth (such as thickets and undergrowth) into ordinary terrain that lasts for the duration. Or you can turn ordinary terrain where plants are present into difficult terrain that lasts for the duration, causing vines and branches to hinder pursuers, for example. Plants might be able to perform other tasks on\u2026"},{"n":"Spider Climb","l":2,"s":"Tran","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"Until the spell ends, one willing creature you touch gains the ability to move up, down, and across vertical surfaces and upside down along ceilings, while leaving its hands free. The target also gains a climbing speed equal to its walking speed."},{"n":"Spike Growth","l":2,"s":"Tran","c":["druid","ranger"],"t":"1 action","g":"150 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"The ground in a 20-foot radius centered on a point within range twists and sprouts hard spikes and thorns. The area becomes difficult terrain for the duration. When a creature moves into or within the area, it takes 2d4 piercing damage for every 5 feet it travels. The transformation of the ground is camouflaged to look natural. Any creature that can't see the area at the time the spell is cast can make a Wisdom (Perception) check against your spell save DC to recognize the terrain as hazardous before entering it."},{"n":"Spirit Guardians","l":3,"s":"Conj","c":["cleric"],"t":"1 action","g":"Self","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You call forth spirits to protect you. They flit around you to a distance of 15 feet for the duration. If you are good or neutral, their spectral form appears angelic or fey (your choice). If you are evil, they appear fiendish. When you cast this spell, you can designate any number of creatures you can see to be unaffected by it. An affected creature's speed is halved in the area, and when the creature enters the area for the first time on a turn or starts its turn there, it must make a wisdom saving throw. On a failed save, the creature takes 3d8 radiant damage (if you are good or neutral) or 3d8 necrotic damage (if you are evil). On a successful save, the creature takes half as\u2026","h":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d8 for each slot level above 3rd."},{"n":"Spiritual Weapon","l":2,"s":"Evoc","c":["cleric"],"t":"1 bonus action","g":"60 feet","u":"1 minute","m":"VS","k":0,"r":0,"x":"You create a floating, spectral weapon within range that lasts for the duration or until you cast this spell again. When you cast the spell, you can make a melee spell attack against a creature within 5 feet of the weapon. On a hit, the target takes force damage equal to 1d8 + your spellcasting ability modifier. As a bonus action on your turn, you can move the weapon up to 20 feet and repeat the attack against a creature within 5 feet of it. The weapon can take whatever form you choose. Clerics of deities who are associated with a particular weapon (as St. Cuthbert is known for his mace and Thor for his hammer) make this spell's effect resemble that weapon.","h":"When you cast this spell using a spell slot of 3rd level or higher, the damage increases by 1d8 for every two slot levels above the 2nd.","a":1,"dt":"force","d":"1d8 + MOD"},{"n":"Stinking Cloud","l":3,"s":"Conj","c":["bard","sorcerer","wizard"],"t":"1 action","g":"90 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create a 20-foot-radius sphere of yellow, nauseating gas centered on a point within range. The cloud spreads around corners, and its area is heavily obscured. The cloud lingers in the air for the duration. Each creature that is completely within the cloud at the start of its turn must make a constitution saving throw against poison. On a failed save, the creature spends its action that turn retching and reeling. Creatures that don't need to breathe or are immune to poison automatically succeed on this saving throw. A moderate wind (at least 10 miles per hour) disperses the cloud after 4 rounds. A strong wind (at least 20 miles per hour) disperses it after 1 round.","v":"con","hf":0},{"n":"Stone Shape","l":4,"s":"Tran","c":["cleric","druid","wizard"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You touch a stone object of Medium size or smaller or a section of stone no more than 5 feet in any dimension and form it into any shape that suits your purpose. So, for example, you could shape a large rock into a weapon, idol, or coffer, or make a small passage through a wall, as long as the wall is less than 5 feet thick. You could also shape a stone door or its frame to seal the door shut. The object you create can have up to two hinges and a latch, but finer mechanical detail isn't possible."},{"n":"Stoneskin","l":4,"s":"Abju","c":["druid","ranger","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"This spell turns the flesh of a willing creature you touch as hard as stone. Until the spell ends, the target has resistance to nonmagical bludgeoning, piercing, and slashing damage."},{"n":"Storm of Vengeance","l":9,"s":"Conj","c":["druid"],"t":"1 action","g":"Sight","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"A churning storm cloud forms, centered on a point you can see and spreading to a radius of 360 feet. Lightning flashes in the area, thunder booms, and strong winds roar. Each creature under the cloud (no more than 5,000 feet beneath the cloud) when it appears must make a constitution saving throw. On a failed save, a creature takes 2d6 thunder damage and becomes deafened for 5 minutes. Each round you maintain concentration on this spell, the storm produces additional effects on your turn. ***Round 2.*** Acidic rain falls from the cloud. Each creature and object under the cloud takes 1d6 acid damage. ***Round 3.*** You call six bolts of lightning from the cloud to strike six\u2026","v":"con","hf":0,"dt":"thunder","d":"2d6"},{"n":"Suggestion","l":2,"s":"Ench","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"Up to 8 hours","m":"VM","k":1,"r":0,"x":"You suggest a course of activity (limited to a sentence or two) and magically influence a creature you can see within range that can hear and understand you. Creatures that can't be charmed are immune to this effect. The suggestion must be worded in such a manner as to make the course of action sound reasonable. Asking the creature to stab itself, throw itself onto a spear, immolate itself, or do some other obviously harmful act ends the spell. The target must make a wisdom saving throw. On a failed save, it pursues the course of action you described to the best of its ability. The suggested course of action can continue for the entire duration. If the suggested activity can be\u2026","v":"wis","hf":0},{"n":"Sunbeam","l":6,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A beam of brilliant light flashes out from your hand in a 5-foot-wide, 60-foot-long line. Each creature in the line must make a constitution saving throw. On a failed save, a creature takes 6d8 radiant damage and is blinded until your next turn. On a successful save, it takes half as much damage and isn't blinded by this spell. Undead and oozes have disadvantage on this saving throw. You can create a new line of radiance as your action on any turn until the spell ends. For the duration, a mote of brilliant radiance shines in your hand. It sheds bright light in a 30-foot radius and dim light for an additional 30 feet. This light is sunlight.","v":"con","hf":1,"dt":"radiant","d":"6d8"},{"n":"Sunburst","l":8,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"Brilliant sunlight flashes in a 60-foot radius centered on a point you choose within range. Each creature in that light must make a constitution saving throw. On a failed save, a creature takes 12d6 radiant damage and is blinded for 1 minute. On a successful save, it takes half as much damage and isn't blinded by this spell. Undead and oozes have disadvantage on this saving throw. A creature blinded by this spell makes another constitution saving throw at the end of each of its turns. On a successful save, it is no longer blinded. This spell dispels any darkness in its area that was created by a spell.","v":"con","hf":1,"dt":"radiant","d":"12d6"},{"n":"Symbol","l":7,"s":"Abju","c":["bard","cleric","wizard"],"t":"1 minute","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"When you cast this spell, you inscribe a harmful glyph either on a surface (such as a section of floor, a wall, or a table) or within an object that can be closed to conceal the glyph (such as a book, a scroll, or a treasure chest). If you choose a surface, the glyph can cover an area of the surface no larger than 10 feet in diameter. If you choose an object, that object must remain in its place; if the object is moved more than 10 feet from where you cast this spell, the glyph is broken, and the spell ends without being triggered. The glyph is nearly invisible, requiring an Intelligence (Investigation) check against your spell save DC to find it. You decide what triggers the\u2026"},{"n":"Telekinesis","l":5,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"You gain the ability to move or manipulate creatures or objects by thought. When you cast the spell, and as your action each round for the duration, you can exert your will on one creature or object that you can see within range, causing the appropriate effect below. You can affect the same target round after round, or choose a new one at any time. If you switch targets, the prior target is no longer affected by the spell. ***Creature.*** You can try to move a Huge or smaller creature. Make an ability check with your spellcasting ability contested by the creature's Strength check. If you win the contest, you move the creature up to 30 feet in any direction, including upward but\u2026"},{"n":"Telepathic Bond","l":5,"s":"Divi","c":["wizard"],"t":"1 action","g":"30 feet","u":"1 hour","m":"VSM","k":0,"r":1,"x":"You forge a telepathic link among up to eight willing creatures of your choice within range, psychically linking each creature to all the others for the duration. Creatures with Intelligence scores of 2 or less aren't affected by this spell. Until the spell ends, the targets can communicate telepathically through the bond whether or not they have a common language. The communication is possible over any distance, though it can't extend to other planes of existence."},{"n":"Teleport","l":7,"s":"Conj","c":["bard","sorcerer","wizard"],"t":"1 action","g":"10 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"This spell instantly transports you and up to eight willing creatures of your choice that you can see within range, or a single object that you can see within range, to a destination you select. If you target an object, it must be able to fit entirely inside a 10-foot cube, and it can't be held or carried by an unwilling creature. The destination you choose must be known to you, and it must be on the same plane of existence as you. Your familiarity with the destination determines whether you arrive there successfully. The GM rolls d100 and consults the table. | Familiarity | Mishap | Similar Area | Off Target | On Target | |---|---|---|---|---| | Permanent circle | -- | -- | -- |\u2026"},{"n":"Teleportation Circle","l":5,"s":"Conj","c":["bard","sorcerer","wizard"],"t":"1 minute","g":"10 feet","u":"1 round","m":"VM","k":0,"r":0,"x":"As you cast the spell, you draw a 10-foot-diameter circle on the ground inscribed with sigils that link your location to a permanent teleportation circle of your choice whose sigil sequence you know and that is on the same plane of existence as you. A shimmering portal opens within the circle you drew and remains open until the end of your next turn. Any creature that enters the portal instantly appears within 5 feet of the destination circle or in the nearest unoccupied space if that space is occupied. Many major temples, guilds, and other important places have permanent teleportation circles inscribed somewhere within their confines. Each such circle includes a unique sigil\u2026"},{"n":"Thaumaturgy","l":0,"s":"Tran","c":["cleric"],"t":"1 action","g":"30 feet","u":"1 minute","m":"V","k":0,"r":0,"x":"You manifest a minor wonder, a sign of supernatural power, within range. You create one of the following magical effects within range. - Your voice booms up to three times as loud as normal for 1 minute. - You cause flames to flicker, brighten, dim, or change color for 1 minute. - You cause harmless tremors in the ground for 1 minute. - You create an instantaneous sound that originates from a point of your choice within range, such as a rumble of thunder, the cry of a raven, or ominous whispers. - You instantaneously cause an unlocked door or window to fly open or slam shut. - You alter the appearance of your eyes for 1 minute. If you cast this spell multiple times, you can have\u2026"},{"n":"Thunderwave","l":1,"s":"Evoc","c":["bard","druid","sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A wave of thunderous force sweeps out from you. Each creature in a 15-foot cube originating from you must make a constitution saving throw. On a failed save, a creature takes 2d8 thunder damage and is pushed 10 feet away from you. On a successful save, the creature takes half as much damage and isn't pushed. In addition, unsecured objects that are completely within the area of effect are automatically pushed 10 feet away from you by the spell's effect, and the spell emits a thunderous boom audible out to 300 feet.","h":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d8 for each slot level above 1st.","v":"con","hf":1,"dt":"thunder","d":"2d8","up":"1d8"},{"n":"Time Stop","l":9,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You briefly stop the flow of time for everyone but yourself. No time passes for other creatures, while you take 1d4 + 1 turns in a row, during which you can use actions and move as normal. This spell ends if one of the actions you use during this period, or any effects that you create during this period, affects a creature other than you or an object being worn or carried by someone other than you. In addition, the spell ends if you move to a place more than 1,000 feet from the location where you cast it."},{"n":"Tiny Hut","l":3,"s":"Evoc","c":["bard","wizard"],"t":"1 minute","g":"Self","u":"8 hours","m":"VSM","k":0,"r":1,"x":"A 10-foot-radius immobile dome of force springs into existence around and above you and remains stationary for the duration. The spell ends if you leave its area. Nine creatures of Medium size or smaller can fit inside the dome with you. The spell fails if its area includes a larger creature or more than nine creatures. Creatures and objects within the dome when you cast this spell can move through it freely. All other creatures and objects are barred from passing through it. Spells and other magical effects can't extend through the dome or be cast through it. The atmosphere inside the space is comfortable and dry, regardless of the weather outside. Until the spell ends, you can\u2026"},{"n":"Tongues","l":3,"s":"Divi","c":["bard","cleric","sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"1 hour","m":"VM","k":0,"r":0,"x":"This spell grants the creature you touch the ability to understand any spoken language it hears. Moreover, when the target speaks, any creature that knows at least one language and can hear the target understands what it says."},{"n":"Transport via Plants","l":6,"s":"Conj","c":["druid"],"t":"1 action","g":"10 feet","u":"1 round","m":"VS","k":0,"r":0,"x":"This spell creates a magical link between a Large or larger inanimate plant within range and another plant, at any distance, on the same plane of existence. You must have seen or touched the destination plant at least once before. For the duration, any creature can step into the target plant and exit from the destination plant by using 5 feet of movement."},{"n":"Tree Stride","l":5,"s":"Conj","c":["druid","ranger"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You gain the ability to enter a tree and move from inside it to inside another tree of the same kind within 500 feet. Both trees must be living and at least the same size as you. You must use 5 feet of movement to enter a tree. You instantly know the location of all other trees of the same kind within 500 feet and, as part of the move used to enter the tree, can either pass into one of those trees or step out of the tree you're in. You appear in a spot of your choice within 5 feet of the destination tree, using another 5 feet of movement. If you have no movement left, you appear within 5 feet of the tree you entered. You can use this transportation ability once per round for the\u2026"},{"n":"True Polymorph","l":9,"s":"Tran","c":["bard","warlock","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"Choose one creature or nonmagical object that you can see within range. You transform the creature into a different creature, the creature into an object, or the object into a creature (the object must be neither worn nor carried by another creature). The transformation lasts for the duration, or until the target drops to 0 hit points or dies. If you concentrate on this spell for the full duration, the transformation becomes permanent. Shapechangers aren't affected by this spell. An unwilling creature can make a wisdom saving throw, and if it succeeds, it isn't affected by this spell. ***Creature into Creature.*** If you turn a creature into another kind of creature, the new form\u2026"},{"n":"True Resurrection","l":9,"s":"Necr","c":["cleric","druid"],"t":"1 hour","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You touch a creature that has been dead for no longer than 200 years and that died for any reason except old age. If the creature's soul is free and willing, the creature is restored to life with all its hit points. This spell closes all wounds, neutralizes any poison, cures all diseases, and lifts any curses affecting the creature when it died. The spell replaces damaged or missing organs and limbs. The spell can even provide a new body if the original no longer exists, in which case you must speak the creature's name. The creature then appears in an unoccupied space you choose within 10 feet of you."},{"n":"True Seeing","l":6,"s":"Divi","c":["bard","cleric","sorcerer","warlock","wizard"],"t":"1 action","g":"Touch","u":"1 hour","m":"VSM","k":0,"r":0,"x":"This spell gives the willing creature you touch the ability to see things as they actually are. For the duration, the creature has truesight, notices secret doors hidden by magic, and can see into the Ethereal Plane, all out to a range of 120 feet."},{"n":"True Strike","l":0,"s":"Divi","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 round","m":"S","k":1,"r":0,"x":"You extend your hand and point a finger at a target in range. Your magic grants you a brief insight into the target's defenses. On your next turn, you gain advantage on your first attack roll against the target, provided that this spell hasn't ended."},{"n":"Unseen Servant","l":1,"s":"Conj","c":["bard","warlock","wizard"],"t":"1 action","g":"60 feet","u":"1 hour","m":"VSM","k":0,"r":1,"x":"This spell creates an invisible, mindless, shapeless force that performs simple tasks at your command until the spell ends. The servant springs into existence in an unoccupied space on the ground within range. It has AC 10, 1 hit point, and a Strength of 2, and it can't attack. If it drops to 0 hit points, the spell ends. Once on each of your turns as a bonus action, you can mentally command the servant to move up to 15 feet and interact with an object. The servant can perform simple tasks that a human servant could do, such as fetching things, cleaning, mending, folding clothes, lighting fires, serving food, and pouring wine. Once you give the command, the servant performs the\u2026"},{"n":"Vampiric Touch","l":3,"s":"Necr","c":["warlock","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"The touch of your shadow-wreathed hand can siphon life force from others to heal your wounds. Make a melee spell attack against a creature within your reach. On a hit, the target takes 3d6 necrotic damage, and you regain hit points equal to half the amount of necrotic damage dealt. Until the spell ends, you can make the attack again on each of your turns as an action.","h":"When you cast this spell using a spell slot of 4th level or higher, the damage increases by 1d6 for each slot level above 3rd.","a":1,"dt":"necrotic","d":"3d6","up":"1d6"},{"n":"Vicious Mockery","l":0,"s":"Ench","c":["bard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You unleash a string of insults laced with subtle enchantments at a creature you can see within range. If the target can hear you (though it need not understand you), it must succeed on a wisdom saving throw or take 1d4 psychic damage and have disadvantage on the next attack roll it makes before the end of its next turn. This spell's damage increases by 1d4 when you reach 5th level (2d4), 11th level (3d4), and 17th level (4d4).","v":"wis","hf":0,"dt":"psychic","d":"1d4","cs":1},{"n":"Wall of Fire","l":4,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration. When the wall appears, each creature within its area must make a Dexterity saving throw. On a failed save, a creature takes 5d8 fire damage, or half as much damage on a successful save. One side of the wall, selected by you when you cast this spell, deals 5d8 fire damage to each creature that ends its turn within 10 feet o f that side or inside the wall. A creature takes the same damage when it enters the wall for the first time\u2026","h":"When you cast this spell using a spell slot of 5th level or higher, the damage increases by 1d8 for each slot level above 4th.","v":"dex","hf":1,"dt":"fire","d":"5d8"},{"n":"Wall of Force","l":5,"s":"Evoc","c":["wizard"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"An invisible wall of force springs into existence at a point you choose within range. The wall appears in any orientation you choose, as a horizontal or vertical barrier or at an angle. It can be free floating or resting on a solid surface. You can form it into a hemispherical dome or a sphere with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-by-10-foot panels. Each panel must be contiguous with another panel. In any form, the wall is 1/4 inch thick. It lasts for the duration. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (your choice which side). Nothing can physically pass through\u2026"},{"n":"Wall of Ice","l":6,"s":"Evoc","c":["wizard"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You create a wall of ice on a solid surface within range. You can form it into a hemispherical dome or a sphere with a radius of up to 10 feet, or you can shape a flat surface made up of ten 10-foot-square panels. Each panel must be contiguous with another panel. In any form, the wall is 1 foot thick and lasts for the duration. If the wall cuts through a creature's space when it appears, the creature within its area is pushed to one side of the wall and must make a dexterity saving throw. On a failed save, the creature takes 10d6 cold damage, or half as much damage on a successful save. The wall is an object that can be damaged and thus breached. It has AC 12 and 30 hit points per\u2026","h":"When you cast this spell using a spell slot of 7th level or higher, the damage the wall deals when it appears increases by 2d6, and the damage from passing through the sheet of frigid air increases by 1d6, for each slot level above 6th.","v":"dex","hf":1,"dt":"cold","d":"10d6","up":"2d6"},{"n":"Wall of Stone","l":5,"s":"Evoc","c":["druid","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"A nonmagical wall of solid stone springs into existence at a point you choose within range. The wall is 6 inches thick and is composed of ten 10-foot-by-10-foot panels. Each panel must be contiguous with at least one other panel. Alternatively, you can create 10-foot-by-20-foot panels that are only 3 inches thick. If the wall cuts through a creature's space when it appears, the creature is pushed to one side of the wall (your choice). If a creature would be surrounded on all sides by the wall (or the wall and another solid surface), that creature can make a dexterity saving throw. On a success, it can use its reaction to move up to its speed so that it is no longer enclosed by the\u2026"},{"n":"Wall of Thorns","l":6,"s":"Conj","c":["druid"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You create a wall of tough, pliable, tangled brush bristling with needle-sharp thorns. The wall appears within range on a solid surface and lasts for the duration. You choose to make the wall up to 60 feet long, 10 feet high, and 5 feet thick or a circle that has a 20-foot diameter and is up to 20 feet high and 5 feet thick. The wall blocks line of sight. When the wall appears, each creature within its area must make a dexterity saving throw. On a failed save, a creature takes 7d8 piercing damage, or half as much damage on a successful save. A creature can move through the wall, albeit slowly and painfully. For every 1 foot a creature moves through the wall, it must spend 4 feet\u2026","h":"When you cast this spell using a spell slot of 7th level or higher, both types of damage increase by 1d8 for each slot level above 6th.","v":"dex","hf":1,"dt":"piercing","d":"7d8","up":"1d8"},{"n":"Warding Bond","l":2,"s":"Abju","c":["cleric"],"t":"1 action","g":"Touc
