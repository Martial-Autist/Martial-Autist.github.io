<!DOCTYPE html>
<html lang="en" data-edition="store">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1" data-keep>
<meta name="description" content="A free, homebrew-friendly living character sheet for 5e. Tap to roll, track slots and resources, multiclass, and add anything your DM gives you." data-keep>
<meta name="theme-color" content="#14110f" data-keep>
<link rel="manifest" href="manifest.webmanifest" data-keep>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" data-keep>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-keep>
<title data-keep>Living Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" data-keep>
<style data-keep>
:root{
  --bg:#14110f; --panel:#1e1a17; --panel2:#272220; --line:#3a332e; --ink:#efe6da; --mute:#a89a8a;
  --acc:#c0392b; --acc2:#e0a84f; --good:#5aa36a; --bad:#d9534f; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
textarea{min-height:70px;resize:vertical}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 12px 6px;max-width:760px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:10px}
.toprow .who{flex:1;min-width:0}
.toprow h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--bad);color:#ffb3b0}
.btn[disabled]{opacity:.35;cursor:default}
.save.dirty{background:var(--acc2);border-color:var(--acc2);color:#1b1208;font-weight:700}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.adv{display:flex;gap:4px;margin-top:6px}
.adv button{flex:1;padding:5px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.adv button.on.n{background:var(--panel2);border-color:var(--mute)}
.adv button.on.a{background:var(--good);border-color:var(--good);color:#071}
.adv button.on.a{color:#04140a;font-weight:700}
.adv button.on.d{background:var(--bad);border-color:var(--bad);font-weight:700}
.card{background:rgba(30,26,23,.86);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.card h2{font-size:15px;color:var(--acc2);margin-bottom:8px;letter-spacing:.5px}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g6{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.g6{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.stat .v{font-size:22px;font-weight:700}
.stat .s{font-size:12px;color:var(--mute)}
button.stat:active,.row:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;text-align:left}
.row .nm{flex:1;min-width:0}
.row .bn{font-weight:700;min-width:36px;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute);flex:none}
.dot.p{background:var(--mute)}
.dot.e{background:var(--acc2);border-color:var(--acc2)}
.cols2{columns:2;column-gap:8px}
.cols2 .row{break-inside:avoid}
@media(max-width:420px){.cols2{columns:1}}
.hp{display:flex;align-items:center;gap:10px}
.hp .big{font-size:34px;font-weight:700}
.hp .big small{font-size:16px;color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--good)}
.hpctl{display:flex;gap:6px}
.hpctl input{width:80px;flex:none;text-align:center}
.res{display:flex;align-items:center;gap:6px;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.res .nm{flex:1}
.res .ct{font-weight:700;min-width:44px;text-align:center}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc2);background:var(--acc2);padding:0}
.pip.used{background:transparent;border-color:var(--line)}
.slotrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.slotrow .lv{width:34px;color:var(--mute);font-size:13px}
.spell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.spell .t{display:flex;align-items:center;gap:8px}
.spell .t b{flex:1}
.meta{color:var(--mute);font-size:12.5px;margin-top:3px}
.note{color:var(--mute);font-size:13px;margin-top:4px;white-space:pre-wrap}
.lvhead{margin-top:12px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;background:#3a2a20;color:var(--acc2);margin:4px 4px 0 0}
.f{display:block;margin-top:8px}
.f>span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.chk input{width:auto}
.ed{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.ed .hd{display:flex;gap:8px;align-items:center}
.ed .hd b{flex:1}
.effrow{display:flex;gap:6px;margin-top:6px}
.effrow select{flex:1}
.effrow input{width:80px;flex:none}
.effrow input,.effrow select{min-width:0}
.effbox{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.hint{color:var(--mute);font-size:12.5px;margin-top:6px}
.switch{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);border:none;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.15s}
.switch.on{background:var(--good)}
.switch.on::after{left:21px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
#sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;padding:16px 16px 26px;max-height:85vh;overflow:auto}
#sheet h3{font-size:18px;margin-bottom:6px}
.rl{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rl:first-of-type{border-top:none}
.rl .lab{flex:1;color:var(--mute);text-transform:capitalize}
.rl .val{font-size:30px;font-weight:700}
.rl .det{font-size:12px;color:var(--mute)}
.rl.crit .val{color:var(--acc2)}
.rl.fumble .val{color:var(--bad)}
.slotpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slotpick button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.slotpick button small{display:block;color:var(--mute);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:6px 12px;font-size:13.5px;text-align:left}
.chip small{display:block;color:var(--mute);font-size:11px}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#1b1208;font-weight:600}
.chip.on small{color:#4a3510}
.fab{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:var(--acc);font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:10}
.stepper{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stepper>div{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.stepper b{font-size:20px;min-width:34px}
.dicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dicegrid button{padding:14px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:700}
.dicegrid button small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.dicegrid .ad{border-color:var(--good)} .dicegrid .dd{border-color:var(--bad)}
.libg{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.libg .hd{display:flex;align-items:center;gap:8px}.libg .hd b{flex:1;font-family:Cinzel,serif;color:var(--acc2)}
.libi{display:flex;align-items:center;gap:8px;padding:6px 0}.libi>span:first-child{flex:1}
.lvbig{margin-top:12px;padding:10px;border-radius:10px;background:var(--panel2);text-align:center}
.lvbig b{font-size:22px;color:var(--acc2)}
.pip.pact{border-color:#8e6cc0;background:#8e6cc0}.pip.pact.used{background:transparent;border-color:var(--line)}
.charcard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:10px}
.charcard.on{border-color:var(--acc2)}
.charcard .ci{flex:1;min-width:0}.charcard .ci b{font-family:Cinzel,serif}
.thumb.ph{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acc);font-weight:700;flex:none}
.charbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.tabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;overflow:visible}
.tabs button{min-width:0;padding:8px 1px;font-size:clamp(10.5px,3.3vw,14px);letter-spacing:-.1px;overflow:hidden;text-overflow:clip}
.tabs.wrap{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:300px){.tabs{grid-template-columns:repeat(4,1fr)}}
.footer{text-align:center;color:var(--mute);font-size:12px;margin:36px 0 10px;opacity:.7;line-height:1.8}
.linkish{background:none;border:none;color:var(--mute);font-size:12px;padding:2px 4px;text-decoration:underline dotted;cursor:pointer}
.potedit{margin:4px 0 8px;padding:6px 10px;border:1px dashed var(--line);border-radius:10px}
.potedit summary{cursor:pointer;color:var(--mute);font-size:13px}
.skchip.hl{border-color:var(--acc2)}
.skchip.exp{background:#8e6cc0;border-color:#8e6cc0;color:#fff;font-weight:600}
.sbrow{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.sbrow .sbn{flex:1;min-width:0;cursor:pointer}
.btn.on{background:var(--good);border-color:var(--good);color:#04140a;font-weight:600}
.frow{border-top:1px solid var(--line);padding:8px 0}
.fgroup summary{cursor:pointer;list-style:none}.fgroup summary::-webkit-details-marker{display:none}
.wildcard{border-color:var(--acc2)}
#bgart{position:fixed;inset:0;z-index:0;pointer-events:none;background-repeat:no-repeat;background-position:center 58%;background-size:min(88vw,560px);opacity:.11;transition:background-image .3s}
#app{position:relative;z-index:1}
img.thumb{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--acc2);cursor:pointer;flex:none}
img.portrait{max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
.log .row{display:block}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
html[lang=ja] [data-act=save1] .nm{white-space:nowrap;font-size:.88em}
</style>
</head>

<script data-keep id="spelldb">window.__SPELLDB={"spells":[{"n":"Acid Arrow","l":2,"s":"Evoc","c":["wizard"],"t":"1 action","g":"90 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A shimmering green arrow streaks toward a target within range and bursts in a spray of acid. Make a ranged spell attack against the target. On a hit, the target takes 4d4 acid damage immediately and 2d4 acid damage at the end of its next turn. On a miss, the arrow splashes the target with acid for half as much of the initial damage and no damage at the end of its next turn.","h":"When you cast this spell using a spell slot of 3rd level or higher, the damage (both initial and later) increases by 1d4 for each slot level above 2nd.","a":1,"dt":"acid","d":"4d4","up":"1d4"},{"n":"Acid Splash","l":0,"s":"Conj","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You hurl a bubble of acid. Choose one creature within range, or choose two creatures within range that are within 5 feet of each other. A target must succeed on a dexterity saving throw or take 1d6 acid damage. This spell's damage increases by 1d6 when you reach 5th level (2d6), 11th level (3d6), and 17th level (4d6).","v":"dex","hf":0,"dt":"acid","d":"1d6","cs":1},{"n":"Aid","l":2,"s":"Abju","c":["cleric","paladin"],"t":"1 action","g":"30 feet","u":"8 hours","m":"VSM","k":0,"r":0,"x":"Your spell bolsters your allies with toughness and resolve. Choose up to three creatures within range. Each target's hit point maximum and current hit points increase by 5 for the duration.","h":"When you cast this spell using a spell slot of 3rd level or higher, a target's hit points increase by an additional 5 for each slot level above 2nd.","dt":"healing","d":"5","up":"5"},{"n":"Alarm","l":1,"s":"Abju","c":["ranger","wizard"],"t":"1 minute","g":"30 feet","u":"8 hours","m":"VSM","k":0,"r":1,"x":"You set an alarm against unwanted intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot cube. Until the spell ends, an alarm alerts you whenever a Tiny or larger creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is mental or audible. A mental alarm alerts you with a ping in your mind if you are within 1 mile of the warded area. This ping awakens you if you are sleeping. An audible alarm produces the sound of a hand bell for 10 seconds within 60 feet."},{"n":"Alter Self","l":2,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You assume a different form. When you cast the spell, choose one of the following options, the effects of which last for the duration of the spell. While the spell lasts, you can end one option as an action to gain the benefits of a different one. ***Aquatic Adaptation.*** You adapt your body to an aquatic environment, sprouting gills and growing webbing between your fingers. You can breathe underwater and gain a swimming speed equal to your walking speed. ***Change Appearance.*** You transform your appearance. You decide what you look like, including your height, weight, facial features, sound of your voice, hair length, coloration, and distinguishing characteristics, if any. You\u2026"},{"n":"Animal Friendship","l":1,"s":"Ench","c":["bard","druid","ranger"],"t":"1 action","g":"30 feet","u":"24 hours","m":"VSM","k":0,"r":0,"x":"This spell lets you convince a beast that you mean it no harm. Choose a beast that you can see within range. It must see and hear you. If the beast's Intelligence is 4 or higher, the spell fails. Otherwise, the beast must succeed on a wisdom saving throw or be charmed by you for the spell's duration. If you or one of your companions harms the target, the spells ends.","v":"wis","hf":0},{"n":"Animal Messenger","l":2,"s":"Ench","c":["bard","druid","ranger"],"t":"1 action","g":"30 feet","u":"24 hours","m":"VSM","k":0,"r":1,"x":"By means of this spell, you use an animal to deliver a message. Choose a Tiny beast you can see within range, such as a squirrel, a blue jay, or a bat. You specify a location, which you must have visited, and a recipient who matches a general description, such as \"a man or woman dressed in the uniform of the town guard\" or \"a red-haired dwarf wearing a pointed hat.\" You also speak a message of up to twenty-five words. The target beast travels for the duration of the spell toward the specified location, covering about 50 miles per 24 hours for a flying messenger, or 25 miles for other animals. When the messenger arrives, it delivers your message to the creature that you described,\u2026","h":"If you cast this spell using a spell slot of 3nd level or higher, the duration of the spell increases by 48 hours for each slot level above 2nd."},{"n":"Animal Shapes","l":8,"s":"Tran","c":["druid"],"t":"1 action","g":"30 feet","u":"Up to 24 hours","m":"VS","k":1,"r":0,"x":"Your magic turns others into beasts. Choose any number of willing creatures that you can see within range. You transform each target into the form of a Large or smaller beast with a challenge rating of 4 or lower. On subsequent turns, you can use your action to transform affected creatures into new forms. The transformation lasts for the duration for each target, or until the target drops to 0 hit points or dies. You can choose a different form for each target. A target's game statistics are replaced by the statistics of the chosen beast, though the target retains its alignment and Intelligence, Wisdom, and Charisma scores. The target assumes the hit points of its new form, and\u2026"},{"n":"Animate Dead","l":3,"s":"Necr","c":["cleric","wizard"],"t":"1 minute","g":"10 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"This spell creates an undead servant. Choose a pile of bones or a corpse of a Medium or Small humanoid within range. Your spell imbues the target with a foul mimicry of life, raising it as an undead creature. The target becomes a skeleton if you chose bones or a zombie if you chose a corpse (the GM has the creature's game statistics). On each of your turns, you can use a bonus action to mentally command any creature you made with this spell if the creature is within 60 feet of you (if you control multiple creatures, you can command any or all of them at the same time, issuing the same command to each one). You decide what action the creature will take and where it will move during\u2026","h":"When you cast this spell using a spell slot of 4th level or higher, you animate or reassert control over two additional undead creatures for each slot level above 3rd. Each of the creatures must come from a different corpse or pile of bones."},{"n":"Animate Objects","l":5,"s":"Tran","c":["bard","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"Objects come to life at your command. Choose up to ten nonmagical objects within range that are not being worn or carried. Medium targets count as two objects, Large targets count as four objects, Huge targets count as eight objects. You can't animate any object larger than Huge. Each target animates and becomes a creature under your control until the spell ends or until reduced to 0 hit points. As a bonus action, you can mentally command any creature you made with this spell if the creature is within 500 feet of you (if you control multiple creatures, you can command any or all of them at the same time, issuing the same command to each one). You decide what action the creature\u2026","h":"If you cast this spell using a spell slot of 6th level or higher, you can animate two additional objects for each slot level above 5th."},{"n":"Antilife Shell","l":5,"s":"Abju","c":["druid"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"A shimmering barrier extends out from you in a 10-foot radius and moves with you, remaining centered on you and hedging out creatures other than undead and constructs. The barrier lasts for the duration. The barrier prevents an affected creature from passing or reaching through. An affected creature can cast spells or make attacks with ranged or reach weapons through the barrier. If you move so that an affected creature is forced to pass through the barrier, the spell ends."},{"n":"Antimagic Field","l":8,"s":"Abju","c":["cleric","wizard"],"t":"1 action","g":"Self","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"A 10-foot-radius invisible sphere of antimagic surrounds you. This area is divorced from the magical energy that suffuses the multiverse. Within the sphere, spells can't be cast, summoned creatures disappear, and even magic items become mundane. Until the spell ends, the sphere moves with you, centered on you. Spells and other magical effects, except those created by an artifact or a deity, are suppressed in the sphere and can't protrude into it. A slot expended to cast a suppressed spell is consumed. While an effect is suppressed, it doesn't function, but the time it spends suppressed counts against its duration. ***Targeted Effects.*** Spells and other magical effects, such as\u2026"},{"n":"Antipathy/Sympathy","l":8,"s":"Ench","c":["druid","wizard"],"t":"1 hour","g":"60 feet","u":"10 days","m":"VSM","k":0,"r":0,"x":"This spell attracts or repels creatures of your choice. You target something within range, either a Huge or smaller object or creature or an area that is no larger than a 200-foot cube. Then specify a kind of intelligent creature, such as red dragons, goblins, or vampires. You invest the target with an aura that either attracts or repels the specified creatures for the duration. Choose antipathy or sympathy as the aura's effect. ***Antipathy.*** The enchantment causes creatures of the kind you designated to feel an intense urge to leave the area and avoid the target. When such a creature can see the target or comes within 60 feet of it, the creature must succeed on a wisdom saving\u2026"},{"n":"Arcane Eye","l":4,"s":"Divi","c":["cleric","wizard"],"t":"1 action","g":"30 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You create an invisible, magical eye within range that hovers in the air for the duration. You mentally receive visual information from the eye, which has normal vision and darkvision out to 30 feet. The eye can look in every direction. As an action, you can move the eye up to 30 feet in any direction. There is no limit to how far away from you the eye can move, but it can't enter another plane of existence. A solid barrier blocks the eye's movement, but the eye can pass through an opening as small as 1 inch in diameter."},{"n":"Arcane Hand","l":5,"s":"Evoc","c":["wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create a Large hand of shimmering, translucent force in an unoccupied space that you can see within range. The hand lasts for the spell's duration, and it moves at your command, mimicking the movements of your own hand. The hand is an object that has AC 20 and hit points equal to your hit point maximum. If it drops to 0 hit points, the spell ends. It has a Strength of 26 (+8) and a Dexterity of 10 (+0). The hand doesn't fill its space. When you cast the spell and as a bonus action on your subsequent turns, you can move the hand up to 60 feet and then cause one of the following effects with it. ***Clenched Fist.*** The hand strikes one creature or object within 5 feet of it.\u2026","h":"When you cast this spell using a spell slot of 6th level or higher, the damage from the clenched fist option increases by 2d8 and the damage from the grasping hand increases by 2d6 for each slot level above 5th."},{"n":"Arcane Lock","l":2,"s":"Abju","c":["wizard"],"t":"1 action","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"You touch a closed door, window, gate, chest, or other entryway, and it becomes locked for the duration. You and the creatures you designate when you cast this spell can open the object normally. You can also set a password that, when spoken within 5 feet of the object, suppresses this spell for 1 minute. Otherwise, it is impassable until it is broken or the spell is dispelled or suppressed. Casting knock on the object suppresses arcane lock for 10 minutes. While affected by this spell, the object is more difficult to break or force open; the DC to break it or pick any locks on it increases by 10."},{"n":"Arcane Sword","l":7,"s":"Evoc","c":["bard","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create a sword-shaped plane of force that hovers within range. It lasts for the duration. When the sword appears, you make a melee spell attack against a target of your choice within 5 feet of the sword. On a hit, the target takes 3d10 force damage. Until the spell ends, you can use a bonus action on each of your turns to move the sword up to 20 feet to a spot you can see and repeat this attack against the same target or a different one.","a":1,"dt":"force","d":"3d10"},{"n":"Arcanist's Magic Aura","l":2,"s":"Illu","c":["wizard"],"t":"1 action","g":"Touch","u":"24 hours","m":"VSM","k":0,"r":0,"x":"You place an illusion on a creature or an object you touch so that divination spells reveal false information about it. The target can be a willing creature or an object that isn't being carried or worn by another creature. When you cast the spell, choose one or both of the following effects. The effect lasts for the duration. If you cast this spell on the same creature or object every day for 30 days, placing the same effect on it each time, the illusion lasts until it is dispelled. ***False Aura.*** You change the way the target appears to spells and magical effects, such as detect magic, that detect magical auras. You can make a nonmagical object appear magical, a magical\u2026"},{"n":"Astral Projection","l":9,"s":"Necr","c":["cleric","warlock","wizard"],"t":"1 hour","g":"10 feet","u":"Special","m":"VSM","k":0,"r":0,"x":"You and up to eight willing creatures within range project your astral bodies into the Astral Plane (the spell fails and the casting is wasted if you are already on that plane). The material body you leave behind is unconscious and in a state of suspended animation; it doesn't need food or air and doesn't age. Your astral body resembles your mortal form in almost every way, replicating your game statistics and possessions. The principal difference is the addition of a silvery cord that extends from between your shoulder blades and trails behind you, fading to invisibility after 1 foot. This cord is your tether to your material body. As long as the tether remains intact, you can\u2026"},{"n":"Augury","l":2,"s":"Divi","c":["cleric"],"t":"1 minute","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":1,"x":"By casting gem-inlaid sticks, rolling dragon bones, laying out ornate cards, or employing some other divining tool, you receive an omen from an otherworldly entity about the results of a specific course of action that you plan to take within the next 30 minutes. The GM chooses from the following possible omens: - Weal, for good results - Woe, for bad results - Weal and woe, for both good and bad results - Nothing, for results that aren't especially good or bad The spell doesn't take into account any possible circumstances that might change the outcome, such as the casting of additional spells or the loss or gain of a companion. If you cast the spell two or more times before\u2026"},{"n":"Awaken","l":5,"s":"Tran","c":["bard","druid"],"t":"8 hours","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"After spending the casting time tracing magical pathways within a precious gemstone, you touch a Huge or smaller beast or plant. The target must have either no Intelligence score or an Intelligence of 3 or less. The target gains an Intelligence of 10. The target also gains the ability to speak one language you know. If the target is a plant, it gains the ability to move its limbs, roots, vines, creepers, and so forth, and it gains senses similar to a human's. Your GM chooses statistics appropriate for the awakened plant, such as the statistics for the awakened shrub or the awakened tree. The awakened beast or plant is charmed by you for 30 days or until you or your companions do\u2026"},{"n":"Bane","l":1,"s":"Ench","c":["bard","cleric"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Up to three creatures of your choice that you can see within range must make charisma saving throws. Whenever a target that fails this saving throw makes an attack roll or a saving throw before the spell ends, the target must roll a d4 and subtract the number rolled from the attack roll or saving throw.","h":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each slot level above 1st.","v":"cha","hf":0},{"n":"Banishment","l":4,"s":"Abju","c":["cleric","paladin","sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You attempt to send one creature that you can see within range to another plane of existence. The target must succeed on a charisma saving throw or be banished. If the target is native to the plane of existence you're on, you banish the target to a harmless demiplane. While there, the target is incapacitated. The target remains there until the spell ends, at which point the target reappears in the space it left or in the nearest unoccupied space if that space is occupied. If the target is native to a different plane of existence than the one you're on, the target is banished with a faint popping noise, returning to its home plane. If the spell ends before 1 minute has passed, the\u2026","h":"When you cast this spell using a spell slot of 5th level or higher, you can target one additional creature for each slot level above 4th.","v":"cha","hf":0},{"n":"Barkskin","l":2,"s":"Tran","c":["druid","ranger"],"t":"1 action","g":"Touch","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You touch a willing creature. Until the spell ends, the target's skin has a rough, bark-like appearance, and the target's AC can't be less than 16, regardless of what kind of armor it is wearing."},{"n":"Beacon of Hope","l":3,"s":"Abju","c":["cleric"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"This spell bestows hope and vitality. Choose any number of creatures within range. For the duration, each target has advantage on wisdom saving throws and death saving throws, and regains the maximum number of hit points possible from any healing."},{"n":"Bestow Curse","l":3,"s":"Necr","c":["bard","cleric","wizard"],"t":"1 action","g":"Touch","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You touch a creature, and that creature must succeed on a wisdom saving throw or become cursed for the duration of the spell. When you cast this spell, choose the nature of the curse from the following options: - Choose one ability score. While cursed, the target has disadvantage on ability checks and saving throws made with that ability score. - While cursed, the target has disadvantage on attack rolls against you. - While cursed, the target must make a wisdom saving throw at the start of each of its turns. If it fails, it wastes its action that turn doing nothing. - While the target is cursed, your attacks and spells deal an extra 1d8 necrotic damage to the target. A remove\u2026","h":"If you cast this spell using a spell slot of 4th level or higher, the duration is concentration, up to 10 minutes. If you use a spell slot of 5th level or higher, the duration is 8 hours. If you use a spell slot of 7th level or higher, the duration is 24 hours. If you use a 9th level spell slot, the","v":"wis","hf":0},{"n":"Black Tentacles","l":4,"s":"Conj","c":["wizard"],"t":"1 action","g":"90 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Squirming, ebony tentacles fill a 20-foot square on ground that you can see within range. For the duration, these tentacles turn the ground in the area into difficult terrain. When a creature enters the affected area for the first time on a turn or starts its turn there, the creature must succeed on a Dexterity saving throw or take 3d6 bludgeoning damage and be restrained by the tentacles until the spell ends. A creature that starts its turn in the area and is already restrained by the tentacles takes 3d6 bludgeoning damage. A creature restrained by the tentacles can use its action to make a Strength or Dexterity check (its choice) against your spell save DC. On a success, it frees itself.","v":"dex","hf":0,"dt":"bludgeoning","d":"3d6"},{"n":"Blade Barrier","l":6,"s":"Evoc","c":["cleric"],"t":"1 action","g":"90 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"You create a vertical wall of whirling, razor-sharp blades made of magical energy. The wall appears within range and lasts for the duration. You can make a straight wall up to 100 feet long, 20 feet high, and 5 feet thick, or a ringed wall up to 60 feet in diameter, 20 feet high, and 5 feet thick. The wall provides three-quarters cover to creatures behind it, and its space is difficult terrain. When a creature enters the wall's area for the first time on a turn or starts its turn there, the creature must make a dexterity saving throw. On a failed save, the creature takes 6d10 slashing damage. On a successful save, the creature takes half as much damage.","v":"dex","hf":1,"dt":"slashing","d":"6d10"},{"n":"Bless","l":1,"s":"Ench","c":["cleric","paladin"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You bless up to three creatures of your choice within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target can roll a d4 and add the number rolled to the attack roll or saving throw.","h":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each slot level above 1st."},{"n":"Blight","l":4,"s":"Necr","c":["druid","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"Necromantic energy washes over a creature of your choice that you can see within range, draining moisture and vitality from it. The target must make a constitution saving throw. The target takes 8d8 necrotic damage on a failed save, or half as much damage on a successful one. The spell has no effect on undead or constructs. If you target a plant creature or a magical plant, it makes the saving throw with disadvantage, and the spell deals maximum damage to it. If you target a nonmagical plant that isn't a creature, such as a tree or shrub, it doesn't make a saving throw; it simply withers and dies.","h":"When you cast this spell using a spell slot of 5th level of higher, the damage increases by 1d8 for each slot level above 4th.","v":"con","hf":1,"dt":"necrotic","d":"8d8","up":"1d8"},{"n":"Blindness/Deafness","l":2,"s":"Necr","c":["bard","cleric","sorcerer","wizard"],"t":"1 action","g":"30 feet","u":"1 minute","m":"V","k":0,"r":0,"x":"You can blind or deafen a foe. Choose one creature that you can see within range to make a constitution saving throw. If it fails, the target is either blinded or deafened (your choice) for the duration. At the end of each of its turns, the target can make a constitution saving throw. On a success, the spell ends.","h":"When you cast this spell using a spell slot of 3rd level or higher, you can target one additional creature for each slot level above 2nd.","v":"con","hf":0},{"n":"Blink","l":3,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"1 minute","m":"VS","k":0,"r":0,"x":"Roll a d20 at the end of each of your turns for the duration of the spell. On a roll of 11 or higher, you vanish from your current plane of existence and appear in the Ethereal Plane (the spell fails and the casting is wasted if you were already on that plane). At the start of your next turn, and when the spell ends if you are on the Ethereal Plane, you return to an unoccupied space of your choice that you can see within 10 feet of the space you vanished from. If no unoccupied space is available within that range, you appear in the nearest unoccupied space (chosen at random if more than one space is equally near). You can dismiss this spell as an action. While on the Ethereal\u2026"},{"n":"Blur","l":2,"s":"Illu","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"V","k":1,"r":0,"x":"Your body becomes blurred, shifting and wavering to all who can see you. For the duration, any creature has disadvantage on attack rolls against you. An attacker is immune to this effect if it doesn't rely on sight, as with blindsight, or can see through illusions, as with truesight."},{"n":"Branding Smite","l":2,"s":"Evoc","c":["paladin"],"t":"1 bonus action","g":"Self","u":"Up to 1 minute","m":"V","k":1,"r":0,"x":"The next time you hit a creature with a weapon attack before this spell ends, the weapon gleams with astral radiance as you strike. The attack deals an extra 2d6 radiant damage to the target, which becomes visible if it's invisible, and the target sheds dim light in a 5-foot radius and can't become invisible until the spell ends.","h":"When you cast this spell using a spell slot of 3rd level or higher, the extra damage increases by 1d6 for each slot level above 2nd.","dt":"radiant","d":"2d6","up":"1d6"},{"n":"Burning Hands","l":1,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"As you hold your hands with thumbs touching and fingers spread, a thin sheet of flames shoots forth from your outstretched fingertips. Each creature in a 15-foot cone must make a dexterity saving throw. A creature takes 3d6 fire damage on a failed save, or half as much damage on a successful one. The fire ignites any flammable objects in the area that aren't being worn or carried.","h":"When you cast this spell using a spell slot of 2nd level or higher, the damage increases by 1d6 for each slot level above 1st.","v":"dex","hf":1,"dt":"fire","d":"3d6","up":"1d6"},{"n":"Call Lightning","l":3,"s":"Conj","c":["druid"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"A storm cloud appears in the shape of a cylinder that is 10 feet tall with a 60-foot radius, centered on a point you can see 100 feet directly above you. The spell fails if you can't see a point in the air where the storm cloud could appear (for example, if you are in a room that can't accommodate the cloud). When you cast the spell, choose a point you can see within range. A bolt of lightning flashes down from the cloud to that point. Each creature within 5 feet of that point must make a dexterity saving throw. A creature takes 3d10 lightning damage on a failed save, or half as much damage on a successful one. On each of your turns until the spell ends, you can use your action to\u2026","h":"When you cast this spell using a spell slot of 4th or higher level, the damage increases by 1d10 for each slot level above 3rd.","dt":"lightning","d":"3d10","up":"1d10"},{"n":"Calm Emotions","l":2,"s":"Ench","c":["bard","cleric"],"t":"1 action","g":"60 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"You attempt to suppress strong emotions in a group of people. Each humanoid in a 20-foot-radius sphere centered on a point you choose within range must make a charisma saving throw; a creature can choose to fail this saving throw if it wishes. If a creature fails its saving throw, choose one of the following two effects. You can suppress any effect causing a target to be charmed or frightened. When this spell ends, any suppressed effect resumes, provided that its duration has not expired in the meantime. Alternatively, you can make a target indifferent about creatures of your choice that it is hostile toward. This indifference ends if the target is attacked or harmed by a spell or\u2026","v":"cha","hf":0},{"n":"Chain Lightning","l":6,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You create a bolt of lightning that arcs toward a target of your choice that you can see within range. Three bolts then leap from that target to as many as three other targets, each of which must be within 30 feet of the first target. A target can be a creature or an object and can be targeted by only one of the bolts. A target must make a dexterity saving throw. The target takes 10d8 lightning damage on a failed save, or half as much damage on a successful one.","h":"When you cast this spell using a spell slot of 7th level or higher, one additional bolt leaps from the first target to another target for each slot level above 6th.","v":"dex","hf":1,"dt":"lightning","d":"10d8"},{"n":"Charm Person","l":1,"s":"Ench","c":["bard","druid","sorcerer","warlock","wizard"],"t":"1 action","g":"30 feet","u":"1 hour","m":"VS","k":0,"r":0,"x":"You attempt to charm a humanoid you can see within range. It must make a wisdom saving throw, and does so with advantage if you or your companions are fighting it. If it fails the saving throw, it is charmed by you until the spell ends or until you or your companions do anything harmful to it. The charmed creature regards you as a friendly acquaintance. When the spell ends, the creature knows it was charmed by you.","h":"When you cast this spell using a spell slot of 2nd level or higher, you can target one additional creature for each slot level above 1st. The creatures must be within 30 feet of each other when you target them.","v":"wis","hf":0},{"n":"Chill Touch","l":0,"s":"Necr","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"120 feet","u":"1 round","m":"VS","k":0,"r":0,"x":"You create a ghostly, skeletal hand in the space of a creature within range. Make a ranged spell attack against the creature to assail it with the chill of the grave. On a hit, the target takes 1d8 necrotic damage, and it can't regain hit points until the start of your next turn. Until then, the hand clings to the target. If you hit an undead target, it also has disadvantage on attack rolls against you until the end of your next turn. This spell's damage increases by 1d8 when you reach 5th level (2d8), 11th level (3d8), and 17th level (4d8).","a":1,"dt":"necrotic","d":"1d8","cs":1},{"n":"Circle of Death","l":6,"s":"Necr","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"150 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A sphere of negative energy ripples out in a 60-foot radius sphere from a point within range. Each creature in that area must make a constitution saving throw. A target takes 8d6 necrotic damage on a failed save, or half as much damage on a successful one.","h":"When you cast this spell using a spell slot of 7th level or higher, the damage increases by 2d6 for each slot level above 6th.","v":"con","hf":1,"dt":"necrotic","d":"8d6","up":"2d6"},{"n":"Clairvoyance","l":3,"s":"Divi","c":["bard","cleric","sorcerer","wizard"],"t":"10 minutes","g":"1 mile","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"You create an invisible sensor within range in a location familiar to you (a place you have visited or seen before) or in an obvious location that is unfamiliar to you (such as behind a door, around a corner, or in a grove of trees). The sensor remains in place for the duration, and it can't be attacked or otherwise interacted with. When you cast the spell, you choose seeing or hearing. You can use the chosen sense through the sensor as if you were in its space. As your action, you can switch between seeing and hearing. A creature that can see the sensor (such as a creature benefiting from see invisibility or truesight) sees a luminous, intangible orb about the size of your fist."},{"n":"Clone","l":8,"s":"Necr","c":["wizard"],"t":"1 hour","g":"Touch","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"This spell grows an inert duplicate of a living creature as a safeguard against death. This clone forms inside a sealed vessel and grows to full size and maturity after 120 days; you can also choose to have the clone be a younger version of the same creature. It remains inert and endures indefinitely, as long as its vessel remains undisturbed. At any time after the clone matures, if the original creature dies, its soul transfers to the clone, provided that the soul is free and willing to return. The clone is physically identical to the original and has the same personality, memories, and abilities, but none of the original's equipment. The original creature's physical remains, if\u2026"},{"n":"Cloudkill","l":5,"s":"Conj","c":["sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"You create a 20-foot-radius sphere of poisonous, yellow-green fog centered on a point you choose within range. The fog spreads around corners. It lasts for the duration or until strong wind disperses the fog, ending the spell. Its area is heavily obscured. When a creature enters the spell's area for the first time on a turn or starts its turn there, that creature must make a constitution saving throw. The creature takes 5d8 poison damage on a failed save, or half as much damage on a successful one. Creatures are affected even if they hold their breath or don't need to breathe. The fog moves 10 feet away from you at the start of each of your turns, rolling along the surface of the\u2026","h":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d8 for each slot level above 5th.","v":"con","hf":1,"dt":"poison","d":"5d8","up":"1d8"},{"n":"Color Spray","l":1,"s":"Illu","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"1 round","m":"VSM","k":0,"r":0,"x":"A dazzling array of flashing, colored light springs from your hand. Roll 6d10; the total is how many hit points of creatures this spell can effect. Creatures in a 15-foot cone originating from you are affected in ascending order of their current hit points (ignoring unconscious creatures and creatures that can't see). Starting with the creature that has the lowest current hit points, each creature affected by this spell is blinded until the spell ends. Subtract each creature's hit points from the total before moving on to the creature with the next lowest hit points. A creature's hit points must be equal to or less than the remaining total for that creature to be affected.","h":"When you cast this spell using a spell slot of 2nd level or higher, roll an additional 2d10 for each slot level above 1st."},{"n":"Command","l":1,"s":"Ench","c":["cleric","paladin"],"t":"1 action","g":"60 feet","u":"1 round","m":"V","k":0,"r":0,"x":"You speak a one-word command to a creature you can see within range. The target must succeed on a wisdom saving throw or follow the command on its next turn. The spell has no effect if the target is undead, if it doesn't understand your language, or if your command is directly harmful to it. Some typical commands and their effects follow. You might issue a command other than one described here. If you do so, the GM determines how the target behaves. If the target can't follow your command, the spell ends. ***Approach.*** The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you. ***Drop.*** The target drops whatever it is\u2026","h":"When you cast this spell using a spell slot of 2nd level or higher, you can affect one additional creature for each slot level above 1st. The creatures must be within 30 feet of each other when you target them.","v":"wis","hf":0},{"n":"Commune","l":5,"s":"Divi","c":["cleric"],"t":"1 minute","g":"Self","u":"1 minute","m":"VSM","k":0,"r":1,"x":"You contact your deity or a divine proxy and ask up to three questions that can be answered with a yes or no. You must ask your questions before the spell ends. You receive a correct answer for each question. Divine beings aren't necessarily omniscient, so you might receive \"unclear\" as an answer if a question pertains to information that lies beyond the deity's knowledge. In a case where a one-word answer could be misleading or contrary to the deity's interests, the GM might offer a short phrase as an answer instead. If you cast the spell two or more times before finishing your next long rest, there is a cumulative 25 percent chance for each casting after the first that you get\u2026"},{"n":"Commune With Nature","l":5,"s":"Divi","c":["druid","ranger"],"t":"1 minute","g":"Self","u":"Instantaneous","m":"VS","k":0,"r":1,"x":"You briefly become one with nature and gain knowledge of the surrounding territory. In the outdoors, the spell gives you knowledge of the land within 3 miles of you. In caves and other natural underground settings, the radius is limited to 300 feet. The spell doesn't function where nature has been replaced by construction, such as in dungeons and towns. You instantly gain knowledge of up to three facts of your choice about any of the following subjects as they relate to the area: - terrain and bodies of water - prevalent plants, minerals, animals, or peoples - powerful celestials, fey, fiends, elementals, or undead - influence from other planes of existence - buildings For\u2026"},{"n":"Comprehend Languages","l":1,"s":"Divi","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"Self","u":"1 hour","m":"VSM","k":0,"r":1,"x":"For the duration, you understand the literal meaning of any spoken language that you hear. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode secret messages in a text or a glyph, such as an arcane sigil, that isn't part of a written language."},{"n":"Compulsion","l":4,"s":"Ench","c":["bard"],"t":"1 action","g":"30 feet","u":"Up to 1 minute","m":"VS","k":1,"r":0,"x":"Creatures of your choice that you can see within range and that can hear you must make a wisdom saving throw. A target automatically succeeds on this saving throw if it can't be charmed. On a failed save, a target is affected by this spell. Until the spell ends, you can use a bonus action on each of your turns to designate a direction that is horizontal to you. Each affected target must use as much of its movement as possible to move in that direction on its next turn. It can take any action before it moves. After moving in this way, it can make another Wisdom save to try to end the effect. A target isn't compelled to move into an obviously deadly hazard, such as a fire or a pit,\u2026","v":"wis","hf":0},{"n":"Cone of Cold","l":5,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"Self","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A blast of cold air erupts from your hands. Each creature in a 60-foot cone must make a constitution saving throw. A creature takes 8d8 cold damage on a failed save, or half as much damage on a successful one. A creature killed by this spell becomes a frozen statue until it thaws.","h":"When you cast this spell using a spell slot of 6th level or higher, the damage increases by 1d8 for each slot level above 5th.","v":"con","hf":1,"dt":"cold","d":"8d8","up":"1d8"},{"n":"Confusion","l":4,"s":"Ench","c":["bard","druid","sorcerer","wizard"],"t":"1 action","g":"90 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"This spell assaults and twists creatures' minds, spawning delusions and provoking uncontrolled action. Each creature in a 10-foot-radius sphere centered on a point you choose within range must succeed on a Wisdom saving throw when you cast this spell or be affected by it. An affected target can't take reactions and must roll a d10 at the start of each of its turns to determine its behavior for that turn. | d10 | Behavior | |---|---| | 1 | The creature uses all its movement to move in a random direction. To determine the direction, roll a d8 and assign a direction to each die face. The creature doesn't take an action this turn. | | 2-6 | The creature doesn't move or take actions\u2026","h":"When you cast this spell using a spell slot of 5th level or higher, the radius of the sphere increases by 5 feet for each slot level above 4th.","v":"wis","hf":0},{"n":"Conjure Animals","l":3,"s":"Conj","c":["druid","ranger"],"t":"1 action","g":"60 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You summon fey spirits that take the form of beasts and appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears: - One beast of challenge rating 2 or lower - Two beasts of challenge rating 1 or lower - Four beasts of challenge rating 1/2 or lower - Eight beasts of challenge rating 1/4 or lower - Each beast is also considered fey, and it disappears when it drops to 0 hit points or when the spell ends. The summoned creatures are friendly to you and your companions. Roll initiative for the summoned creatures as a group, which has its own turns. They obey any verbal commands that you issue to them (no action required by you). If\u2026","h":"When you cast this spell using certain higher-level spell slots, you choose one of the summoning options above, and more creatures appear: twice as many with a 5th-level slot, three times as many with a 7th-level."},{"n":"Conjure Celestial","l":7,"s":"Conj","c":["cleric"],"t":"1 minute","g":"90 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You summon a celestial of challenge rating 4 or lower, which appears in an unoccupied space that you can see within range. The celestial disappears when it drops to 0 hit points or when the spell ends. The celestial is friendly to you and your companions for the duration. Roll initiative for the celestial, which has its own turns. It obeys any verbal commands that you issue to it (no action required by you), as long as they don't violate its alignment. If you don't issue any commands to the celestial, it defends itself from hostile creatures but otherwise takes no actions. The GM has the celestial's statistics.","h":"When you cast this spell using a 9th-level spell slot, you summon a celestial of challenge rating 5 or lower."},{"n":"Conjure Elemental","l":5,"s":"Conj","c":["druid","wizard"],"t":"1 minute","g":"90 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You call forth an elemental servant. Choose an area of air, earth, fire, or water that fills a 10-foot cube within range. An elemental of challenge rating 5 or lower appropriate to the area you chose appears in an unoccupied space within 10 feet of it. For example, a fire elemental emerges from a bonfire, and an earth elemental rises up from the ground. The elemental disappears when it drops to 0 hit points or when the spell ends. The elemental is friendly to you and your companions for the duration. Roll initiative for the elemental, which has its own turns. It obeys any verbal commands that you issue to it (no action required by you). If you don't issue any commands to the\u2026","h":"When you cast this spell using a spell slot of 6th level or higher, the challenge rating increases by 1 for each slot level above 5th."},{"n":"Conjure Fey","l":6,"s":"Conj","c":["druid","warlock"],"t":"1 minute","g":"90 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You summon a fey creature of challenge rating 6 or lower, or a fey spirit that takes the form of a beast of challenge rating 6 or lower. It appears in an unoccupied space that you can see within range. The fey creature disappears when it drops to 0 hit points or when the spell ends. The fey creature is friendly to you and your companions for the duration. Roll initiative for the creature, which has its own turns. It obeys any verbal commands that you issue to it (no action required by you), as long as they don't violate its alignment. If you don't issue any commands to the fey creature, it defends itself from hostile creatures but otherwise takes no actions. If your concentration\u2026","h":"When you cast this spell using a spell slot of 7th level or higher, the challenge rating increases by 1 for each slot level above 6th."},{"n":"Conjure Minor Elementals","l":4,"s":"Conj","c":["druid","wizard"],"t":"1 minute","g":"90 feet","u":"Up to 1 hour","m":"VS","k":1,"r":0,"x":"You summon elementals that appear in unoccupied spaces that you can see within range. You choose one the following options for what appears: - One elemental of challenge rating 2 or lower - Two elementals of challenge rating 1 or lower - Four elementals of challenge rating 1/2 or lower - Eight elementals of challenge rating 1/4 or lower. An elemental summoned by this spell disappears when it drops to 0 hit points or when the spell ends. The summoned creatures are friendly to you and your companions. Roll initiative for the summoned creatures as a group, which has its own turns. They obey any verbal commands that you issue to them (no action required by you). If you don't issue any\u2026","h":"When you cast this spell using certain higher-level spell slots, you choose one of the summoning options above, and more creatures appear: twice as many with a 6th-level slot and three times as many with an 8th-level slot."},{"n":"Conjure Woodland Beings","l":4,"s":"Conj","c":["druid","ranger"],"t":"1 action","g":"60 feet","u":"Up to 1 hour","m":"VSM","k":1,"r":0,"x":"You summon fey creatures that appear in unoccupied spaces that you can see within range. Choose one of the following options for what appears: - One fey creature of challenge rating 2 or lower - Two fey creatures of challenge rating 1 or lower - Four fey creatures of challenge rating 1/2 or lower - Eight fey creatures of challenge rating 1/4 or lower A summoned creature disappears when it drops to 0 hit points or when the spell ends. The summoned creatures are friendly to you and your companions. Roll initiative for the summoned creatures as a group, which have their own turns. They obey any verbal commands that you issue to them (no action required by you). If you don't issue any\u2026","h":"When you cast this spell using certain higher-level spell slots, you choose one of the summoning options above, and more creatures appear: twice as many with a 6th-level slot and three times as many with an 8th-level slot."},{"n":"Contact Other Plane","l":5,"s":"Divi","c":["warlock","wizard"],"t":"1 minute","g":"Self","u":"1 minute","m":"V","k":0,"r":1,"x":"You mentally contact a demigod, the spirit of a long-dead sage, or some other mysterious entity from another plane. Contacting this extraplanar intelligence can strain or even break your mind. When you cast this spell, make a DC 15 intelligence saving throw. On a failure, you take 6d6 psychic damage and are insane until you finish a long rest. While insane, you can't take actions, can't understand what other creatures say, can't read, and speak only in gibberish. A greater restoration spell cast on you ends this effect. On a successful save, you can ask the entity up to five questions. You must ask your questions before the spell ends. The GM answers each question with one word,\u2026","v":"int","hf":0},{"n":"Contagion","l":5,"s":"Necr","c":["cleric","druid"],"t":"1 action","g":"Touch","u":"7 days","m":"VS","k":0,"r":0,"x":"Your touch inflicts disease. Make a melee spell attack against a creature within your reach. On a hit, you afflict the creature with a disease of your choice from any of the ones described below. At the end of each of the target's turns, it must make a constitution saving throw. After failing three of these saving throws, the disease's effects last for the duration, and the creature stops making these saves. After succeeding on three of these saving throws, the creature recovers from the disease, and the spell ends. Since this spell induces a natural disease in its target, any effect that removes a disease or otherwise ameliorates a disease's effects apply to it. ***Blinding\u2026","a":1,"v":"con","hf":0},{"n":"Contingency","l":6,"s":"Evoc","c":["wizard"],"t":"10 minutes","g":"Self","u":"10 days","m":"VSM","k":0,"r":0,"x":"Choose a spell of 5th level or lower that you can cast, that has a casting time of 1 action, and that can target you. You cast that spell--called the contingent spell--as part of casting contingency, expending spell slots for both, but the contingent spell doesn't come into effect. Instead, it takes effect when a certain circumstance occurs. You describe that circumstance when you cast the two spells. For example, a contingency cast with water breathing might stipulate that water breathing comes into effect when you are engulfed in water or a similar liquid. The contingent spell takes effect immediately after the circumstance is met for the first time, whether or not you want it\u2026"},{"n":"Continual Flame","l":2,"s":"Evoc","c":["cleric","wizard"],"t":"1 action","g":"Touch","u":"Until dispelled","m":"VSM","k":0,"r":0,"x":"A flame, equivalent in brightness to a torch, springs forth from an object that you touch. The effect looks like a regular flame, but it creates no heat and doesn't use oxygen. A continual flame can be covered or hidden but not smothered or quenched."},{"n":"Control Water","l":4,"s":"Tran","c":["cleric","druid","wizard"],"t":"1 action","g":"300 feet","u":"Up to 10 minutes","m":"VSM","k":1,"r":0,"x":"Until the spell ends, you control any freestanding water inside an area you choose that is a cube up to 100 feet on a side. You can choose from any of the following effects when you cast this spell. As an action on your turn, you can repeat the same effect or choose a different one. ***Flood.*** You cause the water level of all standing water in the area to rise by as much as 20 feet. If the area includes a shore, the flooding water spills over onto dry land. If you choose an area in a large body of water, you instead create a 20-foot tall wave that travels from one side of the area to the other and then crashes down. Any Huge or smaller vehicles in the wave's path are carried\u2026","v":"str","hf":1,"dt":"bludgeoning","d":"2d8"},{"n":"Control Weather","l":8,"s":"Tran","c":["cleric","druid","wizard"],"t":"10 minutes","g":"Self","u":"Up to 8 hours","m":"VSM","k":1,"r":0,"x":"You take control of the weather within 5 miles of you for the duration. You must be outdoors to cast this spell. Moving to a place where you don't have a clear path to the sky ends the spell early. When you cast the spell, you change the current weather conditions, which are determined by the GM based on the climate and season. You can change precipitation, temperature, and wind. It takes 1d4 x 10 minutes for the new conditions to take effect. Once they do so, you can change the conditions again. When the spell ends, the weather gradually returns to normal. When you change the weather conditions, find a current condition on the following tables and change its stage by one, up or\u2026"},{"n":"Counterspell","l":3,"s":"Abju","c":["sorcerer","warlock","wizard"],"t":"1 reaction","g":"60 feet","u":"Instantaneous","m":"S","k":0,"r":0,"x":"You attempt to interrupt a creature in the process of casting a spell. If the creature is casting a spell of 3rd level or lower, its spell fails and has no effect. If it is casting a spell of 4th level or higher, make an ability check using your spellcasting ability. The DC equals 10 + the spell's level. On a success, the creature's spell fails and has no effect.","h":"When you cast this spell using a spell slot of 4th level or higher, the interrupted spell has no effect if its level is less than or equal to the level of the spell slot you used."},{"n":"Create Food and Water","l":3,"s":"Conj","c":["cleric","druid","paladin"],"t":"1 action","g":"30 feet","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"You create 45 pounds of food and 30 gallons of water on the ground or in containers within range, enough to sustain up to fifteen humanoids or five steeds for 24 hours. The food is bland but nourishing, and spoils if uneaten after 24 hours. The water is clean and doesn't go bad."},{"n":"Create Undead","l":6,"s":"Necr","c":["cleric","warlock","wizard"],"t":"1 minute","g":"10 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You can cast this spell only at night. Choose up to three corpses of Medium or Small humanoids within range. Each corpse becomes a ghoul under your control. (The GM has game statistics for these creatures.) As a bonus action on each of your turns, you can mentally command any creature you animated with this spell if the creature is within 120 feet of you (if you control multiple creatures, you can command any or all of them at the same time, issuing the same command to each one). You decide what action the creature will take and where it will move during its next turn, or you can issue a general command, such as to guard a particular chamber or corridor. If you issue no commands,\u2026","h":"When you cast this spell using a 7th-level spell slot, you can animate or reassert control over four ghouls. When you cast this spell using an 8th-level spell slot, you can animate or reassert control over five ghouls or two ghasts or wights. When you cast this spell using a 9th-level spell slot, yo"},{"n":"Create or Destroy Water","l":1,"s":"Tran","c":["cleric","druid"],"t":"1 action","g":"30 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"You either create or destroy water. ***Create Water.*** You create up to 10 gallons of clean water within range in an open container. Alternatively, the water falls as rain in a 30-foot cube within range. ***Destroy Water.*** You destroy up to 10 gallons of water in an open container within range. Alternatively, you destroy fog in a 30-foot cube within range.","h":"When you cast this spell using a spell slot of 2nd level or higher, you create or destroy 10 additional gallons of water, or the size of the cube increases by 5 feet, for each slot level above 1st."},{"n":"Creation","l":5,"s":"Illu","c":["sorcerer","wizard"],"t":"1 minute","g":"30 feet","u":"Special","m":"VSM","k":0,"r":0,"x":"You pull wisps of shadow material from the Shadowfell to create a nonliving object of vegetable matter within range: soft goods, rope, wood, or something similar. You can also use this spell to create mineral objects such as stone, crystal, or metal. The object created must be no larger than a 5-foot cube, and the object must be of a form and material that you have seen before. The duration depends on the object's material. If the object is composed of multiple materials, use the shortest duration. | Material | Duration | |---|---| | Vegetable matter | 1 day | | Stone or crystal | 12 hours | | Precious metals | 1 hour | | Gems | 10 minutes | | Adamantine or mithral | 1 minute |\u2026","h":"When you cast this spell using a spell slot of 6th level or higher, the cube increases by 5 feet for each slot level above 5th."},{"n":"Cure Wounds","l":1,"s":"Evoc","c":["bard","cleric","druid","paladin","ranger"],"t":"1 action","g":"Touch","u":"Instantaneous","m":"VS","k":0,"r":0,"x":"A creature you touch regains a number of hit points equal to 1d8 + your spellcasting ability modifier. This spell has no effect on undead or constructs.","h":"When you cast this spell using a spell slot of 2nd level or higher, the healing increases by 1d8 for each slot level above 1st.","dt":"healing","am":1,"d":"1d8","up":"1d8"},{"n":"Dancing Lights","l":0,"s":"Evoc","c":["bard","sorcerer","wizard"],"t":"1 action","g":"120 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"You create up to four torch-sized lights within range, making them appear as torches, lanterns, or glowing orbs that hover in the air for the duration. You can also combine the four lights into one glowing vaguely humanoid form of Medium size. Whichever form you choose, each light sheds dim light in a 10-foot radius. As a bonus action on your turn, you can move the lights up to 60 feet to a new spot within range. A light must be within 20 feet of another light created by this spell, and a light winks out if it exceeds the spell's range."},{"n":"Darkness","l":2,"s":"Evoc","c":["sorcerer","warlock","wizard"],"t":"1 action","g":"60 feet","u":"Up to 10 minutes","m":"VM","k":1,"r":0,"x":"Magical darkness spreads from a point you choose within range to fill a 15-foot-radius sphere for the duration. The darkness spreads around corners. A creature with darkvision can't see through this darkness, and nonmagical light can't illuminate it. If the point you choose is on an object you are holding or one that isn't being worn or carried, the darkness emanates from the object and moves with it. Completely covering the source of the darkness with an opaque object, such as a bowl or a helm, blocks the darkness. If any of this spell's area overlaps with an area of light created by a spell of 2nd level or lower, the spell that created the light is dispelled."},{"n":"Darkvision","l":2,"s":"Tran","c":["druid","ranger","sorcerer","wizard"],"t":"1 action","g":"Touch","u":"8 hours","m":"VSM","k":0,"r":0,"x":"You touch a willing creature to grant it the ability to see in the dark. For the duration, that creature has darkvision out to a range of 60 feet."},{"n":"Daylight","l":3,"s":"Evoc","c":["cleric","druid","paladin","ranger","sorcerer"],"t":"1 action","g":"60 feet","u":"1 hour","m":"VS","k":0,"r":0,"x":"A 60-foot-radius sphere of light spreads out from a point you choose within range. The sphere is bright light and sheds dim light for an additional 60 feet. If you chose a point on an object you are holding or one that isn't being worn or carried, the light shines from the object and moves with it. Completely covering the affected object with an opaque object, such as a bowl or a helm, blocks the light. If any of this spell's area overlaps with an area of darkness created by a spell of 3rd level or lower, the spell that created the darkness is dispelled."},{"n":"Death Ward","l":4,"s":"Abju","c":["cleric","paladin"],"t":"1 action","g":"Touch","u":"8 hours","m":"VS","k":0,"r":0,"x":"You touch a creature and grant it a measure of protection from death. The first time the target would drop to 0 hit points as a result of taking damage, the target instead drops to 1 hit point, and the spell ends. If the spell is still in effect when the target is subjected to an effect that would kill it instantaneously without dealing damage, that effect is instead negated against the target, and the spell ends."},{"n":"Delayed Blast Fireball","l":7,"s":"Evoc","c":["sorcerer","wizard"],"t":"1 action","g":"150 feet","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"A beam of yellow light flashes from your pointing finger, then condenses to linger at a chosen point within range as a glowing bead for the duration. When the spell ends, either because your concentration is broken or because you decide to end it, the bead blossoms with a low roar into an explosion of flame that spreads around corners. Each creature in a 20-foot-radius sphere centered on that point must make a dexterity saving throw. A creature takes fire damage equal to the total accumulated damage on a failed save, or half as much damage on a successful one. The spell's base damage is 12d6. If at the end of your turn the bead has not yet detonated, the damage increases by 1d6.\u2026","h":"When you cast this spell using a spell slot of 8th level or higher, the base damage increases by 1d6 for each slot level above 7th.","v":"dex","hf":1,"dt":"fire","d":"12d6","up":"1d6"},{"n":"Demiplane","l":8,"s":"Conj","c":["warlock","wizard"],"t":"1 action","g":"60 feet","u":"1 hour","m":"S","k":0,"r":0,"x":"You create a shadowy door on a flat solid surface that you can see within range. The door is large enough to allow Medium creatures to pass through unhindered. When opened, the door leads to a demiplane that appears to be an empty room 30 feet in each dimension, made of wood or stone. When the spell ends, the door disappears, and any creatures or objects inside the demiplane remain trapped there, as the door also disappears from the other side. Each time you cast this spell, you can create a new demiplane, or have the shadowy door connect to a demiplane you created with a previous casting of this spell. Additionally, if you know the nature and contents of a demiplane created by a\u2026"},{"n":"Detect Evil and Good","l":1,"s":"Divi","c":["cleric","paladin"],"t":"1 action","g":"Self","u":"Up to 10 minutes","m":"VS","k":1,"r":0,"x":"For the duration, you know if there is an aberration, celestial, elemental, fey, fiend, or undead within 30 feet of you, as well as where the creature is located. Similarly, you know if there is a place or object within 30 feet of you that has been magically consecrated or desecrated. The spell can penetrate most barriers, but it is blocked by 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt."},{"n":"Detect Magic","l":1,"s":"Divi","c":["bard","cleric","druid","paladin","ranger","sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 10 minutes","m":"VS","k":1,"r":1,"x":"For the duration, you sense the presence of magic within 30 feet of you. If you sense magic in this way, you can use your action to see a faint aura around any visible creature or object in the area that bears magic, and you learn its school of magic, if any. The spell can penetrate most barriers, but it is blocked by 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt."},{"n":"Detect Poison and Disease","l":1,"s":"Divi","c":["cleric","druid","paladin","ranger"],"t":"1 action","g":"Self","u":"Up to 10 minutes","m":"VSM","k":1,"r":1,"x":"For the duration, you can sense the presence and location of poisons, poisonous creatures, and diseases within 30 feet of you. You also identify the kind of poison, poisonous creature, or disease in each case. The spell can penetrate most barriers, but it is blocked by 1 foot of stone, 1 inch of common metal, a thin sheet of lead, or 3 feet of wood or dirt."},{"n":"Detect Thoughts","l":2,"s":"Divi","c":["bard","sorcerer","wizard"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"For the duration, you can read the thoughts of certain creatures. When you cast the spell and as your action on each turn until the spell ends, you can focus your mind on any one creature that you can see within 30 feet of you. If the creature you choose has an Intelligence of 3 or lower or doesn't speak any language, the creature is unaffected. You initially learn the surface thoughts of the creature - what is most on its mind in that moment. As an action, you can either shift your attention to another creature's thoughts or attempt to probe deeper into the same creature's mind. If you probe deeper, the target must make a Wisdom saving throw. If it fails, you gain insight into\u2026"},{"n":"Dimension Door","l":4,"s":"Conj","c":["bard","sorcerer","warlock","wizard"],"t":"1 action","g":"500 feet","u":"Instantaneous","m":"V","k":0,"r":0,"x":"You teleport yourself from your current location to any other spot within range. You arrive at exactly the spot desired. It can be a place you can see, one you can visualize, or one you can describe by stating distance and direction, such as \"200 feet straight downward\" or \"upward to the northwest at a 45-degree angle, 300 feet.\" You can bring along objects as long as their weight doesn't exceed what you can carry. You can also bring one willing creature of your size or smaller who is carrying gear up to its carrying capacity. The creature must be within 5 feet of you when you cast this spell. If you would arrive in a place already occupied by an object or a creature, you and any\u2026","dt":"force","d":"4d6"},{"n":"Disguise Self","l":1,"s":"Illu","c":["bard","sorcerer","wizard"],"t":"1 action","g":"Self","u":"1 hour","m":"VS","k":0,"r":0,"x":"You make yourself--including your clothing, armor, weapons, and other belongings on your person--look different until the spell ends or until you use your action to dismiss it. You can seem 1 foot shorter or taller and can appear thin, fat, or in between. You can't change your body type, so you must adopt a form that has the same basic arrangement of limbs. Otherwise, the extent of the illusion is up to you. The changes wrought by this spell fail to hold up to physical inspection. For example, if you use this spell to add a hat to your outfit, objects pass through the hat, and anyone who touches it would feel nothing or would feel your head and hair. If you use this spell to\u2026"},{"n":"Disintegrate","l":6,"s":"Tran","c":["sorcerer","wizard"],"t":"1 action","g":"60 feet","u":"Instantaneous","m":"VSM","k":0,"r":0,"x":"A thin green ray springs from your pointing finger to a target that you can see within range. The target can be a creature, an object, or a creation of magical force, such as the wall created by wall of force. A creature targeted by this spell must make a dexterity saving throw. On a failed save, the target takes 10d6 + 40 force damage. If this damage reduces the target to 0 hit points, it is disintegrated. A disintegrated creature and everything it is wearing and carrying, except magic items, are reduced to a pile of fine gray dust. The creature can be restored to life only by means of a true resurrection or a wish spell. This spell automatically disintegrates a Large or smaller\u2026","h":"When you cast this spell using a spell slot of 7th level or higher, the damage increases by 3d6 for each slot level above 6th.","v":"dex","hf":0,"dt":"force","d":"10d6 + 40"},{"n":"Dispel Evil and Good","l":5,"s":"Abju","c":["cleric","paladin"],"t":"1 action","g":"Self","u":"Up to 1 minute","m":"VSM","k":1,"r":0,"x":"Shimmering energy surrounds and protects you from fey, undead, and creatures originating from beyond the Material Plane. For the duration, celestials, elementals, fey, fiends, an
