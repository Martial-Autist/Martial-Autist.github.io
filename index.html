<!DOCTYPE html>
<html lang="en" data-edition="store">
<head>
<meta charset="utf-8" data-keep>
<meta name="viewport" content="width=device-width, initial-scale=1" data-keep>
<meta name="description" content="A free, homebrew-friendly living character sheet for 5e. Tap to roll, track slots and resources, multiclass, and add anything your DM gives you." data-keep>
<meta name="theme-color" content="#14110f" data-keep>
<link rel="manifest" href="manifest.webmanifest" data-keep>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" data-keep>
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" data-keep>
<title data-keep>Living Character Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" data-keep>
<style data-keep>
:root{
  --bg:#14110f; --panel:#1e1a17; --panel2:#272220; --line:#3a332e; --ink:#efe6da; --mute:#a89a8a;
  --acc:#c0392b; --acc2:#e0a84f; --good:#5aa36a; --bad:#d9534f; --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px;width:100%}
textarea{min-height:70px;resize:vertical}
h1,h2,h3{font-family:Cinzel,serif;margin:0}
.wrap{max-width:760px;margin:0 auto;padding:0 12px 90px}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:10px 12px 6px;max-width:760px;margin:0 auto}
.toprow{display:flex;align-items:center;gap:10px}
.toprow .who{flex:1;min-width:0}
.toprow h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mute);font-size:13px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.btn.pri{background:var(--acc);border-color:var(--acc)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--bad);color:#ffb3b0}
.btn[disabled]{opacity:.35;cursor:default}
.save.dirty{background:var(--acc2);border-color:var(--acc2);color:#1b1208;font-weight:700}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 4px;font-size:13px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);font-weight:700}
.adv{display:flex;gap:4px;margin-top:6px}
.adv button{flex:1;padding:5px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12px}
.adv button.on.n{background:var(--panel2);border-color:var(--mute)}
.adv button.on.a{background:var(--good);border-color:var(--good);color:#071}
.adv button.on.a{color:#04140a;font-weight:700}
.adv button.on.d{background:var(--bad);border-color:var(--bad);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-top:10px}
.card h2{font-size:15px;color:var(--acc2);margin-bottom:8px;letter-spacing:.5px}
.grid{display:grid;gap:8px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g6{grid-template-columns:repeat(3,1fr)}
@media(min-width:560px){.g6{grid-template-columns:repeat(6,1fr)}}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stat .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.stat .v{font-size:22px;font-weight:700}
.stat .s{font-size:12px;color:var(--mute)}
button.stat:active,.row:active{transform:scale(.98)}
.row{display:flex;align-items:center;gap:8px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;text-align:left}
.row .nm{flex:1;min-width:0}
.row .bn{font-weight:700;min-width:36px;text-align:right}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--mute);flex:none}
.dot.p{background:var(--mute)}
.dot.e{background:var(--acc2);border-color:var(--acc2)}
.cols2{columns:2;column-gap:8px}
.cols2 .row{break-inside:avoid}
@media(max-width:420px){.cols2{columns:1}}
.hp{display:flex;align-items:center;gap:10px}
.hp .big{font-size:34px;font-weight:700}
.hp .big small{font-size:16px;color:var(--mute);font-weight:500}
.bar{height:8px;border-radius:5px;background:var(--panel2);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--good)}
.hpctl{display:flex;gap:6px}
.hpctl input{width:80px;flex:none;text-align:center}
.res{display:flex;align-items:center;gap:6px;margin-top:6px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.res .nm{flex:1}
.res .ct{font-weight:700;min-width:44px;text-align:center}
.pips{display:flex;gap:5px;flex-wrap:wrap}
.pip{width:22px;height:22px;border-radius:50%;border:2px solid var(--acc2);background:var(--acc2);padding:0}
.pip.used{background:transparent;border-color:var(--line)}
.slotrow{display:flex;align-items:center;gap:10px;margin-top:6px}
.slotrow .lv{width:34px;color:var(--mute);font-size:13px}
.spell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.spell .t{display:flex;align-items:center;gap:8px}
.spell .t b{flex:1}
.meta{color:var(--mute);font-size:12.5px;margin-top:3px}
.note{color:var(--mute);font-size:13px;margin-top:4px;white-space:pre-wrap}
.lvhead{margin-top:12px;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:1px}
.tag{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:20px;background:#3a2a20;color:var(--acc2);margin:4px 4px 0 0}
.f{display:block;margin-top:8px}
.f>span{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.chk input{width:auto}
.ed{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.ed .hd{display:flex;gap:8px;align-items:center}
.ed .hd b{flex:1}
.effrow{display:flex;gap:6px;margin-top:6px}
.effrow select{flex:1}
.effrow input{width:80px;flex:none}
.effrow input,.effrow select{min-width:0}
.effbox{border-top:1px dashed var(--line);padding-top:6px;margin-top:6px}
.hint{color:var(--mute);font-size:12.5px;margin-top:6px}
.switch{position:relative;width:42px;height:24px;border-radius:12px;background:var(--line);border:none;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink);transition:.15s}
.switch.on{background:var(--good)}
.switch.on::after{left:21px}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
#sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:760px;padding:16px 16px 26px;max-height:85vh;overflow:auto}
#sheet h3{font-size:18px;margin-bottom:6px}
.rl{display:flex;align-items:baseline;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.rl:first-of-type{border-top:none}
.rl .lab{flex:1;color:var(--mute);text-transform:capitalize}
.rl .val{font-size:30px;font-weight:700}
.rl .det{font-size:12px;color:var(--mute)}
.rl.crit .val{color:var(--acc2)}
.rl.fumble .val{color:var(--bad)}
.slotpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slotpick button{padding:12px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.slotpick button small{display:block;color:var(--mute);font-size:11.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:6px 12px;font-size:13.5px;text-align:left}
.chip small{display:block;color:var(--mute);font-size:11px}
.chip.on{background:var(--acc2);border-color:var(--acc2);color:#1b1208;font-weight:600}
.chip.on small{color:#4a3510}
.fab{position:fixed;right:16px;bottom:18px;width:56px;height:56px;border-radius:50%;border:none;background:var(--acc);font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:10}
.stepper{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stepper>div{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
.stepper b{font-size:20px;min-width:34px}
.dicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.dicegrid button{padding:14px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px;font-weight:700}
.dicegrid button small{display:block;font-size:11px;color:var(--mute);font-weight:400}
.dicegrid .ad{border-color:var(--good)} .dicegrid .dd{border-color:var(--bad)}
.libg{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.libg .hd{display:flex;align-items:center;gap:8px}.libg .hd b{flex:1;font-family:Cinzel,serif;color:var(--acc2)}
.libi{display:flex;align-items:center;gap:8px;padding:6px 0}.libi>span:first-child{flex:1}
.lvbig{margin-top:12px;padding:10px;border-radius:10px;background:var(--panel2);text-align:center}
.lvbig b{font-size:22px;color:var(--acc2)}
.pip.pact{border-color:#8e6cc0;background:#8e6cc0}.pip.pact.used{background:transparent;border-color:var(--line)}
.charcard{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin-top:10px}
.charcard.on{border-color:var(--acc2)}
.charcard .ci{flex:1;min-width:0}.charcard .ci b{font-family:Cinzel,serif}
.thumb.ph{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--acc);font-weight:700;flex:none}
.charbtns{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.tabs button{flex:1 0 auto;padding:7px 9px}
.footer{text-align:center;color:var(--mute);font-size:12px;margin:36px 0 10px;opacity:.7;line-height:1.8}
.linkish{background:none;border:none;color:var(--mute);font-size:12px;padding:2px 4px;text-decoration:underline dotted;cursor:pointer}
.potedit{margin:4px 0 8px;padding:6px 10px;border:1px dashed var(--line);border-radius:10px}
.potedit summary{cursor:pointer;color:var(--mute);font-size:13px}
img.thumb{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--acc2);cursor:pointer;flex:none}
img.portrait{max-width:100%;max-height:420px;border-radius:12px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;z-index:30;display:none;max-width:90vw}
.log .row{display:block}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
</style>
</head>
<body>
<div id="app" data-keep></div>
<div id="sheet" data-keep></div>
<div id="toast" data-keep></div>
<script type="application/json" id="saved" data-keep>null</script>
<script data-keep>
(function(){
const SRC = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const EDITION = document.documentElement.getAttribute('data-edition')||'personal';
const IS_TWA = (()=>{ try{ if(document.referrer.startsWith('android-app://')) localStorage.setItem('ls5e:twa','1'); return localStorage.getItem('ls5e:twa')==='1'; }catch(e){ return false; } })();
const ABIL = ['str','dex','con','int','wis','cha'];
const ABN = {str:'STR',dex:'DEX',con:'CON',int:'INT',wis:'WIS',cha:'CHA'};
const SKILLS = [['Acrobatics','dex'],['Animal Handling','wis'],['Arcana','int'],['Athletics','str'],['Deception','cha'],['History','int'],['Insight','wis'],['Intimidation','cha'],['Investigation','int'],['Medicine','wis'],['Nature','int'],['Perception','wis'],['Performance','cha'],['Persuasion','cha'],['Religion','int'],['Sleight of Hand','dex'],['Stealth','dex'],['Survival','wis']];
const TARGETS = [['ac','AC'],['hpMax','Max HP'],['speed','Speed'],['init','Initiative'],['prof','Proficiency bonus'],['spellDC','Spell save DC'],['spellAtk','Spell attack bonus'],['spellDmg','Spell damage'],['atk','Weapon attack bonus'],['dmg','Weapon damage'],['allSaves','All saving throws'],['allChecks','All skill checks']]
  .concat(ABIL.map(a=>['score:'+a,ABN[a]+' score']))
  .concat(ABIL.map(a=>['setscore:'+a,ABN[a]+' becomes (e.g. giant strength)']))
  .concat(ABIL.map(a=>['save:'+a,ABN[a]+' save']))
  .concat(SKILLS.map(s=>['skill:'+s[0],s[0]+' check']));
const TNAME = Object.fromEntries(TARGETS);
/* ---------- classes & level up ---------- */
const CLASSES={Artificer:['d8','halfUp','int'],Barbarian:['d12','none',''],Bard:['d8','full','cha'],Cleric:['d8','full','wis'],Druid:['d8','full','wis'],Fighter:['d10','none',''],Monk:['d8','none',''],Paladin:['d10','half','cha'],Ranger:['d10','half','wis'],Rogue:['d8','none',''],Sorcerer:['d6','full','cha'],Warlock:['d8','pact','cha'],Wizard:['d6','full','int']};
const CAST_OPT=[['none','No spell slots'],['full','Full caster'],['half','Half caster (Paladin, Ranger)'],['halfUp','Half, rounded up (Artificer)'],['third','Third caster (Eldritch Knight, Arcane Trickster)'],['pact','Pact Magic (Warlock)']];
const SLOT_TABLE=[[],[2],[3],[4,2],[4,3],[4,3,2],[4,3,3],[4,3,3,1],[4,3,3,2],[4,3,3,3,1],[4,3,3,3,2],[4,3,3,3,2,1],[4,3,3,3,2,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
const ASI_LV={Fighter:[4,6,8,12,14,16,19],Rogue:[4,8,10,12,16,19]};
const asiLevels=n=>ASI_LV[n]||[4,8,12,16,19];
function hdPools(){ const m={}; S.classes.forEach(c=>{ const k=c.hd||'d8'; m[k]=(m[k]||0)+(Number(c.level)||0); });
  return Object.keys(m).sort((a,b)=>Number(b.slice(1))-Number(a.slice(1))).map(k=>({die:k,max:m[k],used:Math.min(m[k],Number(S.hdUsed[k])||0)})); }
const totalLevel=cl=>(cl||S.classes).reduce((a,c)=>a+(Number(c.level)||0),0);
const profFor=L=>2+Math.floor((Math.max(1,L)-1)/4);
const clsText=cl=>(cl||S.classes).map(c=>(c.name||'Class')+((cl||S.classes).length>1?' '+c.level:'')+(c.sub?' ('+c.sub+')':'')).join(' / ');
function casterLevel(cl){
  const casters=cl.filter(c=>['full','half','halfUp','third'].includes(c.cast));
  if(casters.length===1){ const c=casters[0], l=Number(c.level)||0;
    return c.cast==='full'?l:c.cast==='halfUp'?Math.ceil(l/2):c.cast==='half'?(l<2?0:Math.ceil(l/2)):(l<3?0:Math.ceil(l/3)); }
  return casters.reduce((a,c)=>{ const l=Number(c.level)||0; return a+(c.cast==='full'?l:c.cast==='halfUp'?Math.ceil(l/2):c.cast==='half'?Math.floor(l/2):Math.floor(l/3)); },0);
}
function slotsFor(cl){ const row=SLOT_TABLE[Math.min(20,casterLevel(cl))]||[]; const o={}; for(let i=1;i<=9;i++) o[i]=row[i-1]||0; return o; }
function pactFor(cl){ const w=cl.filter(c=>c.cast==='pact').reduce((a,c)=>a+(Number(c.level)||0),0); if(!w) return {level:0,max:0};
  return {level:Math.min(5,Math.ceil(w/2)),max:w>=17?4:w>=11?3:w>=2?2:1}; }
function syncClasses(){ S.level=totalLevel(); S.cls=clsText(); }
const SAVES={Artificer:['con','int'],Barbarian:['str','con'],Bard:['dex','cha'],Cleric:['wis','cha'],Druid:['int','wis'],Fighter:['str','con'],Monk:['str','dex'],Paladin:['wis','cha'],Ranger:['str','dex'],Rogue:['dex','int'],Sorcerer:['con','cha'],Warlock:['wis','cha'],Wizard:['int','wis']};
const whoLine=()=>S.classes.length?esc(S.cls)+' · Level '+S.level:'No class yet — tap ⬆ Level up';
function resSuggest(r,cl,L){
  const lv=n=>cl.filter(c=>(c.name||'').toLowerCase()===n).reduce((a,c)=>a+(Number(c.level)||0),0);
  const n=(r.name||'').toLowerCase();
  if(n==='hit dice') return L;
  if(n==='lay on hands'&&lv('paladin')) return 5*lv('paladin');
  if(n==='arcane ward'&&lv('wizard')>=2) return 2*lv('wizard')+am('int');
  if(n==='arcane recovery') return 1;
  if(n.startsWith('sorcery')&&lv('sorcerer')>=2) return lv('sorcerer');
  if(n.startsWith('ki')&&lv('monk')>=2) return lv('monk');
  if(n==='rages'&&lv('barbarian')){ const b=lv('barbarian'); return b>=20?99:b>=17?6:b>=12?5:b>=6?4:b>=3?3:2; }
  if(n.startsWith('superiority')&&lv('fighter')>=3){ const f=lv('fighter'); return f>=15?6:f>=7?5:4; }
  if(n==='action surge'&&lv('fighter')>=2) return lv('fighter')>=17?2:1;
  if(n.startsWith('bardic')) return Math.max(1,am('cha'));
  if(n==='channel divinity'){ const c=lv('cleric'); return Math.max(c>=18?3:c>=6?2:c>=2?1:0, lv('paladin')>=3?1:0)||r.max; }
  return null;
}
const CLASS_RES=[['Barbarian',1,'rage'],['Bard',1,'bi'],['Cleric',2,'cd'],['Druid',2,'wild'],['Fighter',1,'sw'],['Fighter',2,'as'],['Monk',2,'ki'],['Paladin',1,'loh'],['Paladin',3,'cd'],['Sorcerer',2,'sorc'],['Wizard',1,'arec'],['Wizard',2,'ward',c=>/abjur/i.test(c.sub||'')]];
function newResFor(cl){ const out=[]; CLASS_RES.forEach(([cn,lv,key,cond])=>{ const c=cl.find(x=>(x.name||'').toLowerCase()===cn.toLowerCase()); if(!c||Number(c.level)<lv||(cond&&!cond(c))) return;
  const name=LR[key][0]; if(S.resources.some(r=>(r.name||'').toLowerCase()===name.toLowerCase())||out.some(o=>o.key===key)) return; out.push({key,name}); }); return out; }
const LU_TIPS=[['Sorcerer',3,'Choose 2 Metamagic options — Setup → 📚 Add from library'],['Sorcerer',10,'One more Metamagic option'],['Sorcerer',17,'One more Metamagic option'],['Fighter',3,'Battle Master? Add maneuvers from the library'],['Monk',2,'Ki options are in the library'],['Barbarian',1,'Rage is in the library'],['Paladin',2,'Divine Smite is in the library']];
/* ---------- tip jar (quiet) ---------- */
const KOFI_URL='https://ko-fi.com/martialautist';                       // set to your Ko-fi page, e.g. https://ko-fi.com/yourname
const TIP_IDS=['tip_small','tip_medium','tip_large']; // in-app product IDs to create in Play Console
const TIP_NAMES={tip_small:'A coffee',tip_medium:'Coffee and a snack',tip_large:'A round for the table'};
let dgs=null;
async function playBilling(){ if(dgs) return dgs; if(!('getDigitalGoodsService' in window)) return null;
  try{ dgs=await window.getDigitalGoodsService('https://play.google.com/billing'); return dgs; }catch(e){ return null; } }
async function openCoffee(){
  let h='<h3>☕ Thanks for finding this</h3><div class="sub">This sheet is free and always will be. If it\'s made your table a bit easier, a coffee keeps the dev going.</div>';
  const svc=await playBilling();
  if(svc){ let items=[]; try{ items=await svc.getDetails(TIP_IDS); }catch(e){}
    items.sort((a,b)=>TIP_IDS.indexOf(a.itemId)-TIP_IDS.indexOf(b.itemId));
    h+=items.length?'<div class="grid" style="margin-top:12px">'+items.map(it=>'<button class="btn" data-act="tip" data-id="'+esc(it.itemId)+'">'+esc(TIP_NAMES[it.itemId]||it.title)+' — '+esc(new Intl.NumberFormat(undefined,{style:'currency',currency:it.price.currency}).format(Number(it.price.value)))+'</button>').join('')+'</div>'
      :'<div class="hint">Tips aren\'t available right now.</div>';
  } else if(IS_TWA){ h+='<div class="hint" style="margin-top:12px">Tips aren\'t available right now — but thanks for looking.</div>'; }
  else if(KOFI_URL){ h+='<a class="btn pri" style="display:block;text-align:center;margin-top:12px;text-decoration:none;color:inherit" href="'+esc(KOFI_URL)+'" target="_blank" rel="noopener">Buy me a coffee on Ko-fi</a><div class="hint">Opens Ko-fi in your browser. Link: '+esc(KOFI_URL)+'</div>'; }
  else h+='<div class="hint" style="margin-top:12px">The tip jar isn\'t set up yet — but thanks for looking.</div>';
  h+='<button class="btn ghost" style="width:100%;margin-top:10px" data-act="close">Close</button>';
  openSheet(h);

async function buyTip(sku){

function syncClassResources(){
  if(!S||!S.classes) return false; if(!S.resDismissed) S.resDismissed={};
  const cl=S.classes; let changed=false;
  RES_DEFS.forEach(d=>{
    if(!d.when(cl)) return;
    let r=S.resources.find(x=>x.auto===d.key)||S.resources.find(x=>!x.auto&&String(x.name||'').trim().toLowerCase()===d.name.toLowerCase());
    if(!r){ if(S.resDismissed[d.key]) return; const mx=d.max(cl); r={id:uid(),name:d.name,max:mx,cur:mx,reset:d.reset,die:d.die?d.die(cl):'',auto:d.key}; S.resources.push(r); changed=true; return; }
    if(!r.auto){ r.auto=d.key; r.reset=d.reset; if(d.die&&!r.die) r.die=d.die(cl); changed=true; }
    if(r.autoMax!==false){ const mx=d.max(cl); if(mx!==r.max){ const diff=mx-r.max; r.max=mx; r.cur=Math.max(0,Math.min(mx,r.cur+Math.max(0,diff))); changed=true; } }
    if(d.die&&r.autoDie!==false){ const dd=d.die(cl); if(dd!==r.die){ r.die=dd; changed=true; } }
  });
  return changed;
}

const armorSlow = ()=>{ const a=S.armor; return a&&a.type!=='manual'&&Number(a.str)>0&&score('str')<Number(a.str); };

const wDice = w=>{ let d=(w.twoHand&&w.vers)?w.vers:w.dmg; if(monkLv()&&isMonkWeapon(w)){ const m=martialDie(); const sz=x=>Number((String(x).match(/d(\d+)/)||[0,0])[1])||Number(x)||0; if(sz(m)>sz(d)) d=m; } return d; };

/* ---------- dice ---------- */
function d(n){ const a=new Uint32Array(1); crypto.getRandomValues(a); return 1+(a[0]%n); }
function parse(expr){
  const out={dice:[],flat:0}; const s=String(expr||'').toLowerCase().replace(/\s+/g,'');
  const re=/([+-]?)(\d*)d(\d+)|([+-]?)(\d+)/g; let m;
  while((m=re.exec(s))){ if(m[3]){ out.dice.push({n:Number(m[2]||1),s:Number(m[3]),sign:m[1]==='-'?-1:1}); } else if(m[5]){ out.flat+=(m[4]==='-'?-1:1)*Number(m[5]); } }
  return out;
}
function scale(expr,k,flats){
  const p=parse(expr); if(!p.dice.length&&!p.flat) return '';
  const parts=p.dice.map(x=>(x.sign<0?'-':'')+(x.n*k)+'d'+x.s);
  const f=flats?p.flat*k:p.flat; if(f) parts.push(String(f));
  return parts.join('+').replace(/\+-/g,'-');
}
function rollExpr(expr,crit,extra){
  const p=parse(expr); let total=0; const bits=[];
  p.dice.forEach(x=>{ const n=crit?x.n*2:x.n; const r=[]; for(let i=0;i<n;i++) r.push(d(x.s)); const sum=r.reduce((a,b)=>a+b,0)*x.sign; total+=sum; bits.push((x.sign<0?'-':'')+n+'d'+x.s+' ['+r.join(',')+']'); });
  const flat=p.flat+(extra||0); if(flat){ total+=flat; bits.push(sg(flat)); }
  return {total:Math.max(0,total),detail:bits.join(' ')};
}
function d20(b){
  const roll=()=>{ const r=d(20); if(r===1&&S.lucky){ const n=d(20); return {v:n,t:'1→'+n+' lucky'}; } return {v:r,t:String(r)}; };
  const A=roll(); const a=A.v; let nat=a, txt;
  if(adv!=='n'){ const C=roll(), c=C.v; nat=adv==='a'?Math.max(a,c):Math.min(a,c); txt=(adv==='a'?'Adv ':'Dis ')+'['+A.t+', '+C.t+'] '+sg(b); }
  else txt='d20 ['+A.t+'] '+sg(b);
  return {nat,total:nat+b,txt};
}

/* ---------- powers engine ---------- */
function calc(src){
  const t=String(src).match(/\d+(?:\.\d+)?|[a-z]+|>=|<=|==|[-+*/(),<>]/gi)||[]; let i=0;
  const peek=()=>t[i], next=()=>t[i++];
  const F={ceil:Math.ceil,floor:Math.floor,min:Math.min,max:Math.max,round:Math.round};
  function prim(){ const x=next(); if(x===undefined) return 0;
    if(x==='('){ const v=cmp(); next(); return v; } if(x==='-') return -prim(); if(x==='+') return prim();
    if(/^[a-z]+$/i.test(x)){ next(); const a=[cmp()]; while(peek()===','){ next(); a.push(cmp()); } next(); const f=F[x.toLowerCase()]; return f?f(...a):0; }
    return Number(x)||0; }
  function mul(){ let v=prim(); while(peek()==='*'||peek()==='/'){ const o=next(); const r=prim(); v=o==='*'?v*r:(r?v/r:0); } return v; }
  function add(){ let v=mul(); while(peek()==='+'||peek()==='-'){ const o=next(); const r=mul(); v=o==='+'?v+r:v-r; } return v; }
  function cmp(){ let v=add(); while(['>','<','>=','<=','=='].includes(peek())){ const o=next(); const r=add(); v=(o==='>'?v>r:o==='<'?v<r:o==='>='?v>=r:o==='<='?v<=r:v===r)?1:0; } return v; }
  try{ const v=cmp(); return isFinite(v)?v:0; }catch(e){ return 0; }
}
function martialDie(){ return S.level>=17?'1d10':S.level>=11?'1d8':S.level>=5?'1d6':'1d4'; }
const TOK=/\b(prof|level|lvl|slot|str|dex|con|int|wis|cha)\b/gi;
function expand(expr,ctx){
  let s=String(expr||''); if(!s.trim()) return '';
  const num={prof:prof(),level:S.level,lvl:S.level,slot:(ctx&&ctx.slot)||0}; ABIL.forEach(a=>num[a]=am(a));
  s=s.replace(/\{([^}]*)\}/g,(m,inner)=>String(Math.floor(calc(clsTok(inner).replace(TOK,k=>'('+num[k.toLowerCase()]+')')))));
  s=s.replace(/\bdie\b/gi,(ctx&&ctx.die)||'1d6').replace(/\bmartial\b/gi,martialDie()).replace(/\bsneak\b/gi,Math.ceil(S.level/2)+'d6');
  s=s.replace(TOK,k=>String(num[k.toLowerCase()]));
  return s.replace(/\s+/g,'').replace(/\+-/g,'-').replace(/--/g,'+');
}
function pCost(p,lv){ return p.costType==='level'?lv:p.costType==='levelMin1'?Math.max(1,lv):(Number(p.cost)||0); }
function pCostLabel(p){ if(p.res==='slot') return 'spell slot'; const r=S.resources.find(x=>x.id===p.res); if(!p.res||!r) return 'no cost';
  const c=p.costType==='fixed'?String(Number(p.cost)||0):p.costType==='level'?'spell level':'spell level (min 1)'; return c+' '+r.name; }
function pDC(p){ return p.dcType==='spell'?dcV():p.dcType==='fixed'?(Number(p.dcFixed)||10):8+prof()+am(p.dcStat||'str'); }
function lowestSlot(){ for(let L=1;L<=9;L++){ const s=S.slots[L]; if(s.max-s.used>0) return L; } return 0; }
function usePowers(ids,lv){
  const ps=ids.map(i=>S.powers.find(p=>p.id===i)).filter(Boolean);
  const need={}; let slotNeed=false;
  for(const p of ps){ if(p.res==='slot') slotNeed=true; else if(p.res){ need[p.res]=(need[p.res]||0)+pCost(p,lv); } }
  for(const id in need){ const r=S.resources.find(x=>x.id===id);
    if(!r){ toast('An option points at a resource that was deleted — fix it in Setup'); return null; }
    if(r.cur<need[id]){ toast('Not enough '+r.name+' (need '+need[id]+', have '+r.cur+')'); return null; } }
  let slotL=0; if(slotNeed){ slotL=lowestSlot(); if(!slotL){ toast('No spell slots left'); return null; } }
  for(const id in need) S.resources.find(x=>x.id===id).cur-=need[id];
  if(slotL) S.slots[slotL].used++;
  const out={dmg:[],hit:[],adv:false,lines:[],notes:[],left:[]};
  ps.forEach(p=>{
    const r=S.resources.find(x=>x.id===p.res); const ctx={die:(r&&r.die)||'1d6',slot:slotL};
    if(p.dmg){ const e=expand(p.dmg,ctx); if(e) out.dmg.push({e,label:p.rollLabel||p.name}); }
    if(p.hit){ const e=expand(p.hit,ctx); if(e) out.hit.push(e); }
    if(p.adv) out.adv=true;
    if(p.save) out.lines.push({label:p.name+': '+ABN[p.save]+' save',big:'DC '+pDC(p),detail:''});
    if(p.feat){ const f=S.features.find(x=>x.id===p.feat); if(f) f.active=true; }
    const cost=p.res==='slot'?'level '+slotL+' slot':r?'−'+pCost(p,lv)+' '+r.name:'';
    out.notes.push('• '+p.name+(cost?' ('+cost+')':'')+(p.note?': '+p.note:''));
  });
  for(const id in need){ const r=S.resources.find(x=>x.id===id); out.left.push(r.name+' left: '+r.cur+'/'+r.max); }
  if(slotL) out.left.push('Level '+slotL+' slots left: '+(S.slots[slotL].max-S.slots[slotL].used));
  if(ps.length) touch();
  return out;
}

  const xl=wx.concat(extraLines('dmg',w.id,crit,w.dmgType)).concat(u.dmg.map(x=>{ const r=rollExpr(x.e,crit,0); return {label:x.label,big:r.total,detail:r.detail,n:r.total}; }));
  const dm=rollExpr(expand(wDice(w),{}),crit,wFlat(w));
  const lines=[{label:'To hit',big:total,detail:txt+(crit?' — CRIT':''),cls:crit?'crit':r.nat===1?'fumble':''},

function usePower(p){

function resolveSpell(sp,L,how,ids){
  const base=Number(sp.level); const lv=L||base;
  const u=usePowers(ids||[],lv); if(!u) return;
  if(how==='slot'){ S.slots[L].used=Math.min(S.slots[L].max,S.slots[L].used+1); }
  if(how==='pact'){ S.pact.used=Math.min(S.pact.max,S.pact.used+1); }
  if(how==='perday'){ sp.freeUsed=Math.min(Number(sp.free)||0,(Number(sp.freeUsed)||0)+1); }
  if(how==='slot'||how==='perday'||how==='pact') touch();
  closeSheet();
  const lines=[]; let crit=false;
  if(sp.mode==='attack'){
    if(u.adv) adv=adv==='d'?'n':'a';
    const r=d20(atkFor(sp)); let total=r.total, txt=r.txt; crit=r.nat===20;
    if(u.hit.length){ const h=rollExpr(u.hit.join('+'),false,0); total+=h.total; txt+=' + '+h.detail; }
    lines.push({label:'Spell attack',big:total,detail:txt+(crit?' — CRIT':''),cls:crit?'crit':r.nat===1?'fumble':''}); }
  if(sp.mode==='save') lines.push({label:ABN[sp.saveStat]+' save',big:'DC '+dcFor(sp),detail:sp.halfOnSave?'Half damage on a success':''});
  let ex=sp.dmg||'';
  if(ex&&base===0&&sp.cantripScale) ex=scale(sp.dmg,tier(),false);
  if(ex&&base>0&&lv>base&&sp.upDice) ex+='+'+scale(sp.upDice,lv-base,true);
  u.dmg.forEach(x=>{ ex+=(ex?'+':'')+x.e; });
  if(ex){
    const heal=/heal/i.test(sp.dmgType||'');
    const r=rollExpr(ex,crit,(sp.addMod?spM(sp):0)+(heal?0:bonus('spellDmg')));
    lines.push({label:(sp.dmgType||'damage')+(crit?' (crit)':''),big:r.total,detail:r.detail});
    if(!heal){ const xl=extraLines('spellDmg','',crit,sp.dmgType); lines.push(...xl); if(xl.length) lines.push({label:'Total damage',big:r.total+xl.reduce((a,x)=>a+x.n,0),detail:'',cls:'crit'}); }
  }
  lines.push(...u.lines);
  if(!lines.length) lines.push({label:'Cast',big:'✓',detail:''});
  let foot='';
  if(base>0) foot+=(how==='pact'?'Pact slot used ('+(S.pact.max-S.pact.used)+'/'+S.pact.max+' left).':how==='slot'?'Level '+L+' slot used ('+(S.slots[L].max-S.slots[L].used)+' left).':how==='perday'?'Free cast used ('+(sp.free-sp.freeUsed)+'/'+sp.free+' left).':'No slot used.');
  showResult(sp.name+(base>0?' — level '+lv:''),lines,[foot,u.notes.join('\n'),u.left.join(' · '),sp.notes||''].filter(Boolean).join('\n'));
  if(tab==='spells'||tab==='play') render();
}
function rest(kind){
  S.resources.forEach(r=>{ if(r.reset==='short'||(kind==='long'&&r.reset==='long')) r.cur=r.max; });
  if(kind==='long'||S.pactShortRest) for(let i=1;i<=9;i++) S.slots[i].used=0;
  S.pact.used=0;
  if(kind==='long'){ S.hp=hpMaxV(); S.temp=0; S.spells.forEach(sp=>sp.freeUsed=0);
    const pools=hdPools(); let back=S.hdFullRest?Infinity:Math.max(1,Math.floor(totalLevel()/2));
    pools.forEach(p=>{ const g=Math.min(p.used,back); S.hdUsed[p.die]=p.used-g; back-=g; }); }
  touch(); render(); toast(kind==='long'?'Long rest: HP, slots and resources restored':'Short rest: short-rest resources restored');
}
function hpChange(kind){

/* ---------- binding ---------- */
function setPath(path,val){
  const k=path.split('.'); let o=S;
  for(let i=0;i<k.length-1;i++){ if(o[k[i]]==null) o[k[i]]={}; o=o[k[i]]; }
  o[k[k.length-1]]=val;
}
app.addEventListener('change',e=>{
  const el=e.target; if(el.id==='portraitIn'){ loadPortrait(el.files[0]); return; }
  if(el.id==='addPotSel'){ const v=el.value; if(!v) return; const ex=v!=='__custom'&&S.potions.find(x=>x.ptype===v); if(ex) ex.qty=(Number(ex.qty)||0)+1;
    else S.potions.push(v==='__custom'?{id:uid(),ptype:'',name:'Custom potion',qty:1,kind:'heal',dice:'2d4+2',dtype:'',save:'',dc:13,dur:'',note:'',fx:[]}:potionFromKey(v));
    touch(); render(); if(v==='__custom'){ const d=[...document.querySelectorAll('.potedit')].pop(); if(d) d.open=true; } return; }
  if(el.id==='addAtkSel'){ const v=el.value; if(!v) return; const n={id:uid(),name:'',ability:'str',prof:true,bonus:0,magic:0,dmg:'1d6',dmgType:'',addMod:true,notes:'',extra:[]};
    if(v!=='__custom') Object.assign(n,weaponTemplate(v)); S.attacks.push(n); touch(); render(); return; }
  if(el.id==='addResSel'){ const v=el.value; if(!v) return; if(v==='__custom') S.resources.push({id:uid(),name:'',max:1,cur:1,reset:'long',die:''}); else addResourceFromDef(v); touch(); render(); return; }
  const p=el.dataset&&el.dataset.bind; if(!p) return;
  let v=el.type==='checkbox'?el.checked:(el.dataset.num!==undefined?(el.value===''?0:Number(el.value)):el.value);
  const wt=p.match(/^attacks\.(\d+)\.wtype$/);
  if(wt){ const w=S.attacks[wt[1]]; const oldName=(WEAPONS[w.wtype]||[])[0]; if(v){ const t=weaponTemplate(v); if(w.name&&w.name!==oldName&&!Object.values(WEAPONS).some(x=>x[0]===w.name)) delete t.name; Object.assign(w,t); w.autoProf=true; } else { w.wtype=''; } touch(); render(); return; }
  if(p==='armor.type'){ applyArmor(v); touch(); render(); return; }
  if(/^attacks\.\d+\.prof$/.test(p)){ const w=S.attacks[p.split('.')[1]]; w.autoProf=false; }
  setPath(p,v);
  if(p==='hpMax'&&S.hp>hpMaxV()) S.hp=hpMaxV();
  if(p.startsWith('armor.')) el.setAttribute('data-rerender','');
  if(/^potions\.\d+\.kind$/.test(p)) el.setAttribute('data-rerender','');
  const m=p.match(/^resources\.(\d+)\.max$/); if(m){ const r=S.resources[m[1]]; if(r.auto){ r.autoMax=false; el.setAttribute('data-rerender',''); } if(r.cur>r.max) r.cur=r.max; }
  const md=p.match(/^resources\.(\d+)\.die$/); if(md){ const r=S.resources[md[1]]; if(r.auto) r.autoDie=false; }
  const ma=p.match(/^resources\.(\d+)\.autoMax$/); if(ma){ const r=S.resources[ma[1]]; if(r.autoMax){ r.autoDie=true; } el.setAttribute('data-rerender',''); }
  if(p.startsWith('classes.')||p.startsWith('abilities.')) el.setAttribute('data-rerender','');
  const sm=p.match(/^slots\.(\d+)\.max$/); if(sm){ const sl=S.slots[sm[1]]; if(sl.used>sl.max) sl.used=sl.max; }
  touch();
  if(el.hasAttribute('data-rerender')) render();
  if(p.startsWith('classes.')){ syncClasses(); }
  if(p==='name'||p==='cls'||p==='level'||p.startsWith('classes.')){ const w=app.querySelector('.who'); if(w) w.innerHTML='<h1>'+esc(S.name)+'</h1><div class="sub">'+whoLine()+'</div>'; }
});

let armed=null, armT;
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  if(b.hasAttribute('data-confirm')||b.dataset.act==='del'){
    if(armed!==b){ if(armed) armed.textContent=armed.dataset.orig; armed=b; b.dataset.orig=b.textContent; b.textContent='Tap again to confirm'; clearTimeout(armT); armT=setTimeout(()=>{ if(armed){ armed.textContent=armed.dataset.orig; armed=null; } },3000); return; }
    armed=null; clearTimeout(armT);
  }
  const A=b.dataset.act, id=b.dataset.id;
  switch(A){
    case 'close': closeSheet(); break;
    case 'tab': tab=b.dataset.t; render(); window.scrollTo(0,0); break;
    case 'adv': adv=b.dataset.v; document.querySelectorAll('.adv button').forEach(x=>x.classList.toggle('on',x.dataset.v===adv)); break;
    case 'save': saveSheet(); break;
    case 'init': check('Initiative',initV()); break;
    case 'abil': check(ABN[b.dataset.a]+' check',am(b.dataset.a)); break;
    case 'save1': check(ABN[b.dataset.a]+' save',saveB(b.dataset.a)); break;
    case 'skill': { const s=SKILLS.find(x=>x[0]===b.dataset.s); if(s[0]==='Stealth'&&S.armor&&S.armor.type!=='manual'&&S.armor.dis) adv=adv==='a'?'n':'d'; check(s[0]+(s[0]==='Stealth'&&S.armor&&S.armor.dis&&S.armor.type!=='manual'?' (armour: disadvantage)':''),skillB(s[0],s[1])); break; }
    case 'atk': attackPick(find('attacks',id)); break;
    case 'atkGo': attack(find('attacks',id),[...pickSel]); break;
    case 'pUse': usePower(find('powers',id)); break;
    case 'lib': drawLib(); break;
    case 'libSrc': libSrc=b.dataset.v; drawLib(); { const nb=sheet.querySelector('.box'); if(nb) nb.scrollTop=0; } break;
    case 'libAll': { const G=LIB[b.dataset.g]; libCreated=[]; G.items.forEach(it=>{ if(libSrc&&(it.src||'PHB')!==libSrc) return; if(!S.powers.some(p=>p.name===it.name&&p.group===G.g)) addLib(S,it,G.g); }); touch(); drawLib(); render(); libToast(G.g); break; }
    case 'libOne': { const G=LIB[b.dataset.g]; libCreated=[]; addLib(S,G.items[b.dataset.i],G.g); touch(); drawLib(); render(); libToast(G.items[b.dataset.i].name); break; }

    case 'hp': hpChange(b.dataset.k); break;
    case 'rest': closeSheet(); rest(b.dataset.k); break;
    case 'dice': drawDice(); break;
    case 'dc': dCount=Math.max(1,Math.min(100,dCount+Number(b.dataset.d))); drawDice(); break;
    case 'dm': dMod=Math.max(-99,Math.min(99,dMod+Number(b.dataset.d))); drawDice(); break;
    case 'dieRoll': { const ex=dCount+'d'+b.dataset.s; const r=rollExpr(ex,false,dMod); showResult(ex+(dMod?sg(dMod):''),[{label:'Total',big:r.total,detail:r.detail}],'',true); break; }
    case 'd20adv': { const a=d(20),c=d(20); const keep=b.dataset.v==='a'?Math.max(a,c):Math.min(a,c); showResult('d20 '+(b.dataset.v==='a'?'advantage':'disadvantage'),[{label:'Total',big:keep+dMod,detail:'['+a+', '+c+'] '+(dMod?sg(dMod):''),cls:keep===20?'crit':keep===1?'fumble':''}],'',true); break; }
    case 'exprRoll': { const ex=document.getElementById('diceExpr').value.trim(); const p=parse(ex); if(!p.dice.length){ toast('Type something like 2d6+3'); break; } const r=rollExpr(ex,false,0); showResult(ex,[{label:'Total',big:r.total,detail:r.detail}],'',true); break; }
    case 'rdec': { const r=find('resources',id); r.cur=Math.max(0,r.cur-1); touch(); render(); break; }
    case 'rinc': { const r=find('resources',id); r.cur=Math.min(r.max,r.cur+1); touch(); render(); break; }
    case 'ruse': { const r=find('resources',id); if(r.cur<=0) break; r.cur--; touch(); render(); const x=rollExpr(r.die,false,0); showResult(r.name,[{label:'Roll',big:x.total,detail:x.detail}],r.cur+'/'+r.max+' left'); break; }
    case 'pip': { const L=b.dataset.l, i=Number(b.dataset.i), sl=L==='pact'?S.pact:S.slots[L]; if(i<sl.max-sl.used) sl.used++; else sl.used--; sl.used=Math.max(0,Math.min(sl.max,sl.used)); touch(); render(); break; }
    case 'cast': castPick(find('spells',id)); break;
    case 'levelUp': openLevelUp(); break;
    case 'coffee': openCoffee(); break;
    case 'tip': buyTip(id); break;
    case 'hdUse': { const k=b.dataset.d; const p=hdPools().find(x=>x.die===k); if(!p||p.used>=p.max) break; S.hdUsed[k]=p.used+1;
      const r=rollExpr('1'+k,false,am('con')); const before=S.hp; S.hp=Math.min(hpMaxV(),S.hp+r.total); touch(); render();
      showResult('Hit Die ('+k+')',[{label:'HP regained',big:r.total,detail:r.detail}],'HP '+before+' → '+S.hp+' / '+hpMaxV()+'. '+(p.max-p.used-1)+' '+k+' left.'); break; }
    case 'hdBack': { const k=b.dataset.d; S.hdUsed[k]=Math.max(0,(Number(S.hdUsed[k])||0)-1); touch(); render(); break; }
    case 'addWx': { const w=S.attacks[b.dataset.i]; (w.extra=w.extra||[]).push({dmg:'1d4',type:''}); touch(); render(); break; }
    case 'delWx': S.attacks[b.dataset.i].extra.splice(Number(b.dataset.j),1); touch(); render(); break;
    case 'luPick': luRead(); LU.pick=id; LU.hp=null; drawLevelUp(); break;
    case 'luAvg': document.getElementById('luHp').value=b.dataset.v; LU.hp=Number(b.dataset.v); break;
    case 'luRoll': { const r=d(Number(b.dataset.d)); const v=Math.max(1,r+am('con')); document.getElementById('luHp').value=v; LU.hp=v; toast('Rolled '+r+' '+sg(am('con'))+' CON = '+v); break; }
    case 'luGo': applyLevelUp(); break;
    case 'calcSlots': { const ns=slotsFor(S.classes), pp=pactFor(S.classes); for(let i=1;i<=9;i++){ S.slots[i].max=ns[i]; S.slots[i].used=Math.min(S.slots[i].used,ns[i]); } S.pact.max=pp.max; S.pact.level=pp.level; S.pact.used=Math.min(S.pact.used,pp.max); touch(); render(); toast('Slots set from your classes'); break; }
    case 'castAt': { const sp=find('spells',id); const L=b.dataset.l; const sel=[...pickSel];
      if(L==='free'||L==='perday'||L==='none') resolveSpell(sp,Number(sp.level),L,sel); else if(L==='pact') resolveSpell(sp,S.pact.level,'pact',sel); else resolveSpell(sp,Number(L),'slot',sel); break; }
    case 'pk': { if(pickSel.has(id)) pickSel.delete(id); else pickSel.add(id); if(b.dataset.k==='w') drawAtk(find('attacks',b.dataset.o)); else drawPick(find('spells',b.dataset.o)); break; }
    case 'ftog': { const f=find('features',id); f.active=!f.active; touch(); render(); break; }
    case 'add': {
      const L=b.dataset.list; const n={id:uid()};
      if(L==='resources') Object.assign(n,{name:'',max:1,cur:1,reset:'long',die:''});
      if(L==='attacks') Object.assign(n,{name:'',ability:'str',prof:true,bonus:0,dmg:'1d6',dmgType:'',addMod:true,notes:'',extra:[]});
      if(L==='spells') Object.assign(n,SPELL_DEF,{name:''});
      if(L==='currency') Object.assign(n,{name:'New currency',amt:0});
      if(L==='items') Object.assign(n,{name:'',qty:1,notes:''});
      if(L==='classes') Object.assign(n,{name:'',sub:'',level:1,hd:'d8',cast:'none'});
      if(L==='powers') Object.assign(n,POWER_DEF,{id:n.id,res:(S.resources[0]||{}).id||''});
      if(L==='features') Object.assign(n,{name:'',text:'',active:true,effects:[]});
      S[L].push(n); touch(); render(); break; }
    case 'del': { const L=b.dataset.list; if(L==='resources'){ const r=S.resources.find(x=>x.id===id); if(r&&r.auto){ S.resDismissed=S.resDismissed||{}; S.resDismissed[r.auto]=true; } } S[L]=S[L].filter(x=>x.id!==id); if(L==='classes') syncClasses(); touch(); render(); break; }
    case 'addEff': S.features[b.dataset.i].effects.push({target:'ac',value:1}); touch(); render(); break;
    case 'delEff': S.features[b.dataset.i].effects.splice(Number(b.dataset.j),1); touch(); render(); break;
    case 'export': exportJSON(); break;
    case 'copyExp': { const t=document.getElementById('expTxt'); try{ navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{ t.select(); toast('Select all and copy'); }); }catch(err){ t.select(); } break; }
    case 'importOpen': openSheet('<h3>Import</h3><div class="sub">Pick a backup file, or paste backup text. It\'s added as a new character — nothing is replaced.</div><input type="file" id="impFile" accept=".json,application/json,text/plain" style="margin-top:8px"><textarea id="impTxt" placeholder="…or paste here" style="margin-top:8px;min-height:140px"></textarea><button class="btn pri" style="width:100%;margin-top:8px" data-act="impGo">Import</button>'); break;
    case 'impGo': { const f=document.getElementById('impFile').files[0]; if(f){ f.text().then(importText); } else importText(document.getElementById('impTxt').value); break; }
    case 'newChar': { const n=blank(); n.cid=uid(); n.name=(document.getElementById('ncName')||{}).value||'New Character'; CHARS.push(n); S=n; touch(); tab='play'; render(); openLevelUp(); break; }
    case 'switchChar': { const c=CHARS.find(x=>x.cid===b.dataset.c); if(c){ S=c; LU=null; pickSel=new Set(); touch(); tab='play'; render(); window.scrollTo(0,0); toast('Now playing '+S.name); } break; }
    case 'dupChar': { const c=CHARS.find(x=>x.cid===b.dataset.c); const n=normalize(JSON.parse(JSON.stringify(c))); n.cid=uid(); n.name=(c.name||'Character')+' (copy)'; CHARS.push(n); touch(); render(); toast('Copied '+c.name); break; }
    case 'delChar': { if(CHARS.length<2) break; const i=CHARS.findIndex(x=>x.cid===b.dataset.c); const gone=CHARS.splice(i,1)[0]; if(S===gone) S=CHARS[0]; touch(); render(); toast('Deleted '+gone.name); break; }
    case 'exportChar': { const c=CHARS.find(x=>x.cid===b.dataset.c); exportJSON(c); break; }
    case 'cur': { const c=find('currency',id); const a=Math.abs(Number(document.getElementById('curAmt').value))||1; c.amt=(Number(c.amt)||0)+a*Number(b.dataset.d); touch(); render(); break; }
    case 'potUse': usePotion(find('potions',id)); break;
    case 'potQty': { const p=find('potions',id); p.qty=Math.max(0,(Number(p.qty)||0)+Number(b.dataset.d)); touch(); render(); break; }
    case 'potEnd': S.features=S.features.filter(f=>f.id!==id); touch(); render(); toast('Effect ended'); break;
    case 'potFxAdd': { const p=S.potions[b.dataset.i]; (p.fx=p.fx||[]).push({target:'ac',value:1}); touch(); render(); break; }
    case 'potFxDel': S.potions[b.dataset.i].fx.splice(Number(b.dataset.j),1); touch(); render(); break;
    case 'qty': { const it=find('items',id); it.qty=Math.max(0,(Number(it.qty)||0)+Number(b.dataset.d)); touch(); render(); break; }
    case 'prep': { const sp=find('spells',id); sp.prep=sp.prep==='prepared'?'unprepared':'prepared'; touch(); render(); break; }
    case 'rmPortrait': S.portrait=''; touch(); render(); break;
    case 'loadEx': { const n=example(); n.cid=uid(); CHARS.push(n); S=n; touch(); tab='play'; render(); toast('Example character added'); break; }
  }
});
render();
if(EDITION==='store'&&!window.claude&&'serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){} }
})();
</script>
